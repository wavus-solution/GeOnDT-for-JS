    function saveCurrentThemePreset(name){
        const normalizedName = String(name ?? '').trim().slice(0, 40);
        if(!normalizedName){
            toast('프리셋 이름을 입력해 주세요');
            $('#preset-name-input').trigger('focus');
            return false;
        }

        const isDuplicateName = getAllThemePresets().some(
            preset => preset.name.toLocaleLowerCase() === normalizedName.toLocaleLowerCase()
        );
        if(isDuplicateName){
            toast('같은 이름의 프리셋이 이미 있습니다');
            $('#preset-name-input').trigger('select');
            return false;
        }
        if(!ensureAllMapSettingsReady()) return false;

        const newPreset = {
            id: createUserThemePresetId(),
            name: normalizedName,
            isBuiltIn: false,
            settingsByMapType: captureCurrentThemePresetSettings(),
        };
        userThemePresets.push(newPreset);
        const isPersisted = persistThemePresetState();
        selectedThemePresetId = null;
        highlightedThemePresetId = null;
        renderThemePresetList();
        closePresetNameDialog(false);
        toast(isPersisted
            ? `'${newPreset.name}' 프리셋을 저장했습니다`
            : `'${newPreset.name}' 프리셋을 현재 페이지에만 저장했습니다`);
        return true;
    }

    function updateSelectedThemePreset(){
        const selectedPreset = getSelectedThemePreset();
        if(!selectedPreset) return false;

        clearThemePresetHighlight();
        if(!confirm(`선택된 '${selectedPreset.name}' 을  현재 지도 설정값으로 수정합니다`)){
            clearThemePresetSelection();
            return false;
        }
        if(!ensureAllMapSettingsReady()){
            clearThemePresetSelection();
            return false;
        }

        const currentSettings = captureCurrentThemePresetSettings();
        if(selectedPreset.isBuiltIn){
            // 하드코딩 원본은 유지하고 수정본만 저장해야 소스 기본값과 사용자 변경값의 소유권이 섞이지 않습니다.
            defaultThemePresetOverrides[selectedPreset.id] = currentSettings;
        }else{
            const userPreset = userThemePresets.find(preset => preset.id === selectedPreset.id);
            if(!userPreset){
                clearThemePresetSelection();
                return false;
            }
            userPreset.settingsByMapType = currentSettings;
        }

        const isPersisted = persistThemePresetState();
        clearThemePresetSelection();
        renderThemePresetList();
        toast(isPersisted
            ? `'${selectedPreset.name}' 프리셋을 수정했습니다`
            : `'${selectedPreset.name}' 프리셋을 현재 페이지에서만 수정했습니다`);
        return true;
    }

    function deleteSelectedThemePreset(){
        const selectedPreset = getSelectedThemePreset();
        if(!selectedPreset) return false;

        clearThemePresetHighlight();
        if(!confirm(`선택된 '${selectedPreset.name}' 을 삭제합니다.`)){
            clearThemePresetSelection();
            return false;
        }

        if(selectedPreset.isBuiltIn){
            deletedDefaultThemePresetIds.add(selectedPreset.id);
            delete defaultThemePresetOverrides[selectedPreset.id];
        }else{
            userThemePresets = userThemePresets.filter(preset => preset.id !== selectedPreset.id);
        }
        const isPersisted = persistThemePresetState();
        selectedThemePresetId = null;
        highlightedThemePresetId = null;
        renderThemePresetList();
        toast(isPersisted
            ? `'${selectedPreset.name}' 프리셋을 삭제했습니다`
            : `'${selectedPreset.name}' 프리셋을 현재 페이지 목록에서만 삭제했습니다`);
        return true;
    }

    /**
     * 벡터 WMS 표시 상태
     * isVisible... 값은 탭 전환 중 레이어를 잠시 숨겼다가 벡터 탭으로 돌아올 때 원래 체크 상태를
     * 복원하기 위한 영구 UI 상태입니다. 레이어 표시만 바꾸고 이 값을 누락하면 탭 이동 후 상태가 달라집니다.
     */
    $(document).on('change', '#osmRoadWMS, #osmWaterWayWMS, #osmBoundaryWMS', function () {
        const controls = {
            osmRoadWMS: {
                layer: osmRoadLayer,
                setVisible: value => { isVisibleOSMRoadLayer = value; },
            },
            osmWaterWayWMS: {
                layer: osmWaterWayLayer,
                setVisible: value => { isVisibleOSMWaterWayLayer = value; },
            },
            osmBoundaryWMS: {
                layer: osmBoundaryLayer,
                setVisible: value => { isVisibleOSMBoundaryLayer = value; },
            },
        };
        const control = controls[this.id];
        const isVisible = applyVectorLayerVisibility(this.id, control.layer, this.checked);
        control.setVisible(isVisible);
    });

    $(document).on('input', '#osm-road-brightness', function () {
        setOSMRoadLayerBrightness(this.value);
    });

    $(document).on('input', '#osm-road-contrast', function () {
        setOSMRoadLayerContrast(this.value);
    });

    $(document).on('input', '#osm-road-saturation', function () {
        setOSMRoadLayerSaturation(this.value);
    });

    $(document).on('input', '#osm-road-hue-rotation', function () {
        setOSMRoadLayerHueRotation(this.value);
    });

    $(document).on('input', '#osm-road-opacity', function () {
        setOSMRoadLayerOpacity(this.value);
    });

    $(document).on('input', '#osm-waterway-brightness', function () {
        setOSMWaterWayLayerBrightness(this.value);
    });

    $(document).on('input', '#osm-waterway-contrast', function () {
        setOSMWaterWayLayerContrast(this.value);
    });

    $(document).on('input', '#osm-waterway-saturation', function () {
        setOSMWaterWayLayerSaturation(this.value);
    });

    $(document).on('input', '#osm-waterway-hue-rotation', function () {
        setOSMWaterWayLayerHueRotation(this.value);
    });

    $(document).on('input', '#osm-waterway-opacity', function () {
        setOSMWaterWayLayerOpacity(this.value);
    });

    $(document).on('input', '#osm-boundary-brightness', function () {
        setOSMBoundaryLayerBrightness(this.value);
    });

    $(document).on('input', '#osm-boundary-contrast', function () {
        setOSMBoundaryLayerContrast(this.value);
    });

    $(document).on('input', '#osm-boundary-saturation', function () {
        setOSMBoundaryLayerSaturation(this.value);
    });

    $(document).on('input', '#osm-boundary-hue-rotation', function () {
        setOSMBoundaryLayerHueRotation(this.value);
    });

    $(document).on('input', '#osm-boundary-opacity', function () {
        setOSMBoundaryLayerOpacity(this.value);
    });

    $(document).on('click', '#theme-preset-list .theme-preset-list-item', function (event) {
        if($(event.target).closest('.btn-load-theme-preset-item').length > 0) return;
        selectThemePreset($(this).attr('data-preset-id'));
        this.focus();
    });

    // Tab 키로 행에 진입한 경우에도 마우스 클릭과 같은 수정·삭제 대상을 선택합니다.
    $(document).on('focusin', '#theme-preset-list .theme-preset-list-item', function (event) {
        if(event.target === this)
            selectThemePreset($(this).attr('data-preset-id'));
    });

    /**
     * 행에서 포커스가 빠지면 하이라이트를 즉시 지웁니다. 오른쪽 패널 안에서 Tab 키로 이동하는 동안에는
     * 이어지는 불러오기·수정·삭제가 대상을 사용할 수 있도록 ID만 유지하고, 패널 밖으로 이동하면
     * 논리적 선택도 함께 해제합니다.
     */
    $(document).on('focusout', '#theme-preset-list .theme-preset-list-item', function (event) {
        const staysInPresetPanel = $(event.relatedTarget).closest('#theme-preset-control-panel').length > 0;
        clearThemePresetHighlight();
        if(!staysInPresetPanel) clearThemePresetSelection();
    });

    // 목록 행은 방향키/Home/End로 이동하고 Enter/Space로 현재 행을 선택할 수 있습니다.
    $(document).on('keydown', '#theme-preset-list .theme-preset-list-item', function (event) {
        if($(event.target).closest('.btn-load-theme-preset-item').length > 0) return;

        const items = $('#theme-preset-list .theme-preset-list-item');
        const currentIndex = items.index(this);
        let nextIndex = currentIndex;

        if(event.key === 'ArrowDown') nextIndex = Math.min(currentIndex + 1, items.length - 1);
        else if(event.key === 'ArrowUp') nextIndex = Math.max(currentIndex - 1, 0);
        else if(event.key === 'Home') nextIndex = 0;
        else if(event.key === 'End') nextIndex = items.length - 1;
        else if(event.key === 'Enter' || event.key === ' '){
            event.preventDefault();
            selectThemePreset($(this).attr('data-preset-id'));
            return;
        }
        else return;

        event.preventDefault();
        selectThemePreset($(items[nextIndex]).attr('data-preset-id'), true);
    });

    // 각 행의 불러오기 버튼은 별도의 행 선택 없이 자신의 data-preset-id만으로 프리셋을 적용합니다.
    $(document).on('click', '.btn-load-theme-preset-item', function (event) {
        event.stopPropagation();
        const presetId = $(this).attr('data-preset-id');
        const preset = getAllThemePresets().find(item => item.id === presetId) ?? null;
        const isLoaded = loadThemePreset(preset);
        clearThemePresetSelection();
        if(isLoaded && preset)
            toast(`'${preset.name}' 프리셋을 불러왔습니다`);
    });

    $(document).on('click', '.btn-save-theme-preset', function () {
        clearThemePresetSelection();
        openPresetNameDialog();
    });

    $(document).on('click', '.btn-update-theme-preset', function () {
        updateSelectedThemePreset();
    });

    $(document).on('click', '.btn-delete-theme-preset', function () {
        deleteSelectedThemePreset();
    });

    // 지도나 왼쪽 설정 팝업처럼 프리셋 조작 영역 밖을 누르면 보이지 않는 선택 상태도 남기지 않습니다.
    $(document).on('pointerdown', function (event) {
        const keepsSelection = $(event.target).closest(
            '#theme-preset-list .theme-preset-list-item, .theme-preset-actions, .preset-name-dialog'
        ).length > 0;
        if(!keepsSelection) clearThemePresetSelection();
    });

    $(document).on('submit', '.preset-name-dialog', function (event) {
        event.preventDefault();
        saveCurrentThemePreset($('#preset-name-input').val());
    });

    $(document).on('click', '.btn-cancel-theme-preset', function () {
        closePresetNameDialog();
    });

    $(document).on('click', '.preset-name-dialog-backdrop', function (event) {
        if(event.target === this) closePresetNameDialog();
    });

    $(document).on('keydown', function (event) {
        if(event.key === 'Escape' && !$('.preset-name-dialog-backdrop').prop('hidden')){
            event.preventDefault();
            closePresetNameDialog();
        }
    });

    // 준비 검사를 통과해 setter가 실행된 뒤의 값을 다음 조작을 위한 원복 기준값으로 저장합니다.
    $(document).on('input change', SETTINGS_INPUT_SELECTOR, function () {
        rememberSettingInputValue(this);
    });
</script>
</body>
</html>
