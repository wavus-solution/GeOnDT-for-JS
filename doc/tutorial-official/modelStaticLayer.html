<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

            maxprocess: 2, //+ process 최대값
            interpolationheight: true,  //+ 고도보간 기능 사용 여부

    let LayerList = function (Union3D, app) {
        return {
            //이미지레이어
            satellite: new ImageLayer(Union3D, app, LAYER_OPT.satellite),

        const API_KEY = 'YKAFjxVvNJEA/S1xcEjprW49M6wQSAva3PC7u3KHJxrZ3ZaTVfN40QdiqzAYrFf5';
        const serverURL = 'https://3d.geon.kr/';
        //초기 지도 위치 설정 (여의도)
        app.setHomePosition(126.91415231094318, 37.53189615862187, 450, 0, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition(); //+ home position 수정

        //이미지 레이어 생성
        let layers = new LayerList(Union3D, app);
        let initLayerList = ['satellite', 'korea_terrain']
        initLayar(initLayerList);

        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayar(list) {
            const basename = list[0];
            Union3D.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);

                            app.showLayer(name, true);
                            $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }

        refreshObjectList();


        function createModelStaticLayer(listModel) {
            const opt = {
                name: "staticLayer",
                needtexture: true,
                needxml: false,
                drawline: false,
                listmodel: listModel
            }
            let layer = new Union3D.model.U3dModelStaticLayer(opt);
            app.addLayer(layer);
            app.showLayer(layer.getName(), true);

            layer.ready.then(function () {
                app.fitLayerExtent(opt.name);
            });

            window.layer = layer;
        }

        ////////////////////////////////////////////////////////////////////////////////////

        function refreshObjectList() {
            $(".select-object-model").empty();
            $(".select-object-road").empty();
            $(".div-upload-object-list").empty();
            const callback = function (infoList, selector) {
                window.infoListSize += infoList.length;
                for (let info of infoList) {
                    let name = info.name;
                    selector.append(
                        '<option value="' + name + '">' + name + '</option>'
                    );
                    getRegisteredObject(name).then(function (info) {
                        let listModel = {
                            name: info.name,
                            baseurl: info.baseUrl,
                            fileName: info.metaData.modelURL,
                            crs: 'EPSG:5186',
                            ext: info.metaData.format
                        }
                        window.listModel.push(listModel);
                        appendUploadList(name, '완료');
                        if (--window.infoListSize === 0) {
                            console.log("서버 정보 불러오기 완료");
                            createModelStaticLayer(window.listModel);
                        }
                    }).catch(function () {
                        console.log(name + "레이어 정보 불러오기 오류");
                    });


                }
                selector.children().first().attr("selected", "selected");
            }
            //+ 서버에 등록된 컴포넌트 리스트 가져오기, getRegisteredObjectList(type);
            getRegisteredObjectList("3ds").then((infoList) => {
                callback(infoList, $(".select-object-model"));
            });
            getRegisteredObjectList("obj").then((infoList) => {
                callback(infoList, $(".select-object-road"));
            });
        }

        // 서버에서 받아온 Componenete들을 dom 객체에 append
        function appendUploadList(name, process) {
            let rowName = "upload-row-" + name
            $(".div-upload-object-list").append(
                '<div class="' + rowName + ' col-sm-12">' +
                '<div class="rowName col-sm-3">' +
                '<label class="' + rowName + ' row-name">' + name + '</label>' +
                '</div>' +
                '<div class="col-sm-3">' +
                '<label class="' + rowName + ' row-process">' + process + '</label>' +
                '</div>' +
                '<div class="col-sm-6">' +
                '<button class="btn btn-info btn-block button-upload-object-up ' + rowName + '" value="' + name + '" data-toggle="tooltip">100m 높이기</button>' +
                '<button class="btn btn-info btn-block button-upload-object-move ' + rowName + '" value="' + name + '" data-toggle="tooltip">이동</button>' +
                '<button class="btn btn-info btn-block button-upload-object-show ' + rowName + '" value="' + name + '" data-toggle="tooltip">끄기</button>' +
                '<button class="btn btn-danger btn-block button-upload-object-delete ' + rowName + '" value="' + name + '" data-toggle="tooltip">삭제</button>' +
                '</div>' +
                '</div>'
            );

            //업로드 컴포넌트 삭제
            $("button.button-upload-object-delete." + rowName).on("click", function (e) {
                let name = $(e.target).val();
                if (confirm("서버에 등록된 컴포넌트를 삭제합니다") === true) {
                    deleteRegisteredObject(name).then(function () {
                        refreshObjectList();
                    });
                }
            });
            //업로드 컴포넌트 이동
            $("button.button-upload-object-move." + rowName).on("click", function (e) {
                let name = $(e.target).val();
                let object = layer.getObject(name);
                if (object) {
                    let position = object.position;
                    app.setCameraPosition(position.x, position.y, position.z, 0, 45, 300, 1000);
                }

            });

            //업로드 컴포넌트 이동
            $("button.button-upload-object-up." + rowName).on("click", function (e) {
                let name = $(e.target).val();
                let object = layer.getObject(name);
                if (object) {
                    let position = object.position;
                    if ($(e.target).text() === '100m 높이기') {
                        position.z = position.z + 100;
                        app.updateData();
                        $(e.target).text('원복');
                    } else {
                        position.z = position.z - 100;
                        app.updateData();
                        $(e.target).text('100m 높이기');
                    }
                }

            });
            //업로드 컴포넌트 보기
            $("button.button-upload-object-show." + rowName).on("click", function (e) {
                let name = $(e.target).val();

                if ($(e.target).text() === '끄기') {
                    layer.showObject(name, false);
                    $(e.target).text('켜기');
                } else {
                    layer.showObject(name, true);
                    $(e.target).text('끄기');
                }

            });
            return rowName;
        }

        //서버에 등록된 컴포넌트 리스트 가져오기
        function getRegisteredObjectList(type) {
            var promise = $.Deferred();
            const SEARCH_TYPE = type;
            let params = 'type=' + SEARCH_TYPE;
            $.ajax({
                url: serverURL + 'v1/layers?' + params,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('User-Authorization', API_KEY);
                }
            }).then(function (e) {
                const infoList = e.params.data;
                infoList.sort(function (a, b) {
                    if (a.name > b.name) {
                        return 1;
                    } else {
                        return -1;
                    }

                });
                let resultList = [];
                for (let info of infoList) {
                    if (info.category === "object") {
                        resultList.push(info);
                    }
                }
                promise.resolve(resultList);
            });
            return promise;
        }

        //서버에 등록된 레이어의 정보를 가져옵니다.
        function getRegisteredObject(name) {
            let promise = $.Deferred();
            $.ajax({
                url: serverURL + 'v1/layer/' + name,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('User-Authorization', API_KEY);
                }
            }).then(function (e) {
                promise.resolve(e.params.data);
            }).catch(function (e) {
                promise.reject(false);
            });
            return promise;
        }


        // 버튼토글, 클릭시 (활성화, 비활성화) 전환
        $(document).on('click', '.btn', function () {
            const $this = $(this);
            if ($this.hasClass('toggle')) {
                let active = $this.hasClass('active');
                $('.btn').removeClass('active');
                if (!active) {
                    $this.addClass('active');
                }
            }
        });

        function upload() {
            let name = $(".upload-object-name").val();
            let crs = $(".upload-object-crs").val();
            if (!name || name === "") {
                alert("모델 이름을 입력해 주세요");
                return false;
            }
            let files = $('input[type="file"]')[0].files;
            if (files.length === 0) {
                alert("파일을 선택해 주세요");
                return false;
            }
            let formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }
            formData.append('name', name);
            if (crs) {
                formData.append('crs', crs);
            }
            formData.append('category', 'object');
            const rowName = appendUploadList(name, "0 %");
            return $.ajax({
                url: serverURL + 'v1/ComponentLayer/upload',
                method: 'POST',
                enctype: 'multipart/form-data',
                processData: false,
                contentType: false,
                cache: false,
                data: formData,
                xhr: function () {
                    //bind LayerItem
                    let xhr = $.ajaxSettings.xhr();
                    xhr.upload.onprogress = function (e) {
                        let per = e.loaded * 100 / e.total;
                        $("." + rowName + ".row-process").text(per + " %");
                    };
                    return xhr;
                },
                success: function () {
                    refreshObjectList()
                },
                error: function (e) {
                    $("." + rowName + ".row-process").text("실패");
                    if (e.responseJSON != null)
                        console.log(e.responseJSON.message);
                    else if (e.responseText != null) {
                        console.log(e.responseText);
                    }

                }
            });
        }

        function deleteRegisteredObject(name) {
            return $.ajax({
                url: serverURL + '/v1/layer/' + name,
                method: "DELETE",
                success: function (e) {
                    console.log("등록된 컴포넌트 삭제 성공");
                },
                error: function (e) {
                    console.log(e.responseJSON.message);
                }
            });
        }

        $('.btn[name="submit-object"]').on('click', function () {
            upload();
        });

    });
</script>
</body>
</html>
