    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="css/example-index.css" type="text/css">
    <script>
        // 화면이 그려지기 전에 테마를 정해 화면이 한 번 번쩍이는 것을 막습니다.
        // 상단 전환 버튼으로 직접 고른 적이 없으면 운영체제 설정을 따릅니다.
        (function () {
            var stored = null;
            try {
                stored = localStorage.getItem('geondt-example-theme');
            } catch (error) {
                // 저장소를 막아 둔 환경에서는 이번 방문 동안만 운영체제 설정을 따릅니다.
                stored = null;
            }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = stored === 'dark' || stored === 'light'
                ? stored
                : (prefersDark ? 'dark' : 'light');
        }());
    </script>
