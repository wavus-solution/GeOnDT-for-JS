<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (GeOnDT, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = GeOnDT;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

        vctr_bound_model: {
            name: 'vctr_bound_model',
            url: 'https://xdworld.vworld.kr/TDServer/services/poi/POI_BOUND/tileset.json', //vctr tileset.json 위치 주소
            imgUrl: 'https://xdworld.vworld.kr/TDServer/vworld_Icon/',//이미지 주소
            imgExt:'.png', //이미지 확장자
            apikey: '',
            position: {x: 126.978, y: 37.565, z: 600, rotateX: 2, rotateY: 60},
            heightOffset: 20, // 높이 보정 값, 최소 높이 + heightOffset 값으로 출력
            viewSizeOffset :1,
            font:'Nanum Gothic'
        },
        vctr_base_model: {
            name: 'vctr_base_model',
            url: 'https://xdworld.vworld.kr/TDServer/services/poi/POI_BASE/tileset.json',
            imgUrl: 'https://xdworld.vworld.kr/TDServer/vworld_Icon/',
            imgExt:'.png',
            apikey: '',
            position: {x: 126.978, y: 37.565, z: 600, rotateX: 2, rotateY: 60},
            heightOffset: 5,// 높이 보정 값, 최소 높이 + heightOffset 값으로 출력
            viewSizeOffset : 1,
            font:'Nanum Gothic'
        },
      
    }

    let layers = {};
    //라이센스 인증
    GeOnDT.ready(function () {
        //지도 기본 세팅///////////////////////////////////////
        window.app = new GeOnDT.U3dAPP({
            containername: 'map',
        });

        app.on('change', updatePosData);
        app.createloadingBar('load');
        app.loadingBar();

        app.setHomePosition(126.978, 37.565, 1000, 2, 25);
        app.updateHomePosition();

        //이미지 레이어 생성
        let layers = new LayerList(GeOnDT, app);
        let initLayerList = ['satellite', 'korea_terrain']
        initLayar(initLayerList);

        createTilesLayer('vctr_bound_model')
        createTilesLayer('vctr_base_model')

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// event 등록 ///////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////
        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });
        $(document).on('click', 'input[type=checkbox]', checked);
        $(document).on('click', '.move', move);
        $(document).on('click', '.delete', deleteFunc);

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// function 선언 ////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayar(list) {
            const basename = list[0];
            GeOnDT.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);

                            app.showLayer(name, true);
                            $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }
        function createTilesLayer(name) {
            if (layers[name] === name)
                return;

            //+ 서버 등록건물
            let optionInfo = LAYER_OPT_[name];
            let modellayer = new GeOnDT.model.U3dVectorTileLayer({
                name: name,
                useproxy: false,
                baseurl: optionInfo.url,
                ext: '.vctr',
                minlevel: 19,
                maxlevel: 19,
                apikey: optionInfo.apikey,
                usebox: false,
                autoHeight: false,
                imgUrl: optionInfo.imgUrl,
                imgExt: optionInfo.imgExt,
                heightOffset : optionInfo.heightOffset,
                viewSizeOffset: optionInfo.viewSizeOffset,
                font: optionInfo.font
            });
            app.addLayer(modellayer);

            modellayer.then(function () {
                app.fitLayerExtent(name, false, 700).then(function () {
                    console.log(name + " 이동 완료");
                }).catch(function () {
                    console.log(name + " 이동 오류");
                });

                app.showLayer(name, true);
            });
            layers[name] = name;

        }

        function removeLayer(name) {
            if (layers[name] != name)
                return;

            app.removeLayer(name);
            layers[name] = undefined;
        }

        function checked(e) {
            let $checkbox = $(e.target);
            let name = $checkbox.attr('target');
            createTilesLayer(name);

            if ($checkbox[0].checked) {
                app.showLayer(name, true)
            } else {
                app.showLayer(name, false)
            }

        }

        function move(e) {
            e.preventDefault();
            let name = $($(this).siblings()[0]).attr('target');
            let pos = LAYER_OPT_[name].position;

            let delayTime = 4000;
            app.setCameraGeographicPosition(pos.x, pos.y, pos.z, pos.rotateX, pos.rotateY, delayTime);
        }

        function deleteFunc(e) {
            e.preventDefault();
            let name = $($(this).siblings()[0]).attr('target');
            removeLayer(name);
            $($(this).siblings()[0]).prop('checked', false);
        }

    });
</script>
</body>
</html>
