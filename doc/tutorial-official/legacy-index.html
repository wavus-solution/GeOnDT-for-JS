<script src="../common/jquery/jquery-3.7.1.min.js"></script>
<script>
    const dataServerUrl = 'https://dt-data.mappick.co.kr/ServiceData/';
    $(document).ready(function () {
        let $catagorey = $(".navigation").children('ul');

        //카테고리 첫 리스트를 읽어 로드
        let $firstli = $catagorey.find('.link:first');
        let url = $firstli.attr("target");
        $.ajax({
            url: url,
            method: "GET"
        }).done(function (json) {
            findTileAndPre(json, url);
        }).fail(function (xhr, status, errorThrown) {
            console.log(errorThrown + "," + status)
        });

        setLabel($catagorey);
    });

    $(document).on('click', 'summary', function () {
        let $summary = $(this);
        let $details = $summary.closest('details');
        let $maker = $summary.find('.glyphicon');
        if ($details.attr('open') === 'open') {
            $maker.removeClass("glyphicon-chevron-down");
            $maker.addClass("glyphicon-chevron-right");
        } else {
            $maker.removeClass("glyphicon-chevron-right");
            $maker.addClass("glyphicon-chevron-down");
        }
    });

    $(document).on('click', '.link', function () {
        let url = $(this).attr("target")
        $.ajax({
            url: url,
            method: "GET"
        }).done(function (json) {
            findTileAndPre(json, url);
        }).fail(function (xhr, status, errorThrown) {
            console.log(errorThrown + "," + status)
        });
    });

    $(document).on('keyup', '#input-search', function (e) {
        const keywords = String(this.value || '')
            .toLowerCase()
            .trim()
            .split(/\s+/)
            .filter(Boolean);

        let $itemClass = $(".navigation").children('ul').children();

        $itemClass.each(function (i, v) {
            let li = $(v).find('li');
            let search = false;

            $(li).each(function (i, liEl) {
                const $child = $(liEl).children();

                // val()이 없는 요소일 수도 있으므로 text()도 fallback 처리
                const itemValue = $child.val() ?? $child.text();

                const str = String(itemValue || '')
                    .replace('+ ', '')
                    .toLowerCase();

                // 검색어가 비어있으면 전체 표시
                // 검색어 중 하나라도 포함되면 표시
                const matched = keywords.length === 0 ||
                    keywords.some(function (keyword) {
                        return str.includes(keyword);
                    });

                if (matched) {
                    $(liEl).removeClass('hide');
                    search = true;
                } else {
                    $(liEl).addClass('hide');
                }
            });

            if (search) {
                $(v).find('details').removeClass('hide');
                $(v).css('border-bottom', '1px solid #333');
            } else {
                $(v).find('details').addClass('hide');
                $(v).css('border', '0');
            }
        });
    });

    function findTileAndPre(json, url) {
        let parser = new DOMParser();
        let dom = parser.parseFromString(json, "text/html");
        let title = dom.getElementsByTagName('title')[0].text;
        let ex = dom.getElementsByClassName('ex-explanation');
        $(ex).removeAttr('hidden');
        $("#title").text(title);

        let $explanation = $("#explanation");
        $explanation.empty();
        $explanation.append(ex);

        //var special_pattern = /\W|\s/g;
        let imgName = title.replace(/ /g, '');
        $explanation.append(`<img alt="${title}" src= "${dataServerUrl}thumbnails/${imgName}.png">`);
        let $example = $("#example");
        $example.empty();
        let str = `<a href="${url}"><span class="glyphicon glyphicon-expand"></span>  ${title} </a>`
        $example.append(str)
    }

    function setLabel(catagorey) {
        let startNum = catagorey.find('.start').children().length;
        let analyNum = catagorey.find('.analysis').children().length;
        let imageNum = catagorey.find('.image').children().length;
        let modelNum = catagorey.find('.model').children().length;
        let viewNum = catagorey.find('.view').children().length;
        let droneNum = catagorey.find('.drone').children().length;
        let indoorNum = catagorey.find('.indoor').children().length;
        let etcNum = catagorey.find('.etc').children().length;

        $("#start").text(startNum);
        $("#analysis").text(analyNum);
        $("#image").text(imageNum);
        $("#model").text(modelNum);
        $("#view").text(viewNum);
        $("#drone").text(droneNum);
        $("#indoor").text(indoorNum);
        $("#etc").text(etcNum);
    }
</script>
