<script id="ui-event">
    const homePositon = {lat: 126.949, lon : 37.470, height :3000, left : 138, down: 79};

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-image">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 17, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
        }
    };

    let LayerList = function (Union3D, app) {
        return {
            //이미지레이어
            satellite: new ImageLayer(Union3D, app, LAYER_OPT.satellite),
            base: new ImageLayer(Union3D, app, LAYER_OPT.base),
            hybrid: new ImageLayer(Union3D, app, LAYER_OPT.hybrid),
            osm: new ImageLayer(Union3D, app, LAYER_OPT.osm),
            google: new ImageLayer(Union3D, app, LAYER_OPT.google),
            emapsat: new ImageLayer(Union3D, app, LAYER_OPT.emapsat),
            emapbase: new ImageLayer(Union3D, app, LAYER_OPT.emapbase),

            //고도레이어
            korea_terrain: new HeightLayer(Union3D, app, LAYER_OPT.korea_terrain)
        }
    }
</script>
<script id="main">
    //라이센스 인증
    GeOnDT.ready(function () {
        //지도 초기화
        const app = new GeOnDT.U3dAPP({
            containername:'map',
            methodheight: 'raw', //+ 지형처리방법
            searchtype:'sphere', //+ 타일검색 방법
            useFog: true, // 환경 안개 설정 (미입력시 기본값 true)
            useshadowmap: true,  //+ 광원,그림자 적용 (미입력시 기본값 true)
            frameOptimize : true, //+ 프레임 별 동적 옵션 적용 여부 (미입력시 기본값 true)
            autoClear: true, //자동 리소스 정리 여부 (미입력시 기본값 true)
            ratioTileSize: 1, // (미입력시 기본값 1)
            ratioModelTileSize: 1, // (미입력시 기본값 1)
            modelUpdateOffset: 0, //모델 업데이트 중심점 이동
        });
        window.app = app;

        app.on('change', updatePosData);
        app.setHomePosition(homePositon.lat, homePositon.lon, homePositon.height, homePositon.left, homePositon.down); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();

        app.createloadingBar('load');
        app.loadingBar();

        window.layers = new LayerList(GeOnDT, app);
        window.initLayerList = ['satellite','korea_terrain'];
        initLayer(initLayerList);
        initModelLayers();

        window.analy = app.getAnalysis('SkyLine');
    });
</script>
<script id="event">
    $(document).on('click', '#btn-analyActive', function (e) {
        if(window.analy.isActive()){
            window.analy.deactive();
            $(this).text('스카이라인 분석 시작');
            $('#div-screenInfo').hide();

            if(window.intervalId){
                clearInterval(window.intervalId);
                window.intervalId = undefined;
            }

        }else{
            window.analy.active();
            window.analy.setStyle({
                lineColor: $('#color-line').val(),
                overColor: $('#color-over').val(),
                useGroundColor: $('#check-useGround')[0].checked,
                groundColor: $('#color-ground').val(),
                useSkyColor: $('#check-useSky')[0].checked,
                skyColor: $('#color-sky').val(),
            });

            $(this).text('스카이라인 분석 종료');

            $('#div-screenInfo').show();
            if(window.intervalId)
                clearInterval(window.intervalId);
            window.intervalId = setInterval(()=>{
                analy.getScreenInfo().then((info)=>{
                    const {sky,ground,over,total} = info;
                    $('#pt-skyRate').text(((sky/total)*100).toFixed(2) +'%');
                    $('#pt-groundRate').text(((ground/total)*100).toFixed(2) +'%');
                    $('#pt-overRate').text(((over/total)*100).toFixed(2) +'%');
                }).catch(()=>{
                     console.log('스카이라인 분석 오류');
                });
            },1000);
        }
    });

    $(document).on('change', '#color-line', function () {
        window.analy.setStyle({
            lineColor: this.value
        });
    });

    $(document).on('change', '#color-over', function () {
        window.analy.setStyle({
            overColor: this.value
        });
    });

    $('#check-useSky').click((e)=>{
        window.analy.setStyle({
            useSkyColor: e.target.checked,
            skyColor: $('#color-sky').val()
        });
    });

    $('#check-useGround').click((e)=>{
        window.analy.setStyle({
            useGroundColor: e.target.checked,
            groundColor: $('#color-ground').val()
        });
    });

    $(document).on('change', '#color-sky', function () {
        window.analy.setStyle({
            useSkyColor: $('#check-useSky')[0].checked,
            skyColor: this.value
        });
    });

    $(document).on('change', '#color-ground', function () {
        window.analy.setStyle({
            useGroundColor: $('#check-useGround')[0].checked,
            groundColor: this.value
        });
    });
</script>
<script id="function">
    function checkLayer(name, checked) {
        if (checked) {
            if (layers[name].layer === undefined) {
                layers[name].create();
            }
            layers[name].show(true);
        } else {
            layers[name].show(false);
        }
    }

    function initLayer(list) {
        const basename = list[0];
        GeOnDT.UDEF.createPromise((resolve) => {
            list.forEach((name) => {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                    layers[name].ready.then(() => {
                        if (name === basename)
                            app.setNameBaseLayer(name);

                        app.showLayer(name, true);
                        $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                    });
                }
            });
            resolve(true);
        }).then((resolve) => {
            if (resolve)
                app.endloadingBar();
        });
    }

    function initModelLayers() {
        try {
            window.modelayers = app.createModelGroupLayer({
                maxlevel: 19,
                minlevel: 17,
                name: 'u3f'
            });
            /* request U3f layers list */
            $.ajax({
                url: modelU3fURL,
                crossDomain: true,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                },
                error: function (e) {
                    console.info(e);
                }
            }).then(function (result) {
                let infos = result.params.data;
                for (let i = 0; i < infos.length; i++) {
                    let info = infos[i];
                    /* 레이어 목록 중 발행중인 레이어만 요청 */
                    if (info.state === "ACTIVE") {
                        let baseName = info.fileName;
                        if(!baseName || baseName ==='')
                            baseName = info.name;
                        let options = {
                            name: info.name,
                            basename: baseName,
                            baseurl: info.baseUrl,
                            useproxy: false,
                            minlevel: info.metaData.minLevel,
                            maxlevel: info.metaData.maxLevel,
                            compressmodel: true,
                            isShareMaterial: false,
                            makeU3FPackage: 1
                        };
                        let subLayer = app.create3DFModelLayer(options);
                        if(subLayer !== false){
                            subLayer.then(function (layer) {
                                window.modelayers.addLayer(subLayer);
                                if(i === infos.length -1){
                                    console.log("u3f model layer load");
                                    app.showLayer(window.modelayers.getName(),true);
                                }
                            }).fail(function (layer) {

                            });
                        }
                    }
                }
            });
        } catch (e) {
            console.log('Initialize Error Message : ' + e);
        }
    }
</script>
