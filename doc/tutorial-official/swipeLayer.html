<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

            //+ 건물 ///////////////////////////////////////////////////////
            _25d: {
                name: '_25d', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                layername: layerInfo.wfs_korea.layername, //+ 레이어 이름, *필수 입력
                baseurl: layerInfo.wfs_korea.baseurl, //+ baseurl, *필수 입력
                fieldfloor: layerInfo.wfs_korea.fieldfloor, //+ 층수 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
                fieldheightfloor: layerInfo.wfs_korea.fieldheightfloor,
                floorheight: layerInfo.wfs_korea.floorheight, //+ 층수 높이 필드
                fieldlabel: layerInfo.wfs_korea.fieldlabel, //+ 라벨로 사용할 필드, defaultValue(opt.fieldlabel, undefined);
                transperent: true, //+ 투명화 여부
                minlevel: 17, //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
                drawline: false, //+ WFS 모델에 테투리 추가 여부
                version: '1.1.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
                textureurl: './image/buld/buld_texture_1.jpg',  //+ 텍스처 url, defaultValue(opt.textureurl, undefined)
                useproxy: false
            },
            u3f: {
                name: 'u3f', //+ U3F 3D 모델 레이어 이름, *필수 입력
                useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, false);
                baseurl: layerInfo.model.yeouidou3furl,  //+ U3F 데이터 경로의 기본 URL, *필수 입력
                basename: layerInfo.model.yeouidou3fname, //+ U3F 데이터dml 정보가 있는 U3G 파일 이름, *필수 입력
                minlevel: 17,  //+ 가시화 최소레벨
                maxlevel: 17,  //+ 가시화 최대레벨
                opacity: 1,  //+ 투명화 여부 true 일 경우, 투명도 설정값으로 적용
                makeU3FPackage:1,
                compressmodel: true
            }
        };


        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////


        var app = new Union3D.U3dAPP({
            containername: 'map' //+ U3dApp(지도영역)의 div ID, *필수 입력
        });
        window.app = app;
        app.on('change', updatePosData);
        app.createloadingBar('load');
        app.loadingBar();

        app.setHomePosition(126.9395, 37.52, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();
        app.createLoadingCanvas();

        //이미지 레이어 생성
        let layers = new LayerList(Union3D, app);
        let initLayerList = ['satellite', 'korea_terrain'];
        let initSwipeLayerList = ['base'];
        initLayar(initLayerList);
        initLayar(initSwipeLayerList, true);
        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayar(list, isSwipe) {
            const basename = list[0];
            Union3D.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);
                            if (!isSwipe) {
                                app.showLayer(name, true);
                                $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                            } else {
                                app.showLayer(name, false);
                            }
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }

        createLayer('_25d');


        //+ u3f model
        createLayer('u3f');
        app.showLayer('u3f', true);

        //+ 스와이프 맵 추가
        app.addNameSwipeLayer('base');
        app.addNameSwipeLayer('_25d');

        //+ name을 받아 해당 layer 생성
        function createLayer(name) {
            var layer = layers[name];
            if (layer === undefined) {
                //레이어 생성 및 APP에 레이어 추가
                var options = LAYER_OPT[name];
                switch (name) {
                    //+ 건물 //////////////////////////////////////////
                    case 'xdo':
                        layer = new Union3D.model.U3dModelVWorldLayer(options);
                        app.addLayer(layer);
                        break;
                    case '_3dtiles':
                        layer = new Union3D.model.U3dModelTilesLayer(options);
                        app.addLayer(layer);
                        break;
                    case 'u3f':
                        layer = new Union3D.model.U3dModelU3FLayer(options);
                        app.addLayer(layer);
                        break;
                    case '_25d':
                        layer = new Union3D.model.U3dModelWFSLayer(options);
                        app.addLayer(layer);
                        break;
                }
                layers[name] = layer;
            }
        }
    })
</script>
<script type="module">

    initSlider();
    //+ checkbox event 등록
    $(document).on('click', 'input[type=checkbox]', checked);

    //+ checkbox function
    function checked(e) {
        var $checkbox = $(e.target);
        var name = $checkbox.attr('target');
        //+ 영상 투명화 여부
        if (name == 'swipe') {
            if ($checkbox[0].checked) {
                $('.slider').css('display', 'block')
                app.setEnableSwipe(true); //+ 스와이프 여부 체크시
                app.showLayer('base', true);
                app.showLayer('_25d', true);
            } else {
                $('.slider').css('display', 'none')
                app.setEnableSwipe(false); //+ 스와이프 여부 해제시
                app.showLayer('base', false);
                app.showLayer('_25d', false);
            }

        }
    }

    //+ 스와이프 slider 초기 설정
    function initSlider() {
        const slider = document.querySelector('.slider');

        //+ pointer 클릭한 상태 event function
        function onPointerDown() {

            if (event.isPrimary === false) return;

            //   controls.enabled = false;

            window.addEventListener('pointermove', onPointerMove); //+ point 이동 event 등록
            window.addEventListener('pointerup', onPointerUp); //+ point 클릭후 마우스 뗄 때 event 등록
        }

        //+ pointer 클릭후 마우스 뗄 때 event function
        function onPointerUp() {

            //  controls.enabled = true;

            window.removeEventListener('pointermove', onPointerMove);  //+ point 이동 event 제거
            window.removeEventListener('pointerup', onPointerUp);  //+ point 클릭후 마우스 뗄 때 event 제거

        }

        //+ pointer 이동시 event function
        function onPointerMove(e) {

            if (event.isPrimary === false) return;

            var sliderPos = Math.max(0, Math.min(window.innerWidth, e.pageX)); //+ 스와이프 위치, pageX 좌표만 비교

            slider.style.left = sliderPos - (slider.offsetWidth / 2) + 7 + "px";

            if (app != undefined && app != null) {
                if (app.getEnableSwipe()) {//+ 스와이프 여부 체크시
                    app.setSizeBaseWindow(0, 0, sliderPos, window.innerHeight);//+ 원래 window 사이즈 조절
                    app.setSizeSwipeWindow(sliderPos, 0, window.innerWidth, window.innerHeight); //+ 스와이프 체크로 추가된 window 사이즈 조절
                }
            }
        }

        slider.style.touchAction = 'none'; // disable touch scroll
        slider.addEventListener('pointerdown', onPointerDown); //+ slider에 pointer 클릭한 상태 event 등록
    }

</script>
</body>
