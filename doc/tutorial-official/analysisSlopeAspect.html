<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>경사향 분석 예제</title>
</head>
<body>

<div class="ex-explanation" hidden>
    <p class="lead">
        사용자가 클릭한 지점의 <strong>경사향을 분석하여 화면에 가시화</strong>하는 예제입니다.<br>
        분석 결과는 범례에 따라 색상이 다른 화살표로 나타나며, 분석 영역의 가로,세로 길이, 출력 화살표 갯수와
        화살표 형상(머리 크기·길이, 꼬리 길이·굵기)을 편집할 수 있습니다.<br>
        결과가 표출된 상태에서 분석 영역 안을 다시 클릭하면 <strong>가장 가까운 화살표가 강조</strong>되고 경사도·경사향 값이 POI로 표시되며,
        영역 밖을 클릭하면 그 지점을 중심으로 새로 분석합니다.
    </p>
</div>
