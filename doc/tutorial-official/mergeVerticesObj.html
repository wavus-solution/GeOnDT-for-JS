<script id="ui-event">
    const homePositon = {lat: 126.9395, lon : 37.52, height : 450, left : 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });
    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });
    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });
    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });
    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x : homePositon.lat, y : homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function(){
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            }
            else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    require(['app/Union3D'], function (Union3D) {

        //라이센스 인증
        Union3D.ready(function () {
            let layers = {};
            let LAYER_OPT = {
                //+ 고도////////////////////////////////////////////////////////
                obj_general: {
                    name: 'obj_general', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                    useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, false);
                    baseurl: 'https://dt-data.mappick.co.kr/ServiceData/test/bskim/obj/', //+ U3F 데이터 경로의 기본 URL, *필수 입력
                    basename: 'all.obj', //+ U3F 데이터dml 정보가 있는 U3G 파일 이름, *필수 입력
                    minlevel: 15,  //+ 가시화 최소레벨
                    maxlevel: 19,  //+ 가시화 최대레벨
                    opacity: 1,  //+ 투명화 여부 true 일 경우, 투명도 설정값으로 적용
                    maxprocess: 10, //+ 최대 process 값
                    sizeblock: 10, //+ one per block model size, defaultValue(opt.sizeblockmodel, 1);
                    limitdistance: 150, //+ 건물 갱신 거리
                    animation: false, //+ animation 효과 사용 여부
                    ext:'obj',
                    listmodel:[],
                    needxml: false,
                    yup:true,
                    srs:'EPSG:5186'
                },

                //+ 건물 ///////////////////////////////////////////////////////
                obj_mergeVertices: {
                    name: 'obj_mergeVertices', //+ U3F 3D 모델 레이어 이름, *필수 입력
                    useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, false);
                    baseurl: 'https://dt-data.mappick.co.kr/ServiceData/test/bskim/obj/', //+ U3F 데이터 경로의 기본 URL, *필수 입력
                    basename: 'all.obj', //+ U3F 데이터dml 정보가 있는 U3G 파일 이름, *필수 입력
                    minlevel: 15,  //+ 가시화 최소레벨
                    maxlevel: 19,  //+ 가시화 최대레벨
                    opacity: 1,  //+ 투명화 여부 true 일 경우, 투명도 설정값으로 적용
                    maxprocess: 10, //+ 최대 process 값
                    sizeblock: 10, //+ one per block model size, defaultValue(opt.sizeblockmodel, 1);
                    limitdistance: 150, //+ 건물 갱신 거리
                    animation: false, //+ animation 효과 사용 여부
                    color:0x00ffff,
                    ext:'obj',
                    listmodel:[],
                    needxml: false,
                    yup:true,
                    srs:'EPSG:5186'
                },
                SWL_PIPE_LM: {
                    name: 'SWL_PIPE_LM',
                    url: 'https://dt-data.mappick.co.kr/ServiceData/i3f/base/SWL_PIPE_LM/tilemap.json',
                    apikey: '',
                    desc: '하수관로',
                    position: {x: 126.774, y: 37.660, z: 600, rotateX: 2, rotateY: 60}
                },
            };

            ////////////////////////////////////////////////////////////////////////////////////////////////////////
            ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
            ///////////////////////////////////////////////////////////////////////////////////////////////////////

            window.app = new Union3D.U3dAPP({
                containername: 'map', //+ U3dApp(지도영역)의 div ID, *필수 입력
                methodheight: '1_0',
                searchtype: 'sphere'
            });
            app.setHomePosition(126.9395, 37.52, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
            app.updateHomePosition(); //+ home position 수정
            app.createloadingBar('load');
            app.setUnderGroundMode(true);
            app.on('change', updatePosData);

            //이미지 레이어 생성
            var layer = new Union3D.image.U3dImageXYZLayer({
                name    : 'satellite', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                baseurl : layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
                reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
            });
            app.addLayer(layer);
            //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.
            app.setNameBaseLayer('satellite');
            app.showLayer('satellite', true);
            app.endloadingBar();

            var terrainLayer = new Union3D.terrain.U3dHeightXYZLayer({
                name: 'Korea Terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                baseurl: layerInfo.height.url,//+ 고도 데이터 기본 URL, *필수 입력
                ext: '.umf', //+ 파일 확장자,  *필수 입력
                reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false), *필수 입력
                minlevel: 9,  //+ 가시화 최소 레벨
                maxlevel: 15, //+ 가시화 최대 레벨
                useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
                maxprocess: 2, //+ process 최대값
                interpolationheight: true,  //+ 고도보간 기능 사용 여부
                rectangle          : Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
            });
            app.addLayer(terrainLayer);
            app.showLayer('Korea Terrain', true);
            /////////////////////////////////////////////////////






            ////////////////////////////////////////////////////////////////////////////////////////////////////////
            ///////////////////////////////////////// event 등록 ///////////////////////////////////////////////////
            ///////////////////////////////////////////////////////////////////////////////////////////////////////


            $(document).on('click', 'input[type=checkbox]', checked);

            ////////////////////////////////////////////////////////////////////////////////////////////////////////
            ///////////////////////////////////////// function 선언 ////////////////////////////////////////////////
            ///////////////////////////////////////////////////////////////////////////////////////////////////////
            function checked(e) {
                var $checkbox = $(e.target);
                var name = $checkbox.attr('target');
                //+ 영상 투명화 여부
              if (LAYER_OPT[name] != undefined) {
                    //+ name 해당하는 Layer show or hide
                    createLayer(name);
                    if ($checkbox[0].checked) {

                        app.showLayer(name, true).then(function (){
                            if (name == 'obj_mergeVertices')
                                app.fitLayerExtent(name);
                            else if(name == 'SWL_PIPE_LM')
                                app.setCameraPosition( -234796.2112734669, 121557.08338578395, 4.219618439751557);
                        });
                    } else {
                        app.showLayer(name, false);
                    }
                    app.setUpdateDate();
                }else if(name =='obj_mergeVertices_wireFrame'){
                  if(layers['obj_mergeVertices']){
                      if ($checkbox[0].checked) {
                          layers['obj_mergeVertices'].setWireframe(true);
                      }else{
                          layers['obj_mergeVertices'].setWireframe(false);
                      }
                  }
              }else if(name =='obj_general_wireFrame'){
                  if(layers['obj_general']){
                      if ($checkbox[0].checked) {
                          layers['obj_general'].setWireframe(true);
                      }else{
                          layers['obj_general'].setWireframe(false);
                      }
                  }
              }
              else if(name =='SWL_PIPE_LM_wireFrame'){
                  if(layers['SWL_PIPE_LM']){
                      if ($checkbox[0].checked) {
                          layers['SWL_PIPE_LM'].setWireframe(true);
                      }else{
                          layers['SWL_PIPE_LM'].setWireframe(false);
                      }
                  }
              }
            }

            initSlider('tolerance');
            //+ 허용 오차 설정 slider
            function initSlider(type) {
                var id = '';
                var idhandle = '';
                var step = 0.00005;
                switch (type) {
                    case  'tolerance': {
                        id = '#tolerance';
                        idhandle = '#tolerance-handle';
                    }
                        break;
                }

                var handle = $(idhandle);
                $(id).slider({
                    orientation: "horizontal",
                    range: "min",
                    value: 1e-4 ,
                    min: 0, // min value
                    max: 30,
                    step: step,
                    create: function () {
                        var val = $(this).slider("value");
                        handle.text(val.toFixed(2));
                    },
                    slide: function (event, ui) {
                        handle.text(ui.value.toFixed(2));
                        switch (id) {
                            case  '#tolerance': {
                                if( layers['obj_mergeVertices'])
                                    layers['obj_mergeVertices'].mergeVertices(ui.value, true);
                                if(layers['SWL_PIPE_LM'])
                                    layers['SWL_PIPE_LM'].mergeVertices(ui.value, true);
                            }
                                break;
                        }
                    },
                    change: function (event, ui) {
                    }
                });
            }

            function createLayer(name) {
                var layer = layers[name];
                if (layer === undefined) {
                    //레이어 생성 및 APP에 레이어 추가
                    var options = LAYER_OPT[name];
                    let optlayer = {
                        name: 'layer',
                        baseurl: options.baseurl,
                        fileName: 'all',
                        section: 'obj',
                        ext:'obj'
                    }
                    switch (name) {
                        //+ 건물 //////////////////////////////////////////
                        case 'obj_general':
                            //+ obj_general
                            layer = new Union3D.model.U3dModelBasicLayer(options);
                            options.listmodel.push(optlayer);
                            app.addLayer(layer);
                            break;
                        case 'obj_mergeVertices':
                            //+ obj_mergeVertices
                            layer = new Union3D.model.U3dModelBasicLayer(options);
                            options.listmodel.push(optlayer);
                            app.addLayer(layer);
                            break;

                        case 'SWL_PIPE_LM':
                            //+ obj_mergeVertices
                             layer = new Union3D.model.U3dModelI3FLayer({
                                name: name,
                                //fixcolor: fixcolor,
                                useproxy: false,
                                baseurl: options.url,
                                minlevel: Union3D.UDEF.isIE() ? 17 : 17,
                                maxlevel: Union3D.UDEF.isIE() ? 19 : 19,
                                apikey: options.apikey,
                                // autoHeight: true, // true시 고도에 맞춰서 지하시설물이 지상으로 표출
                                useloadimage: true,
                                //metaDataFunction: metaDataFunction
                            });
                            app.addLayer(layer);
                            break;

                    }
                    layers[name] = layer;
                }
            }

        });
    });

</script>
