    <div class="explane1" >
        Mesh란 <accent>형상(Geometry)과 재질(Material)을 결합</accent>해 화면에 렌더링되는 <strong>3D 객체 최소 단위</strong>를 의미합니다. <br> <br>

        <strong>Geometry</strong> : 객체의 형태 정보를 정의합니다. (정점(Vertex), 면(Face), 인덱스(Index), UV 좌표 등)<br>
        <strong>Material</strong> : 객체의 표면 표현 방식을 정의합니다. (색상, 텍스처, 투명도, 반사, 쉐이딩 등)
