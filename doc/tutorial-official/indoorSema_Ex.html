<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>

        function createComponent() {
            let keys = Object.keys(componentArea);
            GeOnDT.UDEF.createPromise((resolve, reject) => {
                try {
                    for (let i = 0; i < keys.length; i++) {
                        let geom = createGeom();
                        geom._name = keys[i];
                        let points = componentArea[keys[i]].point;
                        for (let j = 0; j < points.length; j++) {
                            geom.addPosition(points[j]); // 위경도(4326)  좌표 추가
                        }
                        geom. _height = componentArea[keys[i]].height ;
                        geom._num = componentArea[keys[i]].num;
                        geomList.push(geom);
                    }
                    resolve(true)
                } catch (e) {
                    reject({message: e});
                }
            }).then((resolve) => {
                if (resolve) {
                    for (let i = 0; i < geomList.length; i++) {
                        createCrown(geomList[i]);
                    }
                }
            }).catch((reject) => {
                throw new Error(reject.message);
            })
        }

        function createCrown(area) {
            let firstPos = area.getPosition()[0];
            let num = area._num;
            let points = app.getGoogleToGeographic(firstPos[0], firstPos[1]);
            let model;
            for (let i = 0; i < num; i++) {
                if (i % 2)
                    model = 'girl';
                else
                    model = 'man';
                componentLayer.addPosition({
                    object: model,
                    type: 'crowd',
                    geoPosition: {x: points.x, y: points.y, z: area._height}, //+ 컴포넌트를 추가할 위경도 위치
                    speed: 3, //+ 컴포넌트 속도
                    scale: {x: 0.01, y: 0.01, z: 0.01},
                    rotation: {x: 90, y: 0, z: 0},
                    visibleLevel: 6,
                    repeat: true, // 경로 반복 여부
                    drawPolygon: area,
                    animationNum: 0,
                    instanced: true
                });
            }
        }

                strokeWidth: 5 //+ 선두께
            }
            geom = new GeOnDT.geom.U2dPolygon(option);
            return geom;

        function setRoadUrl(name) {
            var promise = $.Deferred();

            });
            return promise;
        }

            return $.ajax({

                }
            });
        }

        var indoorName = 'sema' // 서버 등록시 작성한 name
        var layer
        setRoadUrl(indoorName).then((opt) => {
            var optlayer = {
                node: 1,
                name: 'layer1', //+ layer 이름
                baseurl: layerInfo.model.semaurl,  //+ indoor 데이터 경로의 기본 URL, *필수 입력
                fileName: layerInfo.model.semaname, //+ 저장된 파일의 이름
                ext: "3ds",
            };
            // load 할 모델 리스트 담기
            // 파일 이름이 지정되어 있지 않은 모델(xml 로드 여부 false)의 경우 listmodel에 담아서 load
            opt.listmodel.push(optlayer);
            layer = app.createTdsModelLayer(opt);

            window.layerObject = layer;
            layer.ready.then(function (TDSLayer) {
                // layer.setPosition(app.vector3ToGeoGraphic(opt.location));
                app.endloadingBar(100);
                app.fitLayerExtent(indoorName);
                app.showLayer(indoorName, true);
                // addLight();
                addCamera();
            });
        });

        //+ [Room1] 버튼 클릭시, 지정된 좌표로 이동 후 도보 모드 실행
        $('#exhibit1').on('click', function () {
            if (defined(controls) && controls.isTrace)
                controls.unlock();
            startWalkMode.call(this);
        });
        //+ [Room2] 버튼 클릭시, 지정된 좌표로 이동 후 도보 모드 실행
        $('#exhibit2').on('click', function () {
            if (defined(controls) && controls.isTrace)
                controls.unlock();
            startWalkMode.call(this);
        });
        //+ [Room3] 버튼 클릭시, 지정된 좌표로 이동 후 도보 모드 실행
        $('#exhibit3').on('click', function () {
            if (defined(controls) && controls.isTrace)
                controls.unlock();
            startWalkMode.call(this);
        });
        let controls;
        let JUMP = 'jump';
        let JUMP_RUNNING = 'jump_running';
        let SPRINT = 'sprint';
        let RUN = 'run';
        let IDLE = 'idle';
        let play = '';
        //+ [3인칭 전환] 버튼 클릭시, PanMode로 전환
        $('#third').on('click', function () {
            if (defined(controls))
                controls.unlock();
            $('.walkmode').attr('disabled', false);
            app.setPanMode();
            app.fitLayerExtent(indoorName, true);

            // 태양 플레어, 그림자맵 설정 - 도보모드 시작시 해제 하였을 경우 다시 설정하여 가시화
            app.setSunFlare(true); // sun Flare 설정 - 해당 기능을 사용 할 경우 건물 재질에 속성값 변경, 태양 플레어 가시화 적용
            app.enableShadowMap(true); // 그림자 생성 여부 설정 - 설정된 태양 광원에 위치에서 건물과 지형에 그림자에 대한 계산과 가시화가 적용

            if (cameraList.length > 0) {
                cameraList.forEach(camera => {
                    camera.show();
                    camera.showLabel();
                })
            }
        });

        function startWalkMode() {
            var self = this;
            $('.walkmode').attr('disabled', false);
            $(self).attr('disabled', true);

            if (lightList.length > 0) {
                lightList.forEach(light => {
                    light.visible = true;
                })
            }

            if (cameraList.length > 0) {
                for (let i = 0; i < cameraList.length; i++) {
                    let camera = cameraList[i];
                    if (defined(camera.element)) {
                        $(camera.element).hide();
                        camera.hideLabel();
                    }
                    cameraPositionList[i].visible = false;
                }
            }

            // 도보모드 시작 시 sunFlare, ShadowMap 설정 해제
            // 실내 도보모드 사용시 내부에서 외부의 이미지 또는 배경에 대한 가시성 품질 향상이 요구되지 않는 경우에는 하위에 해당 옵션을 해제하여 사용 권장 드립니다.
            // (도보 모드시 성능 영향)
            app.setSunFlare(false); // sun Flare 설정 - 해당 기능을 사용 할 경우 건물 재질에 속성값 변경, 태양 플레어 가시화 적용
            app.enableShadowMap(true); // 그림자 생성 여부 설정 - 설정된 태양 광원에 위치에서 건물과 지형에 그림자에 대한 계산과 가시화가 적용

            controls = app.createCharacterControls({
                camera: app._camera,
                domElement: app._renderer.domElement,
                pos: exhibitPosition[self.textContent],
                dir: exhibitDirection[self.textContent],
                minHeight: MIN_HEIGHT
            });
            let walkModelUrl = layerInfo.model.walkmodelurl;
            let fileName = 'low_poly_girl';
            let ext = layerInfo.model.walkmodelext;
            let loadFile = walkModelUrl + fileName + "." + ext;

            controls._baseUrl = walkModelUrl;
            controls._fileName = fileName;
            controls._ext = ext;

            controls.setModelFile(loadFile).then(function () {
                initSettings(); // key Setting and animation Settings
                controls.setStatusFunc(setStatus);
                controls.on('change', intersectCamera);
                setTimeout(function () {
                    if (cameraList.length > 0) {
                        for (let i = 0; i < cameraList.length; i++) {
                            let camera = cameraList[i];
                            camera.showLabel();
                        }
                    }
                }, 2500)
            });
            //controls.setModelRotate({x:Math.PI/2, y:0, z: 0, order:'ZYX'});
            controls.setModelScale({x: 1, y: 1, z: 0.9});
            controls.setWalkSpeed(0.8);
            controls.setJumpScale(0.7);
            controls.active();
        }

        function initSettings() {
            //let a = controls.getAnimationList();
            controls.setAction(JUMP, 'jump_start', 1.0);
            controls.setAction(JUMP_RUNNING, 'jump_fwd', 1.0);
            controls.setAction(SPRINT, 'run', 1.5);
            controls.setAction(RUN, 'walk', 1.8);
            controls.setAction(IDLE, 'Idle 3');

            controls.setKeyboard('w', 'moveUp');
            controls.setKeyboard('a', 'moveLeft');
            controls.setKeyboard('d', 'moveRight');
            controls.setKeyboard('s', 'moveDown');
            controls.setKeyboard('f', 'jump');
            controls.setKeyboard('shift', 'toggleRun');
        }

        // 캐릭터 조작시에 상태 변경 함수
        function setStatus(directionPressed, keysPressed, toggleRun) {
            let actionList = {
                JUMP,
                JUMP_RUNNING,
                SPRINT,
                RUN,
                IDLE
            };
            if (directionPressed && toggleRun) {
                play = SPRINT;
            } else if (directionPressed && !keysPressed.space) {
                play = RUN;
            } else if (directionPressed && keysPressed.space) {
                play = JUMP_RUNNING;
            } else if (!directionPressed && keysPressed.space) {
                play = JUMP;
            } else {
                play = IDLE;
            }
            return {actionList, play};
        }

        //////// 광원 추가
        let lightPositions = [
            {x: 129.35422089511155, y: 36.58052819073508, z: 12},
            {x: 129.35459818753094, y: 36.58072295909023, z: 9},
            {x: 129.35470598536506, y: 36.58061475450914, z: 9},
            {x: 129.35472395167074, y: 36.58047769515538, z: 10}
        ]

        let lightList = [];

        function addLight() {
            for (let i = 0; i < lightPositions.length; i++) {
                let pos = lightPositions[i];

                const light = new GeOnDT.view.USpotLight({
                    drawarg: app._drawArg,
                    position: pos,
                    color: 0xffffff,
                    visibleLabel: false,
                    objRadius: 0.1
                });

                app.addLight(light);
                light.setRotationUp(0);
                light.setAngle(Number(170));
                light.setIntensity(Number(0.1));
                lightList.push(light);
            }
        }

        let cameraPositionList = [
            {x: 126.9741391557992, y: 37.5641778667965, z: 10.5, left: 123, up: 80, visible: true},
            {x: 126.97414197238842, y: 37.5640519815324, z: 10, left: 138, up: 70, visible: true},
            {x: 126.97369306658385, y: 37.56396663895523, z: 10.7, left: 290, up: 65, visible: true},
            {x: 126.97340924009069, y: 37.56413685651749, z: 11.2, left: 250, up: 70, visible: true},
        ]
        let cameraList = [];

        function addCamera() {
            let cnt = 1;
            for (let i = 0; i < cameraPositionList.length; i++) {
                let pos = cameraPositionList[i];
                let name = cnt + '번_CCTV';
                let cameraView = createView(pos, name, pos.left, pos.up);
                cnt++;
                if (cameraView !== undefined && pos.visible) {
                    cameraView.show();
                    cameraList.push(cameraView);

                }
            }
        }

        function createView(pos, name, left, up) {
            const html = printViewLightOverlayHtml(name)
            app.createView({
                name: name,
                id: name,
                left: left, // 광원 좌우회전각 설정
                up: up, // 광원 상하회전각 설정
                element: $(html),
                position: pos, // 광원 위치 설정
                endposition: pos,
                useanchor: false,
                useline: false,
                autoAnchor: false,
                balloon: {x: -50, y: 10},
                useHelperObj: false //+ 광원에서 이미 HelperObj를 사용하고 있어서 뷰에서는 생성 X
            }).then((view)=>{
                const element = view.getElement();
                const $element = $(element);
                $element.on('click', '.close', popUpCloseClick.bind(view, $element));
                $element.on('click', '#helper', showHelper.bind(view));
                view.setDraggable(true);
                return view;
            }).catch((e)=>{
                return undefined
            })
        }

        function showHelper(e) {
            const view = this;
            const checked = $(e.target).prop('checked');
            view.showHelper(checked);
        }

        //광원뷰 element 생성
        function printViewLightOverlayHtml(name) {
            let str = '';
            str += '<div class="u3-popup" id=' + name + '>';
            str += '<div class="u3-popup-content">';
            str += '<div class="modal-header">';
            str += '<label style="margin-right: 130px;">' + name + '</label>';
            str += '<button type="button" class="close"><span aria-hidden="true">&times;</span></button>';
            str += ' <label> <input type="checkbox" id="helper"/> 가시선 </label>';
            str += '</div>';
            str += `<div style="display: block; margin-bottom: 2px; margin-left: 5px; margin-top: 2px;">
                    <label style="margin-right: 10px"> 회전 : </label>
                    <button class="btn btn-default glyphicon glyphicon-arrow-left control "
                            id="left-rotation"></button>
                    <button class="btn btn-default glyphicon glyphicon-arrow-right control"
                            id="right-rotation"></button>
                    <button class="btn btn-default glyphicon glyphicon-arrow-up control" id="up-rotation"></button>
                    <button class="btn btn-default glyphicon glyphicon-arrow-down control"
                            id="down-rotation"></button>
                    <button class="btn btn-default glyphicon glyphicon-repeat control" id="reset-rotation"
                            style="margin-left: 10px"></button></div>`

            str += '</div>';
            str += '</div>';
            return str;
        }

        //광원뷰 오버레이 닫힘 버튼 동작함수
        function popUpCloseClick($element) {
            const view = this;
            $element.off('click', '.close', popUpCloseClick); //popup 이벤트 삭제
            view.hide();
        }

        function intersectCamera(result) {

            let infos = result.data;
            const MAX_DISTANCE = 4;
            for (let i = 0; i < infos.length; i++) {
                let info = infos[i];
                if (info.distance < MAX_DISTANCE) {
                    if (!cameraPositionList[i].visible) {
                        cameraPositionList[i].visible = true;
                        let height = controls.getWalkModel().position.z;
                        let position = {x: cameraPositionList[i].x, y: cameraPositionList[i].y, z: height};
                        info.object.manualUpdate(position);
                        info.object.updatePosition(cameraPositionList[i]);
                        info.object.show();
                    }
                } else if (info.distance >= MAX_DISTANCE) {
                    if (cameraPositionList[i].visible) {
                        cameraPositionList[i].visible = false;
                        if (defined(info.object.element)) {
                            $(info.object.element).hide();
                        }
                    }
                }
            }
        }

        const ROTATION_VALUE = 3; //회전율
        $(document).on('click', '.control', function (e) {
            let id_ = e.target.parentElement.parentElement.parentElement.id;
            let view = app.getViewById(id_); //선택된 뷰
            let val = undefined;
            if (view === undefined) {
                alert('Not Find Selected Camera View! Do Select');
                return;
            }

            const id = $(e.target).attr('id');
            switch (id) {
                case 'left-rotation':
                    val = view.getRotationLeft(); // 현재 광원의 회전값(좌우)을 받아
                    view.setRotationLeft(val + ROTATION_VALUE); //회전 설정
                    break;
                case 'right-rotation':
                    val = view.getRotationLeft();
                    view.setRotationLeft(val - ROTATION_VALUE);
                    break;
                case 'up-rotation':
                    val = view.getRotationUp(); // 현재 광원의 회전값(상하)을 받아
                    view.setRotationUp(val + ROTATION_VALUE); //회전 설정
                    break;
                case 'down-rotation':
                    val = view.getRotationUp();
                    view.setRotationUp(val - ROTATION_VALUE);
                    break;
                case 'reset-rotation':
                    let num = id_.split('번')[0]
                    let resetLeft = cameraPositionList[num - 1].left;
                    let resetUp = cameraPositionList[num - 1].up;
                    view.camera.rotation.x = resetUp;
                    view.camera.rotation.z = resetLeft;
                    break;
            }
        });
    });
</script>
</body>
</html>
