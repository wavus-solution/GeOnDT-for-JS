<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    //+ 라이센스 인증
    Union3D.ready(function () {

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        window.app = new Union3D.U3dAPP({
            containername: 'map'  //+ U3dApp(지도영역)의 div ID, *필수 입력
        });
        app.setHomePosition(126.9395, 37.52, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition(); //+ home position 수정
        app.createloadingBar('load');
        app.on('change', updatePosData);

        //이미지 레이어 생성
        let layer = new Union3D.image.U3dImageXYZLayer({
            name: 'base', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        });
        app.addLayer(layer);
        ;

        // app.addLayer(layer);
        //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.
        app.setNameBaseLayer('base');
        app.showImageLayer('base', true);
        app.endloadingBar();

        ////// 고도 레이어 ////////////////
        const terrainLayer = new Union3D.terrain.U3dHeightXYZLayer({
            name: 'Korea Terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자,  *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false), *필수 입력
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 15, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            maxprocess: 2, //+ process 최대값
            interpolationheight: true,  //+ 고도보간 기능 사용 여부
            rectangle: Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        });

        app.addLayer(terrainLayer);
        app.showLayer('Korea Terrain', true);
        window.selectModel = undefined;
        var analy;
        /////////////////////////////////////////////////////

        //+ u3f 모델
        var vworldModel = undefined;
        var modelayers = undefined;
        createU3fModelLayers();

        window.selector = new Union3D.select.U3dSelect({mode: 'point', exceptTexture: false});
        app.addSelect(selector);
        // selector 스타일 변경, addSelect() 실행 후, 아래 API 호출해야 적용가능
        selector.setSelectorColor({ //선택 영역 스타일 변경, resetSelectorColor() -> 기본설정으로 초기화
            stroke: {
                color: 'rgba(0, 255, 204, 0.8)',
                width: 3
            },


        });
        selector.setSelectedColor("#00ffcc", 0.6);
        //////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// event 등록 /////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////////////////////////////////
        let selectArea = {

            on: function (name) {
                selector.setMode(name);
                app.removeAllOverlay(); //+ 다른 overlay 전체 삭제
                if (!selector.isActive()) {
                    selector.active();
                    selector.on('change', this.change);
                    selector.on('end', this.end);
                }
            },
            off: function () {
                app.removeAllOverlay(); //+ 다른 overlay 전체 삭제
                selector.clear();
                selector.deactive();
                analy.deactive();
                selector.off('change', this.change);
                selector.off('end', this.end);
            },
            change: function (e) {
                console.log('Change Event');
            },
            end: function (e) {
                console.log('End Event');
                let objects = selector.getSelected();
                let obj;

                for (let i = 0; i < objects.length; i++) {
                    let x = objects[i].position.x;
                    let y = objects[i].position.y;
                    let z = objects[i].position.z;
                    console.log(`[${i}] x: ${x} , y: ${y} , z: ${z}`);
                    if (x !== 0 && y !== 0 && z !== 0) {
                        if (!obj) {
                            obj = objects[i];
                        }
                    }
                }
                if (obj) {
                    gizmoAnaly.setObject(obj);
                    printModelEdit(obj);
                }
            }

        }
        selectArea.on('point');
        //+ model type 선택
        //+ vworld /  u3f /  2.5D(wfs) 건물 선택 가능
        $(document).on('click', 'input[name=model]', checked);

        //+ 알림 편집 목록 맵 클릭시 새로고침
        $(document).on('click', '#map', function (e) {
            printModelEdit();
        })

        //+ 편집 타입(Gizmo) 선택
        //+ 위치편집 / 회전 편집 / 크기 편집 // 기본모드
        //+ 위치편집 - position / gizmoMode - translate
        //+ 회전편집 - rotation / gizmoMode - rotate
        //+ 크기편집 - scale / gizmoMode - scale
        $(document).on('click', 'input[type="radio"]', function (e) {
            var target = e.target.value;
            analy = app.activeAnalysis('GizmoModel');
            if (target === 'position') {
                analy.active();
                analy.setMode('translate');
                selectArea.on('point');

            } else if (target === 'rotation') {
                analy.active();
                analy.setMode('rotate');
                selectArea.on('point');

            } else if (target === 'scale') {
                analy.active();
                analy.setMode('scale');
                selectArea.on('point');

            } else {
                analy.deactive();
            }
            printModelEdit();
        });


        // 모두 지우기 버튼
        $('.btn-remove-all').on('click', function () {
            analy.reset();
            //+ gizmoModel 초기화
            analy.clear();
            let list = modelayers.getChildren? modelayers.getChildren() : [modelayers];
            for (let i = 0; i < list.length; i++) {
                //+ 편집된 건물 복구
                //list[i].removeEditModelAll();
                if(list[i].editedList.length > 0){
                    let editList = [...list[i].editedList];
                    for( let j = 0; j < editList.length; j++){
                        let id = editList[j];
                        list[i].removeEdit(id);
                    }
                }
            }
            printModelEdit();
        });


        //+ 해당 건물에 대한 편집 초기화
        $(document).on('click', '.btn-model-remove', function () {
            //+ target 건물 ID 전달 받기
            let modelId = $(this).closest('.edit-item').attr('target');
            let list = modelayers.getChildren? modelayers.getChildren() : [modelayers];
            var gizmoAnaly = app.getAnalysis('GizmoModel');
            list.forEach(function (editModelLayer) {
                if (editModelLayer.editedList.length > 0) {
                    //+ 초기화 하려는 건물이 속한 Tile을 새로고침 해줍니다.
                    //+ refreshTileFromModel(modelId - 건물 ID);
                    editModelLayer.removeEdit(modelId);
                    app.getAnalysis('GizmoModel').clear();
                }
            });
            gizmoAnaly.removeAllHighlight();
            app.setUpdateDate();
            printModelEdit();
        });


        //+ 가시화 여부
        //+
        $(document).on('click', 'input[type="checkbox"]', function (e) {
            let u3fModelId = $(this).closest('.edit-item').attr('target');
            let modelId = u3fModelId;
            let checked = e.target.checked;
            let list = modelayers.getChildren? modelayers.getChildren() : [modelayers];
            let layerName = undefined;
            list.forEach(function (editModelLayer) {
                if (editModelLayer.editedList.length > 0) {
                    let event = editModelLayer.getEditedEventById(modelId)
                    if (editModelLayer._classtype === "U3dModelVWorldLayer") {
                        //+ vworld model
                        if (!checked) {
                            editModelLayer.removedList.push(modelId);
                            if (event != undefined)
                                event.mesh._opt.material.visible = false;
                        } else {
                            let idx = editModelLayer.removedList.indexOf(modelId);
                            if(idx > -1){
                                editModelLayer.removedList.splice(idx, 1);
                            }
                            if (event != undefined)
                                event.mesh._opt.material.visible = true;
                        }
                    } else {
                        //+ u3f model 일 경우 id를 다시 교체해준다 (ex. id : 1400000_72000000)
                        //+ 특수기호가 포함된 ID
                        if (editModelLayer._classtype === "U3dModelU3FLayer") {
                            modelId = u3fModelId
                        }
                        if (!checked) {
                            editModelLayer.removedList.push(modelId);
                            if (event != undefined) {
                                event.mesh.visible = false;
                                event.mesh._opt.material.visible = false;
                            }
                        } else {
                            editModelLayer.removedList.pop(modelId);
                            if (event != undefined) {
                                event.mesh.visible = true;
                                event.mesh._opt.material.visible = true;
                            }
                        }
                    }
                    layerName = editModelLayer.getName();
                }
            });
            if (layerName != undefined) {
                analy.clear();
            }
        });

        function checked(e) {
            var $checkbox = $(e.target);

            if ($checkbox[0].checked) {
                //+ u3f create
                if (name === 'u3f')
                    createU3fModelLayers();
                else
                    createWFSLayer();
            } else {
                removeLayer();
                analy.deactive();
            }
        }


        var gizmoSelected = undefined;

        //+ WFS model create Function
        var wfsModel = undefined;

        function createWFSLayer() {
            wfsModel = new Union3D.model.U3dModelWFSLayer({
                name: 'WFS Model', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                layername: layerInfo.wfs_korea.layername, //+ 레이어 이름, *필수 입력
                // sldurl:  layerInfo.wfs_unionit.sldurl,  //+ sld 파일 URL, defaultValue(opt.sldurl, undefined)
                baseurl: layerInfo.wfs_korea.baseurl,  //+ baseurl 지도 서비스 기본 URL, *필수 입력
                fieldfloor: layerInfo.wfs_korea.fieldfloor, //+ 층수 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
                fieldheightfloor: layerInfo.wfs_korea.fieldheightfloor,
                floorheight: layerInfo.wfs_korea.floorheight, //+ 층수 높이 필드
                fieldlabel: layerInfo.wfs_korea.fieldlabel, //+ 라벨로 사용할 필드, defaultValue(opt.fieldlabel, undefined);
                transperent: false, //+ 투명화 여부
                minlevel: 17, //+ 가시화 최소레벨,defaultValue(opt.minlevel, 17)
                //drawline: false, //+ WFS 모델에 테투리 추가 여부
                opacity: 1, //+ 투명화 여부 true 일 경우, 투명도 설정값으로 적용
                textureurl: './image/buld/buld_texture_1.jpg', //+ 텍스처 url, defaultValue(opt.textureurl, undefined)
                useproxy:  (window.location.hostname !== 'localhost')
            });
            modelayers = wfsModel;

            wfsModel.setBuildingSn('bd_mgt_sn');
            app.addLayer(wfsModel);
            app.showLayer('WFS Model', true);
        }


        //+ 다른 건물 layer 선택시, 이전 생성된 layer 제거
        function removeLayer() {
            if (modelayers === undefined) {
                return;
            }
            app.removeLayer(modelayers);
            modelayers = undefined;
        }

        //+ U3F 모델
        window.metalayers = {};
        function createU3fModelLayers() {
            try {
                modelayers = app.createModelGroupLayer({
                    maxlevel: 19,
                    minlevel: 17,
                    name: 'u3f'
                });
                /* request U3f layers list */
                $.ajax({
                    url: modelU3fURL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let infos = result.params.data;
                    for (let i = 0; i < infos.length; i++) {
                        let info = infos[i];
                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (info.state === "ACTIVE") {
                            let baseName = info.fileName;
                            if(!baseName || baseName ==='')
                                baseName = info.name;
                            let options = {
                                name: info.name,
                                basename: baseName,
                                baseurl: info.baseUrl,
                                useproxy: false,
                                minlevel: info.metaData.minLevel,
                                maxlevel: info.metaData.maxLevel,
                                compressmodel: true,
                                isShareMaterial: false,
                                makeU3FPackage: 1
                            };
                            let subLayer = app.create3DFModelLayer(options);
                            if(subLayer !== false){
                                subLayer.then(function (layer) {
                                    modelayers.addLayer(subLayer);
                                    if(i === infos.length -1){
                                        console.log("u3f model layer load");
                                        app.showLayer(modelayers.getName(),true);
                                    }
                                }).fail(function (layer) {

                                });
                            }
                        }
                        window.metalayers[info.name] = info;
                    }
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }
        window.app = app;

        //+ 클릭시 해당 건물 선택
        let gizmoAnaly = app.getAnalysis('GizmoModel');

                                    //}
                                    str += '<div class="text-right">';
                                    str += '<div class="btn-group">';
                                    str += '<div class="btn btn-xs btn-danger btn-model-remove">삭제</div>';
                                    str += '</div>';
                                    str += '</div>';
                                    str += '</div>';
                                    str += '</div>';
                                }
                            }

                    }

            }
            str = str === '' ? '<pre>건물 편집 내용이 없습니다</pre>' : str;
            $('.remove-target-list').html(str);
