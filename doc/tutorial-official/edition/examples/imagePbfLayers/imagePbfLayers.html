<template data-example-rail>
    <button class="rail-button" type="button" data-panel-target="imagePbfLayers-option-panel" aria-expanded="false">
        <span class="rail-icon" aria-hidden="true">▦</span><span>레이어</span>
    </button>
</template>

<aside class="glass-panel example-panel example-option-panel" id="imagePbfLayers-option-panel" aria-hidden="true">
    <header class="panel-header">
        <div>
            <span class="eyebrow">EXAMPLE SETTINGS</span>
            <h2>PBF 레이어</h2>
        </div>
        <button class="panel-close" type="button" data-panel-close="imagePbfLayers-option-panel" aria-label="레이어 패널 닫기">×</button>
    </header>

    <div class="panel-content">
        <p class="panel-description">같은 PBF(MVT) 타일을 이미지로 그리는 레이어와 벡터로 그리는 레이어의 결과를 비교합니다. 데이터마다 각각 켜고 끌 수 있습니다.</p>

        <section class="example-section" aria-labelledby="imagePbfLayers-image-heading">
            <h3 id="imagePbfLayers-image-heading">이미지 PBF 레이어</h3>
            <p class="example-note">면과 선을 타일 이미지로 그립니다. 벡터 레이어와 같은 색·굵기로 맞춰 두었습니다.</p>
            <div class="example-chip-group" role="group" aria-labelledby="imagePbfLayers-image-heading">
                <button class="example-chip" type="button" data-layer-chip data-kind="image" data-source="buildings" aria-pressed="false" data-api-help="showLayer">건물</button>
                <button class="example-chip" type="button" data-layer-chip data-kind="image" data-source="roads" aria-pressed="false" data-api-help="showLayer">도로</button>
                <button class="example-chip" type="button" data-layer-chip data-kind="image" data-source="waterways" aria-pressed="false" data-api-help="showLayer">하천</button>
                <button class="example-chip" type="button" data-layer-chip data-kind="image" data-source="adminareas" aria-pressed="false" data-api-help="showLayer">행정경계</button>
            </div>
        </section>

        <section class="example-section" aria-labelledby="imagePbfLayers-vector-heading">
            <h3 id="imagePbfLayers-vector-heading">이미지 벡터 PBF 레이어</h3>
            <p class="example-note">면과 선을 모두 그립니다.</p>
            <div class="example-chip-group" role="group" aria-labelledby="imagePbfLayers-vector-heading">
                <button class="example-chip" type="button" data-layer-chip data-kind="vector" data-source="buildings" aria-pressed="false" data-api-help="showLayer">건물</button>
                <button class="example-chip" type="button" data-layer-chip data-kind="vector" data-source="roads" aria-pressed="false" data-api-help="showLayer">도로</button>
                <button class="example-chip" type="button" data-layer-chip data-kind="vector" data-source="waterways" aria-pressed="false" data-api-help="showLayer">하천</button>
                <button class="example-chip" type="button" data-layer-chip data-kind="vector" data-source="adminareas" aria-pressed="false" data-api-help="showLayer">행정경계</button>
            </div>
        </section>

        <section class="example-section" aria-labelledby="imagePbfLayers-result-heading">
            <h3 id="imagePbfLayers-result-heading">결과</h3>
            <dl class="example-result-list">
                <div><dt>이미지 PBF</dt><dd data-result-image>-</dd></div>
                <div><dt>벡터 PBF</dt><dd data-result-vector>-</dd></div>
            </dl>
            <p class="example-note" data-result-note>행정경계 두 가지는 타일이 아직 배포되지 않아 선택할 수 없습니다.</p>
        </section>
    </div>
</aside>
