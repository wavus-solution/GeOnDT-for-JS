<script id="ui-event">
    const homePositon = {lat: 127.002, lon:37.473, height: 1000, left: 152.2, down:80}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-image">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

<script id="main">
    //라이센스 인증
    GeOnDT.ready(function () {
        //지도 초기화
        const app = new GeOnDT.U3dAPP({
            containername:'map',
            methodheight: 'raw', //+ 지형처리방법
            searchtype:'sphere', //+ 타일검색 방법
            useFog: true, // 환경 안개 설정 (미입력시 기본값 true)
            useshadowmap: true,  //+ 광원,그림자 적용 (미입력시 기본값 true)
            frameOptimize : true, //+ 프레임 별 동적 옵션 적용 여부 (미입력시 기본값 true)
            autoClear: false, //자동 리소스 정리 여부 (미입력시 기본값 true)
            ratioTileSize: 1, // (미입력시 기본값 1)
            ratioModelTileSize: 1, // (미입력시 기본값 1)
            modelUpdateOffset: 0, //모델 업데이트 중심점 이동
        });
        window.app = app;

        app.on('change', updatePosData);
        app.setHomePosition(homePositon.lat, homePositon.lon, homePositon.height, homePositon.left, homePositon.down); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();

        app.createloadingBar('load');
        app.loadingBar();

        window.layers = new LayerList(GeOnDT, app);
        window.initLayerList = ['satellite','korea_terrain'];
        initLayer(initLayerList);
        initModelLayers();
        window.analy = app.getAnalysis('PhysicalFlow');
        window.analy.setOption({
            resolution:2, //물리 분석시, 지면 영역을 물리 분석영역으로 만들때의 해상도
            gravity:-12, //물리 분석 시, 중력값
            maxParticleNum:6000, //입자의 생성 한계값
            limitMinHeight:-10, //입자의 z값이 해당 값 밑으로 내려가면 사라짐
            limitTime:40000 //입자의 생존 시간 -> 생성 후 이시간이 지나면 사라짐
        });
    });
</script>
<script id="event">
    $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
        const $checkbox = $(e.target);
        const name = $checkbox.attr('target');
        checkLayer(name, $checkbox[0].checked);
    });

    $(document).on('click', '#btn-active', function (e) {
        const target = $(this).attr('target');

        if(window.analy.isActive()){
            window.analy.deactive();
            $(this).text('분석 시작');
            $('#btn-drawArea').hide();
            $('#btn-cancelArea').hide();
        }else{
            window.analy.active();
            $(this).text('분석 종료');

            $('#btn-drawArea').show();
            $('#btn-cancelArea').show();
        }
    });

    $(document).on('click', '#btn-drawArea', function (e) {
        if(window.checkKey){
            app.unkey('click',window.checkKey);
        }

        window.analy.drawPhysicalArea().then(()=>{
            console.log('분석 영역 그리기 완료');
            $('#btn-flow').show();
            $('#btn-rain').show();
            $('#btn-slope').show();

            if(window.isCheckSlope){
                $('#btn-checkClose').click();
            }

            if(window.slopeAspect) {
                $('#btn-slope').click();
            }

            $('#btn-slope').click();
        }).catch(()=>{
            console.log('분석 영역 그리기 오류');
            $('#btn-flow').hide();
            $('#btn-rain').hide();
            $('#btn-slope').hide();

            if(window.slopeAspect) {
                $('#btn-slope').click();
            }
        });
    });

    $(document).on('click', '#btn-cancelArea', function (e) {
        window.analy.stopDraw();
    });

    $(document).on('click', '#btn-clear', function (e) {
        window.analy.clear();
        if(window.slopeAspect) {
            $('#btn-slope').click();
        }

        if(window.checkKey ||window.isCheckSlope){
            $('#btn-checkClose').click();
        }

       if(window.heightDraw) {
           $('#btn-height').click();
       }

        $('#btn-flow').hide();
        $('#btn-rain').hide();
        $('#btn-slope').hide();
    });

    $(document).on('click', '#btn-flow', function (e) {
        window.analy.drawTargetArea().then(()=>{
            if(window.flowSimulation){
                //window.analy.stopSimulation( window.flowSimulation);
                //window.analy.removeSimulation( window.flowSimulation);
            }
            window.flowSimulation = window.analy.simulateFlow({
                amount: 8, //흐르기 시작할때 생성량
                initTime: 5000, //흐르기 생성 시간
                radius: 1, //입자 크기
                mass : 20, //입자 질량
                resolution : 0.4,//흐르기 생성할 포인트의 해상도
                steps :[
                    {max: 6, color: 0x232F94, opacity: 0.4},
                    {max: 15, color: 0x1D941F, opacity: 0.4},
                    {max: 25, color: 0xDFEB22, opacity: 0.4},
                    {color: 0xBD441B, opacity: 0.4}
                ], //범례 -> max는 속도를 의미 max 보다 작을시 해당 색과 투명도를 사용
                generateRatio :  1.0, // 흐르면서 생성 시킬지 여부의 확률, 값이 높을시 생성할 확률이 높아진다.
                generateAmount : 5 // 흐르면서 생성 시키는 입자의 양
            });
        });
    });

    $(document).on('click', '#btn-rain', function (e) {
        if(!window.rainSimulation) {
            window.rainSimulation = window.analy.simulateRain({
                amount : 4,
                initHeight : 600, //생성되는 입자 높이
                radius :1, //입자 크기
                mass : 8, //입자 질량
                color : 0x85D3F2,
                opacity: 0.3,
            });
            $(this).text('물 흐름 시뮬레이션 종료');
        }else{
            window.analy.stopSimulation( window.rainSimulation);
            window.analy.removeSimulation( window.rainSimulation);
            window.rainSimulation = undefined;
            $(this).text('물 흐름 시뮬레이션');
        }
    });

    $(document).on('click', '#btn-slope', function (e) {
        if(!window.slopeAspect) {
            if(window.checkKey ||window.isCheckSlope){
                $('#btn-checkClose').click();
            }

            const slopeAspect = app.getAnalysis('SlopeAspect');
            slopeAspect.mode = 'slope';
            slopeAspect.setOpacity(0.15);
            const info = window.analy.getInfo();
            slopeAspect.setAnalysisOption({
                width: info.width, //+ 가로
                height: info.height, //+ 새로
                nx: parseInt(info.width/5),  //+ 가로 갯수
                ny: parseInt(info.height/5)   //+ 새로 갯수
            });
            slopeAspect.getSlope(info.center).then(()=>{
                window.slopeAspect = slopeAspect;
                $(this).text('경사도 끄기');
            });
        }else{
            window.slopeAspect.clear();
            window.slopeAspect = undefined;
            $(this).text('경사도 켜기');
        }
    });

    $(document).on('click', '#btn-slopeCheck', function (e) {
        if(window.checkKey){
            app.unkey('click',window.checkKey);
        }
        app.getAnalysis('SlopeAspect').mode = 'slope';
        app.getAnalysis('SlopeAspect').setOpacity(1);
        app.getAnalysis('SlopeAspect').setAnalysisOption({
            width: 600, //+ 가로
            height: 600, //+ 새로
            nx: 100,  //+ 가로 갯수
            ny: 100   //+ 새로 갯수
        });
        window.checkKey = app.on('click', function (e) {
            //클릭한 지점의 경사향 분석
            if(window.slopeAspect) {
                $('#btn-slope').click();
            }

            app.getAnalysis('SlopeAspect').getSlope( app.closestPointAtPixel(e) ).then(()=>{
                window.isCheckSlope = true;
                $('#btn-checkClose').show();
            });
            app.unkey('click',window.checkKey);
            window.checkKey = undefined;
        });
    });

    $(document).on('click', '#btn-checkClose', function (e) {
        if(window.checkKey){
            app.unkey('click',window.checkKey);
        }
        if(window.isCheckSlope){
            app.getAnalysis('SlopeAspect').clear();
        }
        $(this).hide();
    });

    $(document).on('click', '#btn-height', function (e) {
        if(!window.heightDraw) {
            window.heightDraw = app.getAnalysis("Height");
            window.heightDraw.drawHeight(true);
            $(this).text('고도범례 끄기');
        }else{
            window.heightDraw.drawHeight(false);
            window.heightDraw = undefined;
            $(this).text('고도범례 켜기');
        }
    });

</script>
<script id="function">
    function checkLayer(name, checked) {
        if (checked) {
            if (layers[name].layer === undefined) {
                layers[name].create();
            }
            layers[name].show(true);
        } else {
            layers[name].show(false);
        }
    }

    function initLayer(list) {
        const basename = list[0];
        GeOnDT.UDEF.createPromise((resolve) => {
            list.forEach((name) => {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                    layers[name].ready.then(() => {
                        if (name === basename)
                            app.setNameBaseLayer(name);

                        app.showLayer(name, true);
                        $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                    });
                }
            });
            resolve(true);
        }).then((resolve) => {
            if (resolve)
                app.endloadingBar();
        });
    }

    function initModelLayers() {
        try {
            modelayers = app.createModelGroupLayer({
                maxlevel: 19,
                minlevel: 17,
                name: 'u3f'
            });
            /* request U3f layers list */
            $.ajax({
                url: modelU3fURL,
                crossDomain: true,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                },
                error: function (e) {
                    console.info(e);
                }
            }).then(function (result) {
                let infos = result.params.data;
                for (let i = 0; i < infos.length; i++) {
                    let info = infos[i];
                    /* 레이어 목록 중 발행중인 레이어만 요청 */
                    if (info.state === "ACTIVE") {
                        let baseName = info.fileName;
                        if(!baseName || baseName ==='')
                            baseName = info.name;
                        let options = {
                            name: info.name,
                            basename: baseName,
                            baseurl: info.baseUrl,
                            useproxy: false,
                            minlevel: info.metaData.minLevel,
                            maxlevel: info.metaData.maxLevel,
                            compressmodel: true,
                            isShareMaterial: false,
                            makeU3FPackage: 1,
                        };
                        let subLayer = app.create3DFModelLayer(options);
                        if(subLayer !== false){
                            subLayer.then(function (layer) {
                                modelayers.addLayer(subLayer);
                                if(i === infos.length -1){
                                    console.log("u3f model layer load");
                                    app.showLayer(modelayers.getName(),true);
                                }
                            }).fail(function (layer) {

                            });
                        }
                    }
                }
            })
        } catch (localBuldError) {
            console.log('Initialize Error Message : ' + localBuldError);
        }
    }

</script>
