<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="./">
    <title>GeOnDT 예제 미리보기</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="lib/ol/ol.css" type="text/css">
    <link rel="stylesheet" href="css/pastel-glass-map-theme.css" type="text/css">
    <style id="runner-example-style"></style>
</head>
<body class="example-runner-page">
<main class="example-app">
    <div id="map-wrapper"><div id="map"></div></div>
    <h1 class="example-title" id="runner-title">예제 미리보기</h1>

    <nav class="example-rail" aria-label="예제 도구">
        <span class="example-brand"><img src="image/geondt-loading-color-logo.png" alt="GeOnDT"></span>
        <button class="rail-button" type="button" data-panel-target="example-explanation" aria-expanded="false">
            <span class="rail-icon">?</span><span>도움말</span>
        </button>
        <div id="runner-example-rail" class="runner-example-rail"></div>
    </nav>

    <button class="editor-mode-toggle active" type="button" data-runner-action="toggle-editor" aria-pressed="true">
        <span class="code-toggle-icon">&lt;/&gt;</span><span>코드 편집</span>
    </button>

    <aside class="glass-panel explanation-panel" id="example-explanation" aria-hidden="true">
        <header class="panel-header">
            <div><span class="eyebrow">EXAMPLE GUIDE</span><h2 id="runner-help-title">예제 미리보기</h2></div>
            <button class="panel-close" type="button" data-panel-close="example-explanation" aria-label="도움말 닫기">×</button>
        </header>
        <div class="panel-content markdown-document" id="runner-help-content"></div>
    </aside>

    <div id="runner-example-ui"></div>

    <div class="map-tools" aria-label="지도 조작">
        <button class="map-button" type="button" data-map-action="home" title="초기 위치" aria-label="초기 위치"><img src="image/home_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
        <button class="map-button" type="button" data-map-action="north" title="정북 방향으로 맞추기" aria-label="정북 방향"><span class="compass-icon" id="example-compass" aria-hidden="true"><b>N</b></span></button>
        <button class="map-button" type="button" data-map-action="zoom-in" title="확대" aria-label="확대">＋</button>
        <button class="map-button" type="button" data-map-action="zoom-out" title="축소" aria-label="축소">−</button>
    </div>

    <div id="load" class="loading-indicator"><img src="image/loading.svg" alt="불러오는 중"></div>

    <aside id="example-api-help" class="example-api-help" role="tooltip" hidden>
        <strong data-api-help-title></strong>
        <p data-api-help-description></p>
        <section data-api-help-dynamic-section>
            <b>현재 설정</b>
            <pre><code data-api-help-code></code></pre>
        </section>
        <section data-api-help-source-section hidden>
            <b>실제 구현</b>
            <small data-api-help-source-location></small>
            <pre><code data-api-help-source-code></code></pre>
            <button type="button" data-api-help-open-source>코드에서 보기</button>
        </section>
        <p data-api-help-source-error hidden></p>
    </aside>
</main>

<script src="../common/jquery/jquery-3.7.1.min.js"></script>
<script src="../common/jquery/jquery-ui.min.js"></script>
<script src="../common/bootstrap/bootstrap.min.js"></script>
<script src="../common/zlib/zlib.min.js"></script>
<script src="../common/jstree/jstree.min.js"></script>
<script src="../common/chart/Chart.min.js"></script>
<script src="../common/prism/prism.js"></script>
<script src="../common/dateformat.js"></script>
<script src="../common/license.js"></script>
<script>
window.__EXAMPLE_RUNNER_CONFIG__ = {targetPrefix: ''};
</script>

<script src="js/layerInfo.js"></script>
<script id="GeOnDT" src="../../dist/GeOnDT.min.js"></script>
<script src="js/example-theme.js"></script>
<script src="js/example-camera-status.js"></script>
<script src="js/example-common-layers.js"></script>
<script type="module">
import(/* @vite-ignore */ new URL('js/example-runner.js', document.baseURI).href);
</script>
</body>
</html>
