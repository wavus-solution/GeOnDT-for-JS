<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (GeOnDT, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._GeOnDT = GeOnDT;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._GeOnDT.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (GeOnDT, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();

            self.ready.resolve();

</script>
<script id="layer-setting">
    const LAYER_OPT = {
        satellite: {
            name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        },
        hybrid: {
            name: 'hybrid', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldhybirdurl,  //+ 이미지 데이터 URL, *필수 입력
            reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
            transparent: true //+ layer 투명화 여부
        },
        korea_terrain: {
            name: 'korea_terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자, *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 17, //+ 가시화 최대 레벨
        }
    };

    let LayerList = function (GeOnDT, app) {
        return {
            //이미지레이어
            satellite: new ImageLayer(GeOnDT, app, LAYER_OPT.satellite),
            hybrid: new ImageLayer(GeOnDT, app, LAYER_OPT.hybrid),
            //고도레이어
            korea_terrain: new HeightLayer(GeOnDT, app, LAYER_OPT.korea_terrain)
        }
    }
</script>

<script>
    let cnt = 0;
    const COMPONENT_SPEED = 1000;
    const COMPONENT_START_POSITION = {x: 126.91415231094318, y: 37.53189615862187, z: 430};
    const COMPONENT_ROUTE_RANGE = 0.025;
    let componentSeq = 0;
    const componentNamesByModel = {
        ka27: [],
        drone_02: []
    };
    const modelCounts = {
        ka27: 0,
        drone_02: 0
    };
    GeOnDT.ready(function () {
        const componentOption = {
            model: {
                name: 'animationModel',
                rotation: {x: 0, y: 0, z: 0},
                scale: {x: 5, y: 5, z: 5},
                needxml: false,
                drawline: false,
                backgroudlight: false,
                type: "model",
                listmodel: [
                    {
                        name: 'ka27',
                        baseurl: layerInfo.model.helicopterurl,
                        fileName: 'ka27',
                        ext: 'fbx',
                        rotation: {x: 90, y: 0, z: 0},
                        scale: {x: 0.3, y: 0.3, z: 0.3}
                    },
                    {
                        name: 'drone_02',
                        baseurl: layerInfo.model.drone2url,
                        fileName: layerInfo.model.drone2name,
                        ext: layerInfo.model.drone2ext,
                        rotation: {x: 0, y: 0, z: 0},
                        scale: {x: 1.2, y: 1.2, z: 1.2}
                    }
                ]
            }
        };
        const modelInfoMap = componentOption.model.listmodel.reduce(function (map, info) {
            map[info.name] = info;
            return map;
        }, {});

        //지도 기본 세팅///////////////////////////////////////
        var app = new GeOnDT.U3dAPP({
            containername: 'map', //+ U3dApp(지도영역)의 div ID, *필수 입력
            ratioModelTileSize : 3,
            postOption: {
                useAO:false,
                useBloom: false
            }
        });
        window.app = app;
        app.setHomePosition(126.9395, 37.525, 5000, 2, 10); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();

        app.on('change', updatePosData);

        app.createloadingBar('load');
        app.loadingBar();

        //이미지 레이어 생성
        let layers = new LayerList(GeOnDT, app);
        let initLayerList = ['satellite', 'korea_terrain']
        initLayar(initLayerList);

        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayar(list) {
            const basename = list[0];
            GeOnDT.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);

                            app.showLayer(name, true);
                            $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }

        // u3f(2.3) model layer 가시화
        const u3fLayerName = 'U3F_2.3_ModelLayer';
        $('#u3f-layer').on('click', function () {
            const checked = this.checked;
            const layer = app.getLayerByName(u3fLayerName);
            if (checked) {
                if(layer){
                    return app.showLayer(u3fLayerName, true);
                }else{
                    createU3fModelLayers().then(function () {
                        return app.showLayer(u3fLayerName, true);
                    }).catch(function () {
                        $('#u3f-layer').prop('checked', false);
                    });
                }
            }else{
                if(layer)
                    app.showLayer(u3fLayerName, false);
            }
        });

        function getU3fModelLayerInfo() {
            return {
                useServer: true,
                serverUrl: trdDimResUrl + 'v1/layers?type=u3f&category=AL_D198',
                minlevel: 15,
                maxlevel: 15,
                options: {
                    useproxy: false,
                    compressmodel: true,
                    isShareMaterial: true,
                    makeU3FPackage: 0
                }
            };
        }

        function requestU3fLayerList(serverUrl) {
            return $.ajax({
                url: serverUrl,
                crossDomain: true,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                },
                error: function (e) {
                    console.info(e);
                }
            });
        }

        function createU3fModelLayers() {
            const info = getU3fModelLayerInfo();
            let groupLayer = app.createModelGroupLayer({
                name: u3fLayerName,
                maxlevel: info.maxlevel,
                minlevel: info.minlevel
            });

            requestU3fLayerList(info.serverUrl).then(function (result) {
                const infos = (result && result.params && result.params.data) ? result.params.data : [];
                const activeInfos = infos.filter(function (layerInfo) {
                    return layerInfo && layerInfo.state === 'ACTIVE';
                });

                if (activeInfos.length === 0) {
                    return;
                }

                activeInfos.forEach(function (layerInfo) {
                    let baseName = layerInfo.fileName;
                    if (!baseName || baseName === '') {
                        baseName = layerInfo.name;
                    }

                    const options = {
                        name: layerInfo.name,
                        basename: baseName,
                        baseurl: layerInfo.baseUrl,
                        useproxy: info.options.useproxy,
                        minlevel: layerInfo.metaData ? layerInfo.metaData.minLevel : info.minlevel,
                        maxlevel: layerInfo.metaData ? layerInfo.metaData.maxLevel : info.maxlevel,
                        compressmodel: info.options.compressmodel,
                        isShareMaterial: info.options.isShareMaterial,
                        makeU3FPackage: info.options.makeU3FPackage
                    };

                    const subLayer = app.create3DFModelLayer(options);
                    if(subLayer){
                        subLayer.then(function () {
                            groupLayer.addLayer(subLayer);
                        })
                    }

                });
            })
            return groupLayer
        }

        //////프로세스 디버그 가시화
        $('#createDebugCanvas').on('click',function (){
            const checked = this.checked;
            if(checked)
                app?.createDebugCanvas?.();
            else{
                app?.removeDebugCanvas?.();
            }
        })

        /////////////////////////////////////////////////////

        var option = componentOption.model;
        var animationLayer = new GeOnDT.model.U3dMultipleComponentLayer(option);
        app.addLayer(animationLayer);
        animationLayer.setInstanced(true);
        window.animationLayer = animationLayer;
        animationLayer.ready(function () {
            app.showLayer(option.name, true).then(function () {
                console.log("U3dMultipleComponentLayer show");
            });
        });

        $(document).on('click', 'input[type="radio"]', function (e) {
            var target = e.target.value;
            if (target === 'play') {
                animationLayer.startAnimation();
            } else {
                animationLayer.pauseAnimation();
            }
        })

        $('#deleteAll').on('click', function () {
            cnt = 0;
            componentNamesByModel.ka27.length = 0;
            componentNamesByModel.drone_02.length = 0;
            modelCounts.ka27 = 0;
            modelCounts.drone_02 = 0;
            updateCountText();
            animationLayer.removeAllComponent();
        });

        let viewTarget = undefined;
        $('#map-mode').on('click', function () {
            if(!viewTarget) return;
            viewTarget.setCameraTrace(false);
            let position = viewTarget.getVectorPosition();
            app.setCameraWorldPosition({
                x: position.x,
                y: position.y,
                z: position.z + 1000,
                rotateX: 0,
                rotateY: 0
            });
        });

        $('#randomView').on('click', function () {
            if(viewTarget)  {
                viewTarget.setCameraTrace(false);
                viewTarget = undefined;
            }
            viewTarget = getRandomTarget();
            if(!viewTarget) return;
            const offset = {x: 0, y: -0, z: 50}
            const targetOffset = {x: 40, y: 40, z: 30};
            viewTarget.setCameraTrace(true, 'ThirdPersonFront', offset, targetOffset);
        });

        function getRandomTarget() {
            const list = animationLayer.getComponents();

            if (!Array.isArray(list) || list.length === 0) {
                return undefined;
            }

            const randomIndex = Math.floor(Math.random() * list.length);
            return list[randomIndex];
        }

        function updateCountText() {
            $('#heliCnt').text(modelCounts.ka27);
            $('#droneCnt').text(modelCounts.drone_02);
            $('#totalCnt').text(cnt);
        }

        function getRequestCount() {
            const count = parseInt($('#add-count').val(), 10);
            if (!Number.isFinite(count) || count < 1) {
                $('#add-count').val(1);
                return 1;
            }
            return count;
        }

        function getSelectedModelInfo() {
            return modelInfoMap[$('#object-type').val()] || modelInfoMap.ka27;
        }

        function getRandomRoutePoint(basePosition, minHeight, maxHeight) {
            return {
                x: basePosition.x + ((Math.random() * 2 - 1) * COMPONENT_ROUTE_RANGE),
                y: basePosition.y + ((Math.random() * 2 - 1) * COMPONENT_ROUTE_RANGE),
                z: minHeight + Math.random() * (maxHeight - minHeight)
            };
        }

        function createDefaultRandomRoute() {
            const start = Object.assign({}, COMPONENT_START_POSITION);
            return [
                start,
                getRandomRoutePoint(COMPONENT_START_POSITION, 1200, 1500),
                getRandomRoutePoint(COMPONENT_START_POSITION, 1500, 2000),
                getRandomRoutePoint(COMPONENT_START_POSITION, 1800, 2500),
                getRandomRoutePoint(COMPONENT_START_POSITION, 1500, 2000),
                Object.assign({}, COMPONENT_START_POSITION)
            ];
        }

        $('#delete').on('click', function () {
            const selectedModel = getSelectedModelInfo().name;
            const selectedNames = componentNamesByModel[selectedModel];
            const count = Math.min(getRequestCount(), selectedNames.length);
            cnt -= count;
            for (var i = 0; i < count; i++) {
                const componentName = selectedNames.pop();
                if (componentName) {
                    modelCounts[selectedModel] = Math.max(0, modelCounts[selectedModel] - 1);
                    animationLayer.removeComponentByName(componentName);
                }
            }
            updateCountText();
        });

        function addComponent(delay, modelInfo){
            return new Promise((resolve, reject) => {
                setTimeout(function () {
                    try{
                        const componentName = modelInfo.name + '_' + componentSeq++;
                        componentNamesByModel[modelInfo.name].push(componentName);
                        modelCounts[modelInfo.name] += 1;
                        const component = animationLayer.addPosition({
                            geoPosition: COMPONENT_START_POSITION, //+ 컴포넌트를 추가할 위경도 위치
                            speed: COMPONENT_SPEED, //+ 컴포넌트 속도
                            repeat: true, //+ 반복 이동 여부
                            movepointlist: [],    //경로설정 옵션, 컴포넌트의 이동경로 배열
                            object: modelInfo.name,
                            rotation: modelInfo.rotation, //모델 회전 보정
                            scale: modelInfo.scale,
                            name: componentName,
                            /*                      drawpath: true,
                                                    pathcolor: '#001177', //출력될 경로의 색상
                                                    pathopacity: 0.15, // 출력될 경로의 투명도
                                                    pathwidth: 50, //출력될 경로의 넓이
                                                    pathHeight: 30, // 출력될 경로의 높이
                                                    pathedge: false*/
                        });

                        /*  component.getMixerController()?.on('update', (e)=>{
                              if(component._animation === false && component._setInstanced)
                                  component.updateMatrix();
                          });*/
                        resolve();
                    } catch (e) {
                        reject();
                    }
                },delay);
            })
        }

        $('#add').on('click', async function () {
            const count = getRequestCount();
            const modelInfo = getSelectedModelInfo();
            cnt += count;
            updateCountText();

            $("input:radio[name='mode']:radio[value='play']").click();
            try{
                for (let i = 0; i < count; i++) {
                    await addComponent(5,modelInfo);
                }
            }catch (e){
                console.error(e);
            }

            updateCountText();
        });
    });
</script>
</body>
</html>
