<template data-example-rail>
    <button class="rail-button" type="button" data-panel-target="group-boundary-helper-panel" aria-expanded="false">
        <span class="rail-icon" aria-hidden="true">◎</span><span>경계 제어</span>
    </button>
</template>

<aside class="glass-panel example-panel group-boundary-panel" id="group-boundary-helper-panel" aria-hidden="true">
    <header class="panel-header">
        <div>
            <span class="eyebrow">GROUP BOUNDARY</span>
            <h2>그룹 경계 제어</h2>
        </div>
        <button class="panel-close" type="button" data-panel-close="group-boundary-helper-panel" aria-label="그룹 경계 제어 닫기">×</button>
    </header>

    <div class="panel-content">
        <p class="panel-description">여러 대형이 이동할 때 그룹 경계 헬퍼가 어떻게 다시 계산되는지 확인합니다.</p>

        <section class="group-boundary-section" aria-labelledby="group-boundary-animation-heading">
            <h3 id="group-boundary-animation-heading">애니메이션</h3>
            <div class="group-boundary-action-row">
                <button id="group-boundary-play-toggle" class="group-boundary-action" type="button" data-api-help="group.toggle-animation">일시정지</button>
                <button id="group-boundary-reset" class="group-boundary-action" type="button" data-api-help="group.reset">초기화</button>
            </div>
            <label class="group-boundary-speed-row" for="group-boundary-speed" data-api-help="group.speed">
                <span>애니메이션 속도</span>
                <input id="group-boundary-speed" type="range" min="0.25" max="3" step="0.25" value="1">
                <output id="group-boundary-speed-value" for="group-boundary-speed">1.00</output>
            </label>
        </section>

        <section class="group-boundary-section" aria-labelledby="group-boundary-state-heading" data-api-help="group.render-update">
            <h3 id="group-boundary-state-heading">현재 상태</h3>
            <dl class="group-boundary-state-list">
                <div><dt>현재 스텝</dt><dd id="group-boundary-step">0</dd></div>
                <div><dt>그룹 수</dt><dd id="group-boundary-formation-count">0</dd></div>
                <div><dt>헬퍼 수</dt><dd id="group-boundary-helper-count">0</dd></div>
            </dl>
        </section>
    </div>
</aside>
