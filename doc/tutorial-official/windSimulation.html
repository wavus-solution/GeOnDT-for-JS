<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>

            function dfs_xy_conv(code, x, y) {
                // LCC DFS 좌표변환 ( code : "toXY"(위경도->좌표, v1:위도, v2:경도), "toLL"(좌표->위경도,v1:x, v2:y) )
                const RE = 6371.00877; // 지구 반경(km)
                const GRID = 5.0; // 격자 간격(km)
                const SLAT1 = 30.0; // 투영 위도1(degree)
                const SLAT2 = 60.0; // 투영 위도2(degree)
                const OLON = 126.0; // 기준점 경도(degree)
                const OLAT = 38.0; // 기준점 위도(degree)
                const XO = 43; // 기준점 X좌표(GRID)
                const YO = 136; // 기1준점 Y좌표(GRID)

                const DEGRAD = Math.PI / 180.0;
                const RADDEG = 180.0 / Math.PI;

                var re = RE / GRID;
                var slat1 = SLAT1 * DEGRAD;
                var slat2 = SLAT2 * DEGRAD;
                var olon = OLON * DEGRAD;
                var olat = OLAT * DEGRAD;

                var sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5);
                sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
                var sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
                sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
                var ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
                ro = re * sf / Math.pow(ro, sn);
                var rs = {};
                if (code == "toXY") {
                    rs['lat'] = y;
                    rs['lon'] = x;
                    var ra = Math.tan(Math.PI * 0.25 + (y) * DEGRAD * 0.5);
                    ra = re * sf / Math.pow(ra, sn);
                    var theta = x * DEGRAD - olon;
                    if (theta > Math.PI) theta -= 2.0 * Math.PI;
                    if (theta < -Math.PI) theta += 2.0 * Math.PI;
                    theta *= sn;
                    rs['x'] = Math.floor(ra * Math.sin(theta) + XO + 0.5);
                    rs['y'] = Math.floor(ro - ra * Math.cos(theta) + YO + 0.5);
                } else {
                    rs['x'] = x;
                    rs['y'] = y2;
                    var xn = x - XO;
                    var yn = ro - y + YO;
                    ra = Math.sqrt(xn * xn + yn * yn);
                    if (sn < 0.0) -ra;
                    var alat = Math.pow((re * sf / ra), (1.0 / sn));
                    alat = 2.0 * Math.atan(alat) - Math.PI * 0.5;

                    if (Math.abs(xn) <= 0.0) {
                        theta = 0.0;
                    } else {
                        if (Math.abs(yn) <= 0.0) {
                            theta = Math.PI * 0.5;
                            if (xn < 0.0) -theta;
                        } else theta = Math.atan2(xn, yn);
                    }
                    var alon = theta / sn + olon;
                    rs['lat'] = alat * RADDEG;
                    rs['lon'] = alon * RADDEG;
                }
                return rs;
            }
        }

                caches.forEach(function (tile) {
                    if (tile._rlevel === 17 && tile._boundingbox.intersectsBox(bbox)) {
                        maskLayer.createMask(tile);
                        resultList.push(tile.getKey());
                    }
                })
            }
            return resultList;
        }
