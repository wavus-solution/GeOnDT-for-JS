<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    //라이센스 인증
    Union3D.ready(function () {
        //지도 초기화
        window.app = new Union3D.U3dAPP({
            containername: 'map' //+ U3dApp(지도영역)의 div ID, *필수 입력
        });
        app.setHomePosition(126.9395, 37.52, 450, 0, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition(); //+ home position 수정
        app.on('change', updatePosData);

        const imageLayer = new GeOnDT.image.U3dImageXYZLayer({
            name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        });

        app.addLayer(imageLayer);
        imageLayer.then(()=>{
            app.showLayer('satellite', true);
        });

        //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.

        //+ u3f 모델 //////////////////////////////////////////////
        initModelLayers();

        const terrainLayer = new Union3D.terrain.U3dHeightXYZLayer({
            name: 'Korea Terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자,  *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false), *필수 입력
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 17, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
        });
        app.addLayer(terrainLayer);
        app.showLayer('Korea Terrain', true);

        // 모의 주행모드 활성화
        const analy = app.getAnalysis('Route');
        window.analy = analy;
        analy.active();
        analy.setLineColor('#def0ff');
        analy.setLineImage('https://dt-data.mappick.co.kr/ServiceData/poi_image/arrow.png', Math.PI / 180 * 270);

        analy.on("start", (e)=>{
            console.info('start')
        })
        analy.on("progress", (e)=>{
            const info = e.data;
            console.log(`progress : ${info.percent}%`)
        })
        analy.on("complete", (e)=>{
            console.info('complete')
        })

        // 경로 그리기
        $(document).on('click', '.btn-draw-line', function () {
            app.off('click');
            app.on('click', click);
            app.on('dblclick', dblclick);

            analy.active();
            analy.setCurrentPos(0);
            analy.stop();

            app.disableCameraPan(false);
            app.disableCameraZoom(false);
            app.setPanMode();
        });

        function click(e) {
            analy.addPoint(e);
        }

        function dblclick() {
            app.off('click', click);
            app.off('dblclick', dblclick);
        }

        const routeJsonString = '{"positions":[{"x":126.93898347243308,"y":37.518139868258075,"z":14},{"x":126.94086993452999,"y":37.51908037323372,"z":10.686318226605493},{"x":126.94110349650389,"y":37.51982136880482,"z":11.093164269198581},{"x":126.94031297905377,"y":37.52127483874357,"z":11.468497766100512},{"x":126.93789651093914,"y":37.52321987921631,"z":13.999999999999972},{"x":126.93455477808175,"y":37.520918598730866,"z":15},{"x":126.93623462766328,"y":37.51873837279595,"z":15},{"x":126.93806719084316,"y":37.519536371379075,"z":15},{"x":126.938588213708,"y":37.518089992663214,"z":14},{"x":126.93683649890373,"y":37.51773373744486,"z":13.799615807175854},{"x":126.93494105365397,"y":37.51749860806902,"z":13.999999999999972},{"x":126.93487817158409,"y":37.517876239736296,"z":14.922977070906398},{"x":126.93402477206405,"y":37.51870274766021,"z":15},{"x":126.932830012736,"y":37.51987124324239,"z":15.000000000000028},{"x":126.9314106745869,"y":37.51895924825796,"z":15},{"x":126.93031472994012,"y":37.518317995110365,"z":15.000000000000028},{"x":126.92907505484786,"y":37.517584109745954,"z":15},{"x":126.92857199828869,"y":37.51734185474018,"z":14.911498078169927},{"x":126.92690113185999,"y":37.51898062326795,"z":15.000000000000028},{"x":126.92661367096902,"y":37.5193867472948,"z":15}],"speed":50}';

        //경로 불러오기
        $(document).on('click', '.btn-load-line', function () {
            analy.clear();
            const params = JSON.parse(routeJsonString);
            params.positions.forEach(function (position) {
                analy.addPoint(position);
            });
            analy.showLine();
        });

        //경로 지우기
        $(document).on('click', '.btn-clear-line', function () {
            app.off('click', click);
            app.off('dblclick', dblclick);

            analy.stop();
            analy.clear();

            app.disableCameraPan(false);
            app.disableCameraZoom(false);
            app.setPanMode();
        });

        //경로 보이기
        $(document).on('click', '.btn-show-line', function () {
            analy.showLine();
        });

        //경로 감추기
        $(document).on('click', '.btn-hide-line', function () {
            analy.hideLine();
        });

        // 모의주행 시작
        $(document).on('click', '.btn-start', function () {
            analy.start();
        });

        // 모의주행 중지
        $(document).on('click', '.btn-stop', function () {
            analy.stop();
        });

        // 모의주행 다시 시작
        $(document).on('click', '.btn-restart', function () {
            analy.restart();
        });

        //지도 모드
        $(document).on('click', '.btn-panmode', function () {
            app.setPanMode();
        });

        //주행시점 높이 설정
        $(document).on('change', '.input-height', function () {
            analy.setHeight(Number(this.value));
        });

        //주행시점 각도 설정
        $(document).on('change', '.input-angle', function () {
            analy.setAngle(Number(this.value));
        });

        //주행 속도 설정
        $(document).on('change', '.input-speed', function () {
            analy.setSpeed(Number(this.value));
        });

        //경로 설정 (색상, 투명도, 두께)
        $(document).on('change', '.line-style', function () {
            const type = $(this).attr('target');
            if (type === 'color') {
                //색상변경
                analy.setLineColor(this.value)
            } else if (type === 'opacity') {
                //투명도변경
                analy.setLineOpacity(Number(this.value))
            } else if (type === 'width') {
                //두께 변경
                analy.setLineWidth(Number(this.value))
            }
        });

        function initModelLayers() {
            try {
                let modelayers = app.createModelGroupLayer({
                    maxlevel: 19,
                    minlevel: 17,
                    name: 'u3f'
                });
                /* request U3f layers list */
                $.ajax({
                    url: modelU3fURL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let maxprocess_model_ = 10;
                    let sizeblock_model_ = 10;
                    let updateimagedistance_ = 50;
                    let wrapping = undefined;
                    let infos = result.params.data;

                    for (let i = 0; i < infos.length; i++) {
                        let info = infos[i];
                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (info.state === "ACTIVE") {
                            let metaData = info.metaData;
                            let subLayerName = info.name;
                            let buldLayerConstruct = {};
                            Object.assign(buldLayerConstruct, {name: subLayerName});
                            Object.assign(buldLayerConstruct, {basename: subLayerName});
                            Object.assign(buldLayerConstruct, {baseurl: info.baseUrl});
                            Object.assign(buldLayerConstruct, {minlevel: metaData.minLevel});
                            Object.assign(buldLayerConstruct, {maxlevel: metaData.maxLevel});
                            Object.assign(buldLayerConstruct, {srs: metaData.srs});
                            Object.assign(buldLayerConstruct, {ext: '.' + metaData.ext});
                            Object.assign(buldLayerConstruct, {maxprocess: maxprocess_model_});
                            Object.assign(buldLayerConstruct, {sizeblock: sizeblock_model_});
                            Object.assign(buldLayerConstruct, {updateimagedistance: updateimagedistance_});
                            Object.assign(buldLayerConstruct, {grouplayer: modelayers});
                            Object.assign(buldLayerConstruct, {wrapping: wrapping});
                            Object.assign(buldLayerConstruct, {renderorder: 0});
                            Object.assign(buldLayerConstruct, {useproxy: false});
                            let subLayer = app.create3DFModelLayer(buldLayerConstruct);
                            subLayer.then(function (layer) {
                                modelayers.addLayer(subLayer);
                                if (i === infos.length - 1) {
                                    console.log("u3f model layer load");
                                    app.showLayer(modelayers.getName(), true);
                                }
                            }).fail(function (layer) {

                            });
                        }
                    }
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }
    });
</script>
