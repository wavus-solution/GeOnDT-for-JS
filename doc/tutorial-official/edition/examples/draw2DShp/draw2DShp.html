<template data-example-rail>
    <button class="rail-button" type="button" data-panel-target="draw2DShp-option-panel" aria-expanded="false">
        <span class="rail-icon" aria-hidden="true">▦</span><span>SHP</span>
    </button>
</template>

<aside class="glass-panel example-panel draw2DShp-option-panel" id="draw2DShp-option-panel" aria-hidden="true">
    <header class="panel-header">
        <div>
            <span class="eyebrow">2D SHAPEFILE LAYER</span>
            <h2>2D SHP 레이어</h2>
        </div>
        <button class="panel-close" type="button" data-panel-close="draw2DShp-option-panel" aria-label="2D SHP 패널 닫기">×</button>
    </header>

    <div class="panel-content">
        <p class="panel-description">로컬 SHP 파일 세트를 읽어 2D 이미지 레이어(<code>U2dShpLayer</code>)로 그리고, 채우기·외곽선·라벨 스타일을 실시간으로 바꿉니다.</p>
        <section class="draw2DShp-section" aria-labelledby="draw2DShp-file-heading">
            <h3 id="load-sample-heading">불러오기</h3>
            <button type="button" class="draw2DShp-reset" id="load-sample"> 샘플 데이터 출력 </button>
            <p class="draw2DShp-help">
                기본적으로 제공되는 샘플 .shp 데이터를 출력합니다.
            </p>
        </section>
        <section class="draw2DShp-section" aria-labelledby="draw2DShp-file-heading">
            <h3 id="draw2DShp-file-heading">SHP 파일</h3>
            <input type="file" id="shp-files" accept=".shp,.prj,.dbf" multiple>
            <p class="draw2DShp-help">
                같은 이름의 SHP 파일 세트를 선택하세요.<br>
                .shp는 필수이며 .prj와 .dbf는 선택 사항입니다. .prj가 없으면 EPSG:5179로 해석합니다.
            </p>
        </section>

        <section class="draw2DShp-section" aria-labelledby="draw2DShp-style-heading">
            <h3 id="draw2DShp-style-heading">2D SHP 스타일</h3>
            <div class="draw2DShp-style-list">
                <label class="draw2DShp-style-row draw2DShp-style-toggle">
                    <input type="checkbox" id="use-fill" checked>
                    <span>채우기 사용</span>
                </label>
                <div class="draw2DShp-style-row">
                    <label for="fill-color">채우기 색</label>
                    <input type="color" id="fill-color" value="#3399cc">
                </div>
                <div class="draw2DShp-style-row">
                    <label for="fill-opacity">채우기 투명도</label>
                    <input type="range" id="fill-opacity" min="0" max="1" step="0.05" value="0.35">
                    <output id="fill-opacity-value" for="fill-opacity">0.35</output>
                </div>
                <label class="draw2DShp-style-row draw2DShp-style-toggle">
                    <input type="checkbox" id="use-stroke" checked>
                    <span>외곽선 사용</span>
                </label>
                <div class="draw2DShp-style-row">
                    <label for="stroke-color">외곽선 색</label>
                    <input type="color" id="stroke-color" value="#0f4c75">
                </div>
                <div class="draw2DShp-style-row">
                    <label for="stroke-width">외곽선 두께</label>
                    <input type="range" id="stroke-width" min="0" max="10" step="0.5" value="2">
                    <output id="stroke-width-value" for="stroke-width">2</output>
                </div>
                <div class="draw2DShp-style-row">
                    <label for="feature-label">공통 라벨</label>
                    <input type="text" class="draw2DShp-text" id="feature-label" placeholder="표시하지 않음">
                </div>
            </div>
            <button type="button" class="draw2DShp-reset" id="reset-style">기본 스타일</button>
        </section>

        <section class="draw2DShp-section" aria-labelledby="draw2DShp-status-heading">
            <h3 id="draw2DShp-status-heading">상태</h3>
            <p id="shp-status" class="draw2DShp-status" role="status" aria-live="polite">SHP 파일을 선택해 주세요.</p>
        </section>
    </div>
</aside>
