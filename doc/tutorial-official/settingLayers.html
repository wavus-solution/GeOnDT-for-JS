<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    //라이센스 인증
    Union3D.ready(function () {
        var layers = {};
        //레이어 생성자 옵션
        var LAYER_OPT = {
            //+ 이미지 ////////////////////////////////
            satellite: {
                name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
                baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
                reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)

                baseurl: layerInfo.image.osmurl, //+ 이미지 데이터 URL, *필수 입력
                reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
                transparent: true, //+ layer 투명화 여부
            },
            emapsat: {
                name: 'emapsat',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
                url: layerInfo.image.emapsaturl, //+ 레이어 url, defaultValue(opt.url, 'http://210.117.198.120:8081/o2map/services');
                reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
                useProxy: true, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
                xyorder: "xy" //+ Col Row 순서, defaultValue(opt.xyorder, 'xy');
            },
            emapbase: {
                name: 'emapbase', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
                url: layerInfo.image.emapbaseurl, //+ 레이어 url, defaultValue(opt.url, 'http://mapapi.ngii.go.kr:8013/openapi/Gettile.do');
                reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
                useProxy: true, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
                xyorder: "xy", //+ Col Row 순서, defaultValue(opt.xyorder, 'xy');
            },

            //+ 고도////////////////////////////////////////////////////////
            korea_terrain: {
                name: 'korea_terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
                ext: '.umf', //+ 파일 확장자, *필수 입력
                reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
                minlevel: 9,  //+ 가시화 최소 레벨
                maxlevel: 17, //+ 가시화 최대 레벨
                useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            },

            //+ 건물 ///////////////////////////////////////////////////////
            _25d: {
                name: '_25d', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                layername: layerInfo.wfs_korea.layername, //+ 레이어 이름, *필수 입력
                baseurl: layerInfo.wfs_korea.baseurl, //+ baseurl 지도 서비스 기본 URL, *필수 입력
                //층수필드나 높이필드를 선택하여 사용
                fieldfloor: layerInfo.wfs_korea.fieldfloor, //+ 층수 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
                fieldheightfloor: layerInfo.wfs_korea.fieldheightfloor,
                floorheight: layerInfo.wfs_korea.floorheight, //+ 층수 높이 필드
                fieldKind: layerInfo.wfs_korea.fieldKind,  //+ 종류 필드 (속성테이블 칼럼명), defaultValue(opt.fieldKind, undefined)
                transperent: false, //+ 투명화 여부
                minlevel: 17, //+ 가시화 최소레벨,defaultValue(opt.minlevel, 17)
                drawline: false, //+ WFS 모델에 테투리 추가 여부

        app.endloadingBar();

        //+ 고도
        createLayer('korea_terrain');
        app.showLayer('korea_terrain', true);

        //+ 건물
        createLayer('u3f');
        app.showLayer('u3f', true);

        initSlider('opacity');
        initSlider('m-opacity');
        initSlider('x-axis');
        initSlider('y-axis');
        initSlider('z-axis');

        $(document).on('click', 'input[type=checkbox]', checked);

        $(document).on('change', '#x-axis-number', function (e) {
            const id = "#x-axis";
            $(id).slider('value', this.value);
            const val = $(id).slider("value");
            $('#x-axis-handle').text(val.toFixed(2));
            app.setClippingAxisXByRatio(this.value);
        });

        $(document).on('change', '#y-axis-number', function (e) {
            const id = "#y-axis";
            $(id).slider('value', this.value);
            const val = $(id).slider("value");
            $('#y-axis-handle').text(val.toFixed(2));
            app.setClippingAxisYByRatio(this.value);
        });

        $(document).on('change', '#z-axis-number', function (e) {
            const id = "#z-axis";
            $(id).slider('value', this.value);
            const val = $(id).slider("value");
            $('#z-axis-handle').text(val.toFixed(2));
            app.setClippingAxisHeightByRatio(this.value);
        });

        function checked(e) {
            var $checkbox = $(e.target);
            var name = $checkbox.attr('target');
            //+ 영상 투명화 여부
            if (name === 'opacity_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableOpacityImageLayers(true)
                } else {
                    app.setEnableOpacityImageLayers(false)
                }

                return;
            }

            if (name === 'm_opacity_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableOpacityModelLayers(true)
                } else {
                    app.setEnableOpacityModelLayers(false)
                }

                return;
            }

            //+ 클리핑 여부
            if (name === 'clipping_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableClipping(true); //전역 클리핑 실행
                } else {
                    app.setEnableClipping(false); //전역 클리핑 종료
                    app.clearClippingAxis(); // 전역 클리핑 입력 값들 초기화
                    setDefaultSliderX();
                    setDefaultSliderY();
                    setDefaultSliderZ();
                }

                return;
            }
            if(!app.getLayerByName(name))
                createLayer(name);

            if ($checkbox[0].checked) {
                app.showLayer(name, true)
            } else {
                app.showLayer(name, false)
            }
        }

        function initSlider(type) {
            let id = '';
            let idhandle = '';
            let step = 0.01;
            let min = -1; // min value
            let max = 1 ;
            let value = 0;
            switch (type) {
                case  'opacity': {
                    id = '#opacity';
                    idhandle = '#opacity-handle';
                    min = 0;
                    value = 1;
                }
                    break;
                case  'm-opacity': {
                    id = '#m-opacity';
                    idhandle = '#m-opacity-handle';
                    min = 0;
                    value = 1;
                }
                    break;
                case 'x-axis': {
                    id = '#x-axis';
                    idhandle = '#x-axis-handle';
                    step = 0.000001;
                }
                    break;
                case 'y-axis': {
                    id = '#y-axis';
                    idhandle = '#y-axis-handle';
                    step = 0.000001;
                }
                    break;
                case 'z-axis': {
                    id = '#z-axis';
                    idhandle = '#z-axis-handle';
                    step = 0.000001;
                }
                    break;
            }

            var handle = $(idhandle);
            $(id).slider({
                orientation: "horizontal",
                range: "min",
                value: value,
                min: min, // min value
                max: max,
                step: step,
                create: function () {
                    var val = $(this).slider("value");
                    handle.text(val.toFixed(2));
                },
                slide: function (event, ui) {
                    handle.text(ui.value.toFixed(2));
                    switch (id) {
                        case  '#opacity': {
                            app.setOpacityImageLayers(ui.value);
                        }
                            break;
                        case  '#m-opacity': {
                            app.setOpacityModelLayers(ui.value);
                        }
                            break;
                        case '#x-axis': {
                            setDefaultSliderY();
                            setDefaultSliderZ();


                            $('#x-axis-number').val(ui.value)
                            //X축 클리핑 비율 값 적용 => setEnableClipping(true) 일때 출력
                            app.setClippingAxisXByRatio(ui.value);
                        }
                            break;
                        case '#y-axis': {
                            setDefaultSliderX();
                            setDefaultSliderZ();

                            $('#y-axis-number').val(ui.value)
                            //Y축 클리핑 비율 값 적용 => setEnableClipping(true) 일때 출력
                            app.setClippingAxisYByRatio(ui.value);
                        }
                            break;
                        case '#z-axis': {
                            setDefaultSliderX();
                            setDefaultSliderY();

                            $('#z-axis-number').val(ui.value)
                            //Z축 클리핑 비율 값 적용 => setEnableClipping(true) 일때 출력
                            app.setClippingAxisHeightByRatio(ui.value);
                        }
                    }

                },
                change: function (event, ui) {
                }
            });
        }

        function setDefaultSliderX(){
            $('#x-axis-number').val(0);
            $('#x-axis').slider('value', 0);
            $('#x-axis-handle').text('0.00');
        }

        function setDefaultSliderY(){
            $('#y-axis-number').val(0);
            $('#y-axis').slider('value', 0);
            $('#y-axis-handle').text('0.00');
        }

        function setDefaultSliderZ(){
            $('#z-axis-number').val(0);
            $('#z-axis').slider('value', 0);
            $('#z-axis-handle').text('0.00');
        }

        function createLayer(name) {
            var layer = layers[name];
            if (layer === undefined) {
                //레이어 생성 및 APP에 레이어 추가
                var options = LAYER_OPT[name];
                switch (name) {
                    //+ 건물 //////////////////////////////////////////
                    case 'u3f':
                        initModelLayers();
                        break;
                    case '_25d':
                        layer = new Union3D.model.U3dModelWFSLayer(options);
                        app.addLayer(layer);
                        break;

                    //+ 고도 /////////////////////////////////////////////
                    case 'korea_terrain':
                        layer = new Union3D.terrain.U3dHeightXYZLayer(options);
                        app.addLayer(layer);
                        break;

                    //+ 이미지 //////////////////////////////////////////
                    case 'emapbase':
                        layer = app.createEmapBaseLayer(options);
                        break;
                    case 'emapsat':
                        layer = app.createEmapSatLayer(options);
                        break;
                    default:
                        layer = new Union3D.image.U3dImageXYZLayer(options);
                        app.addLayer(layer);
                        break;

                }

                layers[name] = layer;
            }
        }

        function initModelLayers() {
            try {
                const modelayers = app.createModelGroupLayer({
                    maxlevel: 19,
                    minlevel: 17,
                    name: 'u3f'
                });
                /* request U3f layers list */
                $.ajax({
                    url: modelU3fURL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let infos = result.params.data;
                    for (let i = 0; i < infos.length; i++) {
                        let info = infos[i];
                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (info.state === "ACTIVE") {
                            let baseName = info.fileName;
                            if(!baseName || baseName ==='')
                                baseName = info.name;
                            let options = {
                                name: info.name,
                                basename: baseName,
                                baseurl: info.baseUrl,
                                useproxy: false,
                                minlevel: info.metaData.minLevel,
                                maxlevel: info.metaData.maxLevel,
                                compressmodel: true,
                                isShareMaterial: false,
                                makeU3FPackage: 1
                            };
                            let subLayer = app.create3DFModelLayer(options);
                            if(subLayer !== false){
                                subLayer.then(function (layer) {
                                    modelayers.addLayer(subLayer);
                                    if(i === infos.length -1){
                                        console.log("u3f model layer load");
                                        app.showLayer(modelayers.getName(),true);
                                    }
                                }).fail(function (layer) {

                                });
                            }
                        }
                    }
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }
    });
</script>
