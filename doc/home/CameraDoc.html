<div class="content">
    <div class="explane1" >
        Camera는 3D 공간을 바라보는 시점으로, <accent>화면에 어떤 영역을 렌더링할지 결정</accent>하는 객체입니다. <br><br>

        Camera는 <accent>Frustum(가시 영역)이라는 절두체 형태의 공간을 가지며</accent>, 이 Frustum 내부에 포함된 객체만 화면에 렌더링됩니다.<br><br>

        <strong>Frustum은 다음 요소로 구성됩니다.</strong> <br>
        - FOV(Field of View) : 카메라가 한 번에 바라보는 시야각 <br>
        - Near : 렌더링이 시작되는 최소 거리 <br>
        - Far : 렌더링이 종료되는 최대 거리
    </div>
