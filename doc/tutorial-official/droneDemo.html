<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function () {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function () {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function () {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function () {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    //컴포넌트로 사용할 모델 정보 생성
    const MODEL_INFO = {
        name: 'airplane',
        baseurl: layerInfo.model.airplaneurl, //모델을 요청할 url
        fileName: layerInfo.model.airplanename,
        ext: layerInfo.model.airplaneext
    }

    //라이센스 인증
    Union3D.ready(function () {

        //+ 비행기 갯수
        const planeCount = 99;
        //+ 비행기 생성 텀
        const intervalCreatePlane = 1500;

        //+ 좌표 리스트
        const listPoi = {};
        listPoi['청라'] = {x: 126.6224174, y: 37.5563786, z: 16};
        listPoi['송도'] = {x: 126.6543563, y: 37.3813632, z: 16};
        listPoi['서울'] = {x: 126.9721419, y: 37.5561066, z: 16};
        listPoi['부산'] = {x: 129.0360297, y: 35.1130499, z: 16};
        listPoi['광주'] = {x: 126.9070116, y: 35.1653472, z: 16};
        listPoi['대전'] = {x: 127.4320223, y: 36.3323303, z: 16};
        listPoi['제주'] = {x: 126.2486448, y: 33.4095068, z: 16};

        const movePosition = {};
        //+ 비행기 항로 설정
        for (let i = 1; i <= planeCount; i++) {
            const name = 'plane' + i.toString();
            createPosition(movePosition, name);
        }

        function createPosition(objects, name, count) {
            objects[name] = [];
            if (!defined(count))
                count = 10;

            var minx = listPoi['송도'].x < listPoi['청라'].x ? listPoi['송도'].x : listPoi['청라'].x;
            var miny = listPoi['송도'].y < listPoi['청라'].y ? listPoi['송도'].y : listPoi['청라'].y;
            var minz = 100;

            var maxx = listPoi['송도'].x > listPoi['청라'].x ? listPoi['송도'].x : listPoi['청라'].x;
            var maxy = listPoi['송도'].y > listPoi['청라'].y ? listPoi['송도'].y : listPoi['청라'].y;
            var maxz = 200;

            for (let i = 0; i < count; i++) {
                var x = 0, y = 0, z = 0;
                if (i === 0) {
                    x = listPoi['송도'].x;
                    y = listPoi['송도'].y;
                    z = 50;
                } else {
                    x = getRandom_(minx, maxx);
                    y = getRandom_(miny, maxy);
                    z = getRandom_(minz, maxz);
                }

                if (!defined(objects[name])) objects[name] = [];

                objects[name].push({x: x, y: y, z: z});
            }
        }

        const serverURL = 'https://3d.geon.kr/';
        const dataServerUrl = 'https://dt-data.mappick.co.kr/ServiceData/';
        const API_KEY = 'YKAFjxVvNJEA/S1xcEjprW49M6wQSAva3PC7u3KHJxrZ3ZaTVfN40QdiqzAYrFf5';
        const app = new Union3D.U3dAPP({
            containername: 'map',
        });

        window.app = app;
        let componentMap = {};
        app.setZoomSpeed(1);
        app.setRotateSpeed(0.5);
        app.setHomePosition(listPoi['송도'].x, listPoi['송도'].y, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();
        app.createloadingBar('load');
        app.on('change', updatePosData);

        //+ 이미지 레이어 생성 /////////////////////////////////////////////////////////////////////
        const satlayer = new Union3D.image.U3dImageXYZLayer({
            name: 'satellite',
            baseurl: layerInfo.image.vworldsaturl,
            reverseY: true
        });
        app.addLayer(satlayer);
        app.showLayer('satellite', true);

        //APP에 기본 배경이미지 레이어를 설정
        app.setNameBaseLayer('satellite');
        app.endloadingBar();

        //+ hybrid 레이어 생성 ////////////////////////////////////////////////////////////////////
        const hydlayer = new Union3D.image.U3dImageXYZLayer({
            name: 'vworld-hybrid',
            baseurl: layerInfo.image.vworldhybirdurl,
            transparent: true,
            reverseY: true
        });
        app.addLayer(hydlayer);
        app.showLayer('vworld-hybrid', true);

        //+ 고도 레이어 생성 //////////////////////////////////////////////////////////////////////
        var terrainLayer = new Union3D.terrain.U3dHeightXYZLayer({
            name: 'Korea Terrain',
            baseurl: layerInfo.height.url,
            ext: '.umf',
            reverseY: true,
            minlevel: 9,
            maxlevel: 17,
            useproxy: false,
        });
        app.addLayer(terrainLayer);
        app.showLayer('Korea Terrain', true);

        //+ POI 레이어 생성 //////////////////////////////////////////////////////////////////////
        const keys = Object.keys(listPoi);
        for (let i = 0; i < keys.length; i++) {
            let key = keys[i];
            // 좌표 리스트의 위치마다 POI 추가
            addGeographicPOI(listPoi[key].x, listPoi[key].y, listPoi[key].z, key);
        }

        // 비행기 모델 /////////////////////////////////////////////////////////////////////////

        //레이어 생성 옵션
        const layerOption = {
            name: 'airplane',
            type: "model",
            color: 'rgb(255,255,255)',
            needxml: false,
            drawline: false,
            listmodel: [{   //모델 정보
                name: MODEL_INFO.name,
                baseurl: MODEL_INFO.baseurl, //모델을 요청할 url
                fileName: MODEL_INFO.fileName,
                ext: MODEL_INFO.ext
            }],
            drawpath: false,
        };

        //+ 컴포넌트 레이어 (애니메이션 레이어) //////////////////////////////////////////////////////////
        //모델 옵션을 가지고 레이어 생성
        window.animationLayer = app.createMultipleComponentLayer(layerOption);
        window.animationLayer.setInstanced(false);
        // 레이어가 생성 완료되면 비행기 컴포넌트를 일전 간격으로 생성
        animationLayer.then(function () {
            app.showLayer(animationLayer.getName(), true);

            // 모델이 제대로 불러와졌는지 검사
            const loadedModelInfo = animationLayer.getModelInfo(MODEL_INFO.name , MODEL_INFO.baseurl)
            if( loadedModelInfo ){
                loadedModelInfo.then(()=>{
                    const keys = Object.keys(movePosition);
                    for (let i = 0; i < keys.length; i++) {
                        const key = keys[i];
                        const x = movePosition[key].x;
                        const y = movePosition[key].y;
                        const height = movePosition[key].height;

                        createComponentThread(key, x, y, height, i * intervalCreatePlane);
                    }
                });
            }else {
                animationLayer.loadModel(MODEL_INFO).then(()=>{
                    const keys = Object.keys(movePosition);
                    for (let i = 0; i < keys.length; i++) {
                        const key = keys[i];
                        const x = movePosition[key].x;
                        const y = movePosition[key].y;
                        const height = movePosition[key].height;

                        createComponentThread(key, x, y, height, i * intervalCreatePlane);
                    }
                }).catch(()=>{
                    console.error("animationLayer fail to load model.");
                });
            }
            createWFS('2018지형도');
        });

        // time 간격으로 컴포넌트 생성
        function createComponentThread(name, x, y, height, time) {
            setTimeout(() => createComponent(name, x, y, height), time);
        }

        // 컴포넌트(비행기) 속도 조절
        $(".spinner.speed").spinner({min: 10, max: 50000, step: 50});
        $('.spinner.speed').on("spinstop", function (e) {
            const componentName = e.target.name;
            const component = animationLayer.getComponentByName(componentName);
            if (defined(component)) {
                component.setSpeed(Number(e.target.value));
            }
        });

        // 컴포넌트(비행기) 카메라뷰 가시화 체크
        $(document).on('click', 'input[name="camera"]', function (e) {
            showCameraView(e.target);
        });

        // 이동
        $(document).on('click', '.move', function (e) {
            const componentName = e.target.value;
            const component = animationLayer.getComponentByName(componentName);
            if (component !== undefined) {
                component.moveStart();
            }
        });

        // 정지
        $(document).on('click', '.stop', function (e) {
            const componentName = e.target.value;
            const component = animationLayer.getComponentByName(componentName);

            if (component !== undefined) {
                component.movePause();
            }
        });

        // 재시작
        $(document).on('click', '.restart', function (e) {
            const componentName = e.target.value;
            const component = animationLayer.getComponentByName(componentName);
            if (component !== undefined) {
                component.restart();
                componentMap[component.getName()].state = 'play';
            }
        });

        // 1인칭 전환
        $(document).on('click', '.front', function (e) {
            const componentName = e.target.value;
            const component = animationLayer.getComponentByName(componentName);
            if (component !== undefined) {
                const opt = {
                    component: component,
                    view: 'FrontView',
                    active: true,
                    offset: {x: 0, y: 400, z: -300},
                    targetOffset: undefined
                };
                animationLayer.setCameraTrace(opt);
            }
        });

        // 따라가기
        $(document).on('click', '.trace', function (e) {
            const componentName = e.target.value;
            const component = animationLayer.getComponentByName(componentName);
            if (component !== undefined) {
                const opt = {
                    component: component,
                    view: 'TopView',
                    active: true
                };
                animationLayer.setCameraTrace(opt);
            }
        });

        // 3인칭 전환
        $(document).on('click', '.mapMode', function () {
            changeMapMode();
        });

        // 지정 좌표 위치메 POI를 추가하는 함수
        function addGeographicPOI(geoX, geoY, inheight, labelname, labelsize, imageurl) {
            if (!defined(labelname)) labelname = 'POI';
            if (!defined(imageurl)) imageurl = dataServerUrl + 'poi_image/placemark64.png';
            if (!defined(labelsize)) labelsize = 15;

            // world좌표 기준으로 해당 위치에 POI 생성
            var worldxyz = app.getGeographicToWorld(geoX, geoY, inheight);
            var poi = new Union3D.geom.U3dPOI({
                position: {x: worldxyz.x, y: worldxyz.y, z: worldxyz.z},
                image: imageurl,
                label: labelname
            });
            app.addPOI(poi);
            poi.setLabelSize(labelsize);
        }

        // 컴포넌트(비행기) 생성
        function createComponent(componentName, geox, geoy) {
            if (!defined(geox)) geox = listPoi['송도'].x;
            if (!defined(geoy)) geoy = listPoi['송도'].y;

            let component = animationLayer.addPosition({
                name: componentName,                //컴포넌트 이름(ID)
                geoPosition: {x: geox, y: geoy, z: 0},     //최초 생성 좌표
                rotation: {x: 90, y: 180, z: 0},
                scale: {x: 0.03, y: 0.03, z: 0.03},  //컴포넌트 크기
                speed: 200,                          //이동 속도
                topviewdistance: 200,                          // 따라가기 모드(topView)시 높이 값
                movepointlist: movePosition[componentName]   // 앞서 지정한 movePosition으로 경로 지정
            });

            // 컴포넌트가 생성되었으면 수행
            if (defined(component)) {
                // 비행기 이름에 해당하는 POI 생성

                const lonlat = component.getPosition();
                const veiwName = component.getName();
                const veiwId = component.getName();

                //컴포넌트의 애니메이션(이동) 상태 저장
                componentMap[componentName] = {"component": component, "state": "play"};

                let componentNum = Object.keys(componentMap).length;
                // ~plane3 까지만 카메라뷰를 생성하기 위해 if구문을 사용
                if (componentNum < 5) {

                    //카메라뷰를 생성해 해당 컴포넌트에 setting
                    const overlay = createViewOverlay(veiwName, veiwId, lonlat);
                    component.setOverlay(overlay);

                    // 카메라뷰를 이중으로 생성하기 위해 plane1인 경우 plane1-2 오버레이를 생성
                    if (component.getName() === "plane1") {
                        const subOverlayName = veiwId + "-2";
                        componentMap[subOverlayName] = {"component": component, "state": "play"};
                        const overlay2 = createViewOverlay(veiwName, subOverlayName, lonlat);
                        component.setOverlay(overlay2);
                        overlay2.hide();
                    }
                    overlay.hide();
                }
            }
        }

        function createWFS(layerName) {
            if (app === undefined) return;

            if (app.getLayerByName(layerName)) {
                var layer = app.getLayerByName(layerName);
                layer.show(true);
                return
            }

            //+ WFS 모델 ///////////////////////////////////////////////////////////////////
            var wfsModel = new Union3D.model.U3dModelWFSLayer({
                name: layerName,
                layername: layerInfo.wfs_korea.layername, //+ 레이어 이름, *필수 입력
                // sldurl:  layerInfo.wfs_unionit.sldurl,
                baseurl: layerInfo.wfs_korea.baseurl, //+ baseurl 지도 서비스 기본 URL, *필수 입력
                //층수필드나 높이필드를 선택하여 사용
                //fieldheight: layerInfo.wfs_korea.fieldheight, //+ 높이 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
                fieldfloor: layerInfo.wfs_korea.fieldfloor, //+ 층수 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
                fieldheightfloor: layerInfo.wfs_korea.fieldheightfloor,
                floorheight: layerInfo.wfs_korea.floorheight, //+ 층수 높이 필드
                fieldKind: layerInfo.wfs_korea.fieldKind,  //+ 종류 필드 (속성테이블 칼럼명), defaultValue(opt.fieldKind, undefined)
                transperent: true, //+ 투명화 여부
                minlevel: 17, //+ 가시화 최소레벨,defaultValue(opt.minlevel, 17)
                drawline: false, //+ WFS 모델에 테투리 추가 여부
                opacity: 0.8, //+ 투명화 여부 true 일 경우, 투명도 설정값으로 적용
                textureurl: '/image/buld/buld_texture_1.jpg',  //+ 텍스처 url, defaultValue(opt.textureurl, undefined)
            });

            app.addLayer(wfsModel);
            app.showLayer(layerName, true);
        }

        // 3인칭 모드로 카메라 시점 변경
        function changeMapMode() {
            const components = animationLayer.getComponents();
            for (let i = 0; i < components.length; i++) {
                let component = components[i];

                //현재 시점이 1인칭 또는 따라가기 모드라면 -> 3인칭 전환
                if (component.isTrace) {
                    component.setCameraTrace(false);
                    let position = component.position.clone();

                    // setCameraWorldPosition : 카메라 위치 / setCameraWorldTargetPosition : 카메라가 비추는 위치
                    // 카메라 위치는 z값을 1000으로 주고 타겟 위치는 0으로 줘서 카메라가 바닥을 향하게 설정
                    app.setCameraWorldPosition({x: position.x, y: position.y, z: position.z + 1000 ,rotateX: 0, rotateY: 0 });
                }
            }
        }

        // 카메라뷰 생성
        function createViewOverlay(name, id, position) {
            const shiftVal = {x: -1, y: 19, z: 5};
            const html = printViewOverlayHtml(id, shiftVal);
            const view = new Union3D.view.U3dView({
                name: name,
                id: id,
                element: $(html),
                position: position,
                endposition: position,
                useAnchor: true,
                useline: true,
                balloon: {x: -50, y: 10},
                useHelperObj: false,
                useLabel: false
            });

            //app._viewList에 생성한 카메라뷰를 등록한다
            app.addView(view);

            //초기 shiftVal을 setting해 Z_GAP만큼 높이를 준다.
            view.setShift(shiftVal);

            let element = view.getElement();
            let $element = $(element);
            $element.on('click', '.close', popUpCloseClick.bind(this, view));
            $element.on('click', '#left', cameraControlClick.bind(this, view));
            $element.on('click', '#right', cameraControlClick.bind(this, view));
            $element.on('click', '#up', cameraControlClick.bind(this, view));
            $element.on('click', '#down', cameraControlClick.bind(this, view));
            $element.on('click', '#init', cameraControlClick.bind(this, view));
            $element.on('click', '#helper', cameraControlClick.bind(this, view));
            $element.on('click', '#bind', cameraControlClick.bind(this, view));
            $element.on('click', '#move', cameraControlClick.bind(this, view));
            $element.on('click', '#btn-tab', cameraControlClick.bind(this, view));
            $element.on('change', '.input-axis-value', setShiftValue.bind(this, view));

            updateBinding(view, true);
            return view;
        }

        // 카메라뷰 가시화
        function showCameraView(target) {
            const componentName = target.value;
            const component = animationLayer.getComponentByName(componentName);

            if (!defined(component)) return

            if (component.hasOverlay()) {
                const views = component.getOverlay();
                if (target.checked)
                    views.forEach((view) => view.show());
                else
                    views.forEach((view) => view.hide());
            }
        }

        // 카메라뷰 elemenet 생성
        function printViewOverlayHtml(id, shiftVal) {
            let str = '';
            str += '<div class="u3-popup" id=' + id + '>';
            str += '<span class="glyphicon glyphicon-triangle-right flag" aria-hidden="true" id="btn-tab"> </span>';
            str += '<div class="u3-popup-content">';
            str += '<div class="modal-header">';
            str += '<div style="display: block">';
            str += '<label style="margin-right: 5px">' + id + '</label>';
            str += '<button type="button" class="close"><span aria-hidden="true">&times;</span></button>';
            str += '</div>';
            str += '<button type="button" class="glyphicon glyphicon-arrow-left" id="left" />';
            str += '<button type="button" class="glyphicon glyphicon-arrow-right" id="right" />';
            str += '<button type="button" class="glyphicon glyphicon-arrow-up" id="up" />';
            str += '<button type="button" class="glyphicon glyphicon-arrow-down" id="down" />';
            str += '<button type="button" class="glyphicon glyphicon-repeat" id="init" />';
            str += '<label style="margin-left:5px"> <input type="checkbox" id="helper"/>가시선 </label>';
            str += '<label> <input type="checkbox" id="bind" checked/>연결</label>';
            str += '</div>';
            str += '</div>';
            str += '<div id="letf-tab" style="display: none">';
            str += '<div class="input-group">';
            str += '<span style="margin-right: 5px"> X축 : </span>';
            str += '<input type="number" class="input-axis-value" id="' + id + '-x-axis" value="' + shiftVal.x + '">';
            str += '</div>';
            str += '<div class="input-group">';
            str += '<span style="margin-right: 5px"> Y축 : </span>';
            str += '<input type="number" class="input-axis-value" id="' + id + '-y-axis" value="' + shiftVal.y + '">';
            str += '</div>';
            str += '<div class="input-group">';
            str += '<span style="margin-right: 5px"> Z축 : </span>';
            str += '<input type="number" class="input-axis-value" id="' + id + '-z-axis" value="' + shiftVal.z + '">';
            str += '</div>';
            str += '</div>';
            str += '</div>';
            return str;
        }

        // 오버레이 'X'버튼 클릭 이벤트
        function popUpCloseClick(view) {
            $(view.element).off('click', '.close', popUpCloseClick);

            clearOverlayList(view);
            //app에 등록된 ViewList에서 view 삭제
            app.removeView(view);
        }

        // 컴포넌트가 가지고 있는 카메라뷰 삭제
        function clearOverlayList(view) {
            let components = animationLayer.getPositionList();

            for (let i = 0; i < components.length; i++) {
                if (!components[i].hasOverlay()) return

                let views = components[i].getOverlay();
                for (let i = 0; i < views.length; i++) {
                    if (views[i].getId() === view.getId())
                        views.splice(i--, 1);
                }
            }
        }

        const DIST = 10; //카메라 회전률
        function cameraControlClick(view, e) {
            let val = undefined;
            let checked = undefined;
            const id = $(e.target).attr('id');
            switch (id) {
                case 'left':
                    val = view.getRotationLeft();
                    view.setRotationLeft(val + DIST);
                    break;
                case 'right':
                    val = view.getRotationLeft();
                    view.setRotationLeft(val - DIST);
                    break;
                case 'up':
                    val = view.getRotationUp();
                    view.setRotationUp(val + DIST);
                    break;
                case 'down':
                    val = view.getRotationUp();
                    view.setRotationUp(val - DIST);
                    break;
                case 'init':
                    view.resetRotation();
                    break;
                case 'helper':
                    checked = $(e.target).prop('checked');
                    view.showHelper(checked);
                    break;
                case 'bind':
                    checked = $(e.target).prop('checked');
                    updateBinding(view, checked)
                    break;
                case 'btn-tab':
                    openLeftTab(e);
                    break;
            }
        }

        // 카메라 이동값 (shiftVal) 세팅
        function setShiftValue(view) {
            let AUTO_UPDATE;
            const viewId = view.getId();
            const shiftVal = {
                x: $("#" + viewId + "-x-axis").val() * 1,
                y: $("#" + viewId + "-y-axis").val() * 1,
                z: $("#" + viewId + "-z-axis").val() * 1
            };
            view.setShift(shiftVal);

            let viewName = view.getName();
            const component = animationLayer.getComponentByName(viewName);
            // 드론이 정지 상태인 경우 카메라뷰 수동 업데이트
            // 정지 상태가 아닌 경우 애니메이션이 동작하면서 shiftVal 자동으로 반영된다
            AUTO_UPDATE = false;
            view.moveViewPosition(component.getVectorPosition(), AUTO_UPDATE);
            if (view.isBind)
                updateViewPositionToCam.call(this, view);
        }

        // left tab 이벤트
        function openLeftTab(e) {
            let $tab = $(e.target).next().next();
            if ($(e.target).hasClass('flag')) {
                $(e.target).removeClass('flag')
                $(e.target).removeClass('glyphicon-triangle-right')
                $(e.target).addClass('glyphicon-triangle-left')
                $(e.target).css('right', '-190px');
                $tab.css("display", "block");
            } else {
                $(e.target).addClass('flag')
                $(e.target).removeClass('glyphicon-triangle-left')
                $(e.target).addClass('glyphicon-triangle-right')
                $(e.target).css('right', '-30px');
                $tab.css("display", "none");
            }
        }

        // 드론과 카메라 연결제어 (Binding)
        function updateBinding(view, checked) {
            const veiwId = view.getId();
            const $view = $('#' + veiwId);

            //카메라뷰의 바인드 여부를 업데이트
            view.setIsBind(checked);

            if (checked) {
                //드론이 정지상태면 수동으로 오버레이를 카메라 위치로 이동
                if (componentMap[view.getId()].state === 'stop')
                    updateViewPositionToCam(view);

                view.setDraggable(false);
                view.manualUpdate(view.getEndposition()); // 오버레이 원위치
            } else {
                view.initViewLine(); // 오버레이 라인메쉬를 초기화
                view.setDraggable(true);
            }
            //작업이 완료되면 오버레이의 앵커 업데이트
            view.updateAnchor();
        }

        // 카메라 위치로 Overlay 이동
        function updateViewPositionToCam(view) {
            const vec3 = view.getCameraPosition();
            const latlon = app.vector3ToGeoGraphic(vec3);

            view.manualUpdate(latlon, vec3);
        }

        // undefined 여부를 체크하는 함수
        function defined(value) {
            return value !== undefined && value !== null;
        }

        // 난수를 반환하는 함수
        function getRandom_(min, max) {
            return Math.random() * (max - min) + min;
        }

    });
</script>
<script>
    function onlyNumber() {
        if ((event.keyCode < 48) || (event.keyCode > 57))
            event.returnValue = false;
    }
</script>
</body>
</html>
