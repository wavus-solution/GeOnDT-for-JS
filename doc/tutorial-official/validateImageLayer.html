<script id="ui-event">
    const homePositon = {lat: 126.9395, lon : 37.52, height : 450, left : 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x : homePositon.lat, y : homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function(){
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            }
            else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer =function(Union3D, app, opt){
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create =function(){
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer( this.options);
        }
        else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer( this.options);
        }
        else {
            self.layer = new self._union3d.image.U3dImageXYZLayer( this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(()=>{
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow?"시작":"종료"));
        this._app.showLayer(this.options.name, isShow).then(()=>{
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function(Union3D, app, opt){
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create =function(){
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(()=>{
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow?"시작":"종료"));
        this._app.showLayer(this.options.name, isShow).then(()=>{
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

<script>
        let ol = null;

    //+ create 2D Image Layer
    function create2DImageLayer(opt) {
        if (window.olMap == null || window.olMap == undefined) {
            console.info('ol map is not intialized!');
            return;
        }

        var imageLayer = undefined;
        var proxyurl = (window.location.hostname !== 'localhost') ? './proxy.jsp?url=' : '';

        assert(defined(opt.name), '[name]param is null!');
        assert(defined(opt.baseUrl), '[baseurl]param is null!');

        var meta = opt.metaData;
        assert(defined(meta), '[metadata]param is null!');
        assert(defined(meta.srs), '[srs]param is null!');
        assert(defined(meta.tileFormat), '[tileFormat]param is null!');
        assert(defined(meta.boundingBox), '[boundingBox]param is null!');
        assert(defined(meta.profile), '[profile]param is null!');

        opt.boundingbox = {};
        opt.boundingbox.minx = meta.boundingBox.minx;
        opt.boundingbox.miny = meta.boundingBox.miny;
        opt.boundingbox.maxx = meta.boundingBox.maxx;
        opt.boundingbox.maxy = meta.boundingBox.maxy;

        var srs = meta.srs.toUpperCase();
        var baseurl = opt.baseUrl;
        var ext = meta.tileFormat.ext;

        var profile = meta.profile;
        opt.profile = profile;
        if(profile == 'mercator'){
            var proj3857 = ol.proj.get('EPSG:3857');
            var proj4326 = ol.proj.get('EPSG:4326');
            var minxy = ol.proj.transform([opt.boundingbox.minx, opt.boundingbox.miny], proj4326, proj3857);
            var maxxy = ol.proj.transform([opt.boundingbox.maxx, opt.boundingbox.maxy], proj4326, proj3857);

            let minZoom = 14;
            let extent = [minxy[0], minxy[1], maxxy[0], maxxy[1]];

            let xyzSource =new ol.source.XYZ({
                url: proxyurl + baseurl + '/{z}/{x}/{-y}' + "." + meta.tileFormat.ext,
                minZoom: minZoom
            });

            imageLayer = new ol.layer.Tile({opacity: 1, source: xyzSource, extent: extent});
        }
        else {
            ol.proj.setProj4(proj4);
            proj4.defs(
                srs,
                meta.proj.proj
            );

            var maxZoom = parseInt(meta.raster.maxlevel);
            var tileSize = meta.tileFormat.width;
            var matrixIds = [];
            var resolutions = [];
            for (var i = 0; i <= maxZoom - 1; i++) {
                matrixIds[i] = i;
                resolutions[i] = meta.raster.maxresolution / Math.pow(2, i);
            }
            var box = meta.boundingBox;
            var extent = [box.minx, box.miny, box.maxx, box.maxy];
            var tileGrid = new ol.tilegrid.TileGrid({
                extent: extent,
                origin: [meta.origin.x, meta.origin.y],
                resolutions: resolutions,
                matrixIds: matrixIds,
                maxZoom: 1
            });

            var xyzSource = new ol.source.XYZ({
                url: baseurl + '/{z}/{x}/{y}' + "." + meta.tileFormat.ext,
                projection: srs,
                tileGrid: tileGrid,
                tileSize: [tileSize, tileSize]
            });

            function setTileUrlFunc(urlTileCoord, pixelRatio, projection) {
                var extent = this.tileGrid.getTileCoordExtent(urlTileCoord);
                var left = extent[0];
                var top = extent[1];
                var right = extent[2];
                var bottom = extent[3];
                var tilesize = this.tileGrid.getTileSize();
                var origin = this.tileGrid.getOrigin();
                var resolutions = this.getResolutions();
                var res = resolutions[urlTileCoord[0]];

                var x = Math.round((left - origin[0]) / (res * tilesize));
                var y = Math.round((bottom - origin[1]) / (res * tilesize));
                urlTileCoord[1] = x;
                urlTileCoord[2] = y - 1;
                var url = proxyurl + baseurl + '/' + urlTileCoord[0] + '/' + urlTileCoord[1] + '/' + urlTileCoord[2] + "." + ext;
                return url;
            }

            xyzSource.setTileUrlFunction(setTileUrlFunc);

            imageLayer = new ol.layer.Tile({
                opacity: 1,
                source: xyzSource
            });
        }

        window.olMap.addLayer(imageLayer);
    }

    function moveLayer(layerName) {
        var layer = app.getLayerByName(layerName);
        if (!defined(layer)) {
            let layerInfo = window.metalayers[layerName];
            if(!defined(layerInfo)){
                return;
            }
            layer = initImageLayers(layerInfo);
        }
        var bbox = layer.getBoundingBox();
        if (bbox.max.x == Infinity || bbox.max.x == -Infinity || bbox.min.x == Infinity || bbox.min.x == -Infinity) {
            alert("[" + layerName + "]" + "에 영역정보가 잘못되었습니다!");
            return;
        }

        var center = layer.getCenter();
        if (defined(app)) //+ 3d
            app.setCameraWorldPosition({x: center.x, y: center.y, z: bbox.max.z + 200, rotateX: 2, rotateY: 30});

        if(defined(olMap)){
            olMap.getView().setCenter([center.x, center.y]);
        }
    }

    function addSelectOption(componentName) {
        var $select = $('.layer-list').find("select[name=name]");
        $select.append("<option value=" + componentName + ">" + componentName + "</option>");
    }

    function removeSelectOption(componentName) {
        var $select = $('.layer-list').find("select[name=name]");
        $select.find("option[value=" + componentName + "]").remove();
    }
