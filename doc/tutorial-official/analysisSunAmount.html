<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "200px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>

                if (poiList.length !== 0) {
                    //각 시간별 그림자 유무 체크
                    poiList.forEach(function (poi) {
                        let isShadow = app.isShadowAtTime(new Date(date + ' ' + time), poi.getPosition());
                        console.log('대상 : ' + poi.label + ' ( 시간 :' + date + ' ' + time + " / 일조유무: " + !isShadow + " )");
                    })
                }
                getCurrentTime();
            }
        });
        //일출,일몰시간
        $('#sunraise,#sunset').on('click', function (e) {
            let date = $('input[type=date]').val();
            let time = $(this).find('samp').text();
            app.setTimeSun(new Date(date + ' ' + time));
            let cur = getCurrentTime();
            $('#time-slider').slider('value', cur.getHours() * 60 + cur.getMinutes());
            handle.text(cur.format('HH:mm'));
        });
        //일조량 분석

        // analy.setUserStyle({
        //     0 :  {min: 0, max: 200, color: "#ff0000"},
        //     200 : {min: 200, max: 400, color: "#ff8000"},
        //     400 : {min: 400, max: 600, color: "#ffbf00"},
        //     600 : {min: 600, max: Infinity, color: "#fff700"},
        // });

        $('#analy-amount').on('click', function (e) {
            let startDateStr = $(this).closest('.form-inline').find('input[type=date]').val();
            let startTimeStr = $(this).closest('.form-inline').find('#min-start').val();
            let start = getDateFromString(startDateStr, startTimeStr);

            let endTimeStr = $(this).closest('.form-inline').find('#min-end').val();
            let end = getDateFromString(startDateStr, endTimeStr);

            $('#result').empty()
            app.loadingBar();
            let promises = [];
            let promise, result;
            poiList.forEach(function (poi) {
                promise = GeOnDT.UDEF.createPromise(function (resolve) {
                    result = app.analySunAmount(start, end, poi.getPosition(), 1, {
                        name :  poi.label,
                        isDraw : true, // 분석 mesh 큐브를 그릴지 여부
                        type: "color", // color, cube
                        boxNum : 100,
                        styleFun : styleFun
                    })
                    printAmount(poi, result)
                    resolve()
                })
                promises.push(promise);
            });
            Promise.all(promises).then(function () {
                console.log('분석 종료');
                app.endloadingBar();
            })
        });

        function styleFun ( cubeMesh, sunAmount, type) {
            if(type === "cube") {
                if(sunAmount > 600) {
                    return '#ff0000';
                } else if (sunAmount <= 600 && sunAmount > 400) {
                    return '#ff8000';
                } else if (sunAmount <= 400 && sunAmount > 200) {
                    return '#ffbf00';
                } else {
                    return '#fff700';
                }
            }
        }

        let clickKey;
        $('input[name="mode"]').on('click', function () {
            let mode = this.value;
            if (mode === 'map') {
                draw.deactive();
                app.unkey('click', clickKey);
            } else if (mode === 'target') {
                draw.deactive();
                clickKey = app.on('click', addTarget);
            } else if (mode === 'area') {
                app.unkey('click', clickKey);
                draw.clear();
                removePOI();
                draw.active();
            }
        })
        $('#analy-amount-clear').on('click',function (){
            app.endAnalySunAmount(); // 분석 종류 후 해당 함수를 사용해야 그려진 분석 메시가 지워진다.
            removePOI();
            $('#result').text('');
            let features = draw.getFeatures();
            if(features && features.length > 0 )
                features.forEach(feature =>{
                    draw.removeFeature(feature);
                })
            draw.deactive();
        })

        let poiCount = 0;

        function addTarget(e) {
            let world = app.closestPointAtPixel(e); //클릭한 지점의 3D 좌표
            if (poiList !== undefined) {
                let poi = new GeOnDT.geom.U3dPOI({
                    position: world,
                    image: 'image/marker.png',
                    label: '분석지점 ' + poiCount++ + '번',
                    depthTest : false
                });
                app.addPOI(poi);
                poiList.push(poi);
            }
        }

        let draw = new GeOnDT.UDraw();
        draw.setApp(app);
        draw.setGeometryType('Polygon');
        draw.on('end', function (e) {
            let drawFeature = e.data;
            let geom = drawFeature.getGeometry();
            let coords = geom.getCoordinates()[0];

            draw.clear();
            draw.deactive();
            $('.btn-draw').removeClass('active');

            if (coords.length > 2) {
                let points = getGridPoints(drawFeature.getGeometry());
                for (let i = 0; i < points.length; i++) {
                    let poi = new GeOnDT.geom.U3dPOI({
                        position: points[i],
                        image: 'image/marker.png',
                        label: "영역 분석 " +  poiCount++ + "번"
                    });
                    app.addPOI(poi);
                    poiList.push(poi);
                }
                $('#analy-amount').trigger('click');
            } else {
                alert('선택 지점이 3 이상이여야 합니다.');
                draw.removeFeature(drawFeature);
            }
            $('input[value="map"]').prop('checked', true);
        })

        function getGridPoints(geometry) {
            let nx = 10, ny = 10;
            let box = geometry.getExtent();
            let minX = box[0], maxY = box[3];
            let dx = (box[2] - box[0]) / nx;
            let dy = (box[3] - box[1]) / ny;

            let result = [];
            for (let j = 0; j < ny; j++) {
                for (let i = 0; i < nx; i++) {
                    let x = minX + dx * i;
                    let y = maxY - dy * j;
                    if (geometry.containsXY(x, y)) {
                        let vec3 = app.geographicToVector3({x: x, y: y, z: 0});
                        vec3.z = app.getRenderHeightAtPoint(vec3); //렌더링시 높이값
                        result.push(vec3);
                    }
                }
            }
            return result;
        }

        function removePOI() {
            if (poiList && poiList.length > 0) {
                poiList.forEach(function (poi) {
                    if (poi) {
                        app.removePOI(poi);
                    }
                })
                poiList = [];
            }
        }

        function minuteToString(ms) {
            let h = Math.floor(ms / 60);
            let m = ms - (h * 60);
            return pad(h, 2) + ':' + pad(m, 2);
        }

        function pad(n, width) {
            n = n + '';
            return n.length >= width ? n : new Array(width - n.length + 1).join('0') + n;
        }

        function getCurrentTime() {
            let curTime = app.getTimeSun();
            printTime(curTime);
            return curTime;
        }

        function printTime(date) {
            if (date === undefined) return;
            $('#current-time').html(date.format('yyyy-MM-dd a/p hh:mm:ss'));
        }

        function printAmount(poi, result) {
            let name = poi.label;
            let id = poi.uuid;
            let divId =  name+'_'+id;
            divId = divId.replaceAll(' ','')
            let str = '<div id ='+divId+'>' +
                '<div><strong>분석지점 : ' + name + '</strong></div>';
            let totalAmount = 0;

            for (let i = 0; i < result.length; i++) {
                let data = result[i];
                let start = data.start.format('yyyy-MM-dd a/p hh:mm:ss')
                let end = data.end.format('yyyy-MM-dd a/p hh:mm:ss')
                str += '<div>'
                str += '<div>' + (i + 1) + '. 일조시작 시간: ' + start + '</div>';
                str += '<div>' + (i + 1) + '. 그림자가 드는 시간: ' + end + '</div>';
                str += '<div>' + (i + 1) + '. 일조량: ' + data.amount + '분</div>';
                str += '</div>';
                str += '<br>';
                totalAmount += data.amount;
            }
            str += `<div><strong>총일조량 : ` + totalAmount + `분</strong> <button class="btn btn-xs" id = `+id+` style="float:right">삭제</button></div>`
            str += '<br/>'
            str += '<hr>';
            str += '</div>';
            $('#result').append(str);

            $(`#${id}`).on('click', function(){
                let poi = poiList.find(function(poi_){
                    return poi_.label === name
                })
                if(poi){
                    app.removePOI(poi);
                    app.removeAnalySunAmount(poi.label); // 일조량 분석 mesh 제거
                    draw.clear();
                    let idx_ = poiList.indexOf(poi);
                    poiList.splice(idx_, 1);
                }
                $(`#${divId}`).text('')
            })
        }

        function getDateFromString(dateString, timeString) {
            let year = Number(dateString.split('-')[0]);
            let month = Number(dateString.split('-')[1]);
            let day = Number(dateString.split('-')[2]);
            let hour = Number(timeString.split(':')[0]);
            let minute = Number(timeString.split(':')[1]);
            let date = new Date(year, pad(month - 1, 2), pad(day, 2));
            date.setHours(hour);
            date.setMinutes(minute);
            return date;
        }

        function initU3fModelLayers(name) {
            try {
                let groupLayer = app.createModelGroupLayer({
                    maxlevel: 19,
                    minlevel: 17,
                    name: name
                });
                /* request U3f layers list */
                $.ajax({
                    url: modelU3fURL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let infos = result.params.data;

                    for (let i = 0; i < infos.length; i++) {
                        let info = infos[i];
                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (info.state === "ACTIVE") {
                            let baseName = info.fileName;
                            if(!baseName || baseName ==='')
                                baseName = info.name;
                            let options = {
                                name: info.name,
                                basename: baseName,
                                baseurl: info.baseUrl,
                                useproxy: false,
                                minlevel: info.metaData.minLevel,
                                maxlevel: info.metaData.maxLevel,
                                compressmodel: true,
                                isShareMaterial: false,
                                makeU3FPackage: 1
                            };
                            let subLayer = app.create3DFModelLayer(options);
                            if(subLayer !== false){
                                subLayer.then(function (layer) {
                                    groupLayer.addLayer(subLayer);
                                    if(i === infos.length -1){
                                        console.log("u3f model layer load");
                                        app.showLayer(groupLayer.getName(),true);
                                    }
                                }).fail(function (layer) {

                                });
                            }
                        }
                    }
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }
    });
</script>
