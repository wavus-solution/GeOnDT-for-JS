<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "200px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.height).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

    //+ 라이센스 인증
    Union3D.ready(function () {

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        window.app = new Union3D.U3dAPP({
            containername: 'map'
        });

        app.on('change', updatePosData);
        app.createloadingBar('load');
        app.loadingBar();

        app.setHomePosition(129.155, 35.1596, 435, 0, 45); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();


        //이미지 레이어 생성
        let layers = new LayerList(Union3D, app);
        let initLayerList = ['satellite', 'korea_terrain']
        initLayar(initLayerList);

        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayar(list) {
            const basename = list[0];
            Union3D.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);

                            app.showLayer(name, true);
                            $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }

        for (var i = 0; i < sndBuildStyle.imgvisible.length; i++) {
            sndBuildStyle.imgvisible[i] = false;
        }
        //+ WFS 모델
        var wfsOption = {
            name: 'WFS Model', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            layername: layerInfo.wfs_korea.layername, //+ 레이어 이름, *필수 입력
            // sldurl:  layerInfo.wfs_unionit.sldurl,
            baseurl: layerInfo.wfs_korea.baseurl, //+ baseurl 지도 서비스 기본 URL, *필수 입력
            //층수필드나 높이필드를 선택하여 사용
            //fieldheight: layerInfo.wfs_korea.fieldheight, //+ 높이 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
            fieldfloor: layerInfo.wfs_korea.fieldfloor, //+ 층수 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
            fieldheightfloor: layerInfo.wfs_korea.fieldheightfloor,
            floorheight: layerInfo.wfs_korea.floorheight, //+ 층수 높이 필드
            fieldKind: layerInfo.wfs_korea.fieldKind,  //+ 종류 필드 (속성테이블 칼럼명), defaultValue(opt.fieldKind, undefined)
            transperent: true, //+ 투명화 여부
            minlevel: 17, //+ 가시화 최소레벨,defaultValue(opt.minlevel, 17)
            drawline: true, //+ WFS 모델에 테투리 추가 여부
            opacity: 1, //+ 투명화 여부 true 일 경우, 투명도 설정값으로 적용
            color: 0xB2CBD9, //미입력시 기본값 0xB2CBD9
            version: '1.0.0',
            //적용할 텍스쳐를 리스트 형태로 입력, 미적용시 입력x,
            //실제 적용은 styleFunction의 리턴값이 적용됩니다.
            textureurl: sndBuildStyle.imgurl,
            usedynamic: true,
            useproxy: (window.location.hostname !== 'localhost')
        };
        //적용할 스타일을 리턴해준다
        wfsOption.styleFunction = function (feature) {
            // 스타일 적용 우선순위 1.StyleFunction 2.SLD 3.기본값
            let properties = feature.properties;
            let code = properties['bdtyp_cd'];
            if (code === undefined || code == null)
                return;

            //code = code.replace('BDU', '');
            code = Number(code);
            code = (code % 30);
            let color;
            if (sndBuildStyle.isAllLegend) {
                color = sndBuildStyle.allLegend[code];
            } else {
                color = sndBuildStyle.legend[code];
            }
            return {
                color: color, //+ 색상
                opacity: sndBuildStyle.opacity, //+ 투명도
                visible: sndBuildStyle.visible[code], //+ 가시화 여부
                imgvisible: sndBuildStyle.imgvisible[code], //+ 이미지 가시화 여부
                imgurl: sndBuildStyle.imgurl[code] //+ 이미지 url
            };
        }

        var wfsModel = new Union3D.model.U3dModelWFSLayer(wfsOption);
        app.addLayer(wfsModel);
        app.showLayer('WFS Model', true);

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////// event 등록 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////
        let change = true;
        //+ [건물 외벽 바꾸기] 버튼 클릭시
        $('.btn-change').on('click', function () {
            for (let i = 0; i < sndBuildStyle.imgvisible.length; i++) {
                sndBuildStyle.imgvisible[i] = change; //+ 건물 외벽 바꾸기
            }
            change = !change;

            //+ wfsmodel style 새로고침
            wfsModel.updateStyle();
            app._drawArg.setModelUpdateDate();
        });

        //디버그용
        window.app = app;
    });
