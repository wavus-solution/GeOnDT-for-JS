<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    let filterMap = {};
    //+ 라이센스 인증
    Union3D.ready(function () {

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        var app = new Union3D.U3dAPP({
            containername: 'map', //+ U3dApp(지도영역)의 div ID, *필수 입력
            methodheight: '1_0'
        });
        app.setHomePosition(126.952, 37.578, 1500, 0, 45); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition(); //+ home position 수정
        app.createloadingBar('load');
        app.on('change', updatePosData);
        //app.createDebugCanvas('debug-unionmap-id');
        //이미지 레이어 생성
        var layer = undefined;
        var useEmap = false;
        if (useEmap) {
            createEmapSatLayer('base');
        } else {
            layer = new Union3D.image.U3dImageXYZLayer({
                name: 'base', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @r eturn {string}vworldsaturl
                baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
                    reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
                    // transparent: true //+ layer 투명화 여부
            });
            app.addLayer(layer);
            app.setNameBaseLayer('base');
            app.showImageLayer('base', true);
            // layer.then(() => {
            //     const hybridLayer = new Union3D.image.U3dImageXYZLayer({
            //         name: 'hybrid', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            //         baseurl: layerInfo.image.vworldhybirdurl, //+ 이미지 데이터 URL, *필수 입력
            //         reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
            //         transparent: true //+ layer 투명화 여부
            //     });
            //     app.addLayer(hybridLayer);
            //     app.showLayer('hybrid', true);
            // });
        }

        //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.

        app.endloadingBar();

        //+ 고도 ///////////////////////////////////////////////////////////////////////
        const terrainLayer = new Union3D.terrain.U3dHeightXYZLayer({
            name: 'Korea Terrain', //+ 레이어 이름,  defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf',  //+ 고도 데이터 파일 확장자
            reverseY: true,  //+ X축 반전 여부, defaultValue(opt.reverseY, false)
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 15,  //+ 가시화 최대 레벨
            useproxy: false,  //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            maxprocess: 2,  //+ process 최대값
            interpolationheight: false, //+ 고도보간 기능 사용 여부
            rectangle: Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        });

        app.addLayer(terrainLayer);
        app.showLayer('Korea Terrain', true);

        //+ WFS 모델 ///////////////////////////////////////////////////////////////////
        const wfsModel = new Union3D.model.U3dModelWFSLayer({
            name: 'WFS Model',
            layername: layerInfo.wfs_korea.layername,
            baseurl: layerInfo.wfs_korea.baseurl,
            fieldfloor: layerInfo.wfs_korea.fieldfloor,
            fieldheightfloor: layerInfo.wfs_korea.fieldheightfloor,
            floorheight: layerInfo.wfs_korea.floorheight,
            fieldlabel: layerInfo.wfs_korea.fieldlabel,
            transperent: true,
            minlevel: 17,
            drawline: false,
            opacity: 0.8,
            textureurl: './image/buld/buld_texture_1.jpg',
            useproxy: (window.location.hostname !== 'localhost')
        });

        app.addLayer(wfsModel);
        app.showLayer('WFS Model', true);

        //+ CLipping 분석 모드 시작
        let analy = app.getAnalysis('Clipping');
        //    analy.setType('theta');
        let draw = new Union3D.UDraw();
        draw.setApp(app);

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ////////////////////////////////////////// 이벤트 등록  /////////////////////////////////////////////////
        ////////////////////////////////////////////////////////////////////////////////////////////////////////

        draw.on('end', function (e) {
            //+ 마우스 더블클릭 이후에 작업
            //+ 좌표를 받아 overlay를 생성
            const geom = e.data.getGeometry();
            const coords = geom.getCoordinates()[0];
            if(e.target.geometryType === 'Polygon'){
                const maxminxy = getMaxMinWorld(coords);
                const point = coords[coords.length - 2];

                const overlay = createOverlay(e.data.getId(), {x: point[0], y: point[1]},'static');

                //+ 최대/최소 설정
                //+ [대괄호] 안에 수치는 범위에 중간값을 나타냅니다.
                //+ radio 버튼 선택 후 크기안에 범위에 해당되는 수치를 기입하고 확인 버튼을 클릭시 동작합니다.
                overlay.element.querySelector('#x-axis-minmax').textContent = 'X축:     ' + maxminxy.minx.toFixed(0) + ' ~ ' + maxminxy.maxx.toFixed(0) + ' [' + maxminxy.centerx.toFixed(0) + ']';
                overlay.element.querySelector('#y-axis-minmax').textContent = 'Y축:     ' + maxminxy.miny.toFixed(0) + ' ~ ' + maxminxy.maxy.toFixed(0) + ' [' + maxminxy.centery.toFixed(0) + ']';

            }else if(e.target.geometryType === 'LineString'){
                const overlay = createOverlay(e.data.getId(), {x: coords[0], y: coords[1]},'custom');
            }

            $('.btn-custom-draw').removeClass('active');
            $('.btn-draw').removeClass('active');
            draw.deactive();
        })


        //+ [그리기] 버튼
        //+ 이전 polygon 삭제
        //+ 타입 설정 => POLYGON
        $('.btn-draw').on('click', function () {
            toast('영역을 그리세요 (클릭 , 더블클릭)',4000);
            if(!analy._isActive) {
                analy.active();
            }

            //draw.clear();
            draw.setGeometryType('Polygon');
            draw.active();
            $(this).addClass('active');
        })

        $('.btn-custom-draw').on('click', function () {
            toast('라인을 그리세요 (클릭 , 더블클릭)',4000);
            if(!analy._isActive) {
                analy.active();
            }

            //draw.clear();
            draw.setGeometryType('LineString');
            draw.active();
            $(this).addClass('active');
        })

        let underGroundMode = false;
        $('.btn-underground').on('click', function () {
            underGroundMode = !underGroundMode;
            app.setUnderGroundMode(underGroundMode);
        });

        //+ overlay radio button event 등록

        $(document).on('click', '.u3-popup .overlay input[type="radio"]', function (e) {
            var $this = $(this);
            let $root = $(e.target).closest('.u3-popup');
            let $content = $root.find('#content');

            var type = $root.find('.overlay .type:checked').val();
            console.info($this + ' :' + type);

            if (type === "image") {
                //+ 영상 클리핑 시에는 크기 입력 불필요
                //+ 크기 입력란 비활성화
                $content.find('*').attr('disabled', true);

            } else if (type === "model") {
                //+ 건물 클리핑 시에는 크기 입력 필요
                //+ 크기 입력란 활성화
                $content.find('*').attr('disabled', false);

            } else
                throw new Error('type is invalid!');
        });


        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// function 선언 ////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        //+ 위경도 좌표를 world 좌표로 변환
        //+ minmax를 비교하여 결과값 반환
        function getMaxMinWorld(geos) {
            app.assert(Array.isArray(geos));
            var minx = 0, maxx = 0, miny = 0, maxy = 0;
            var init = true;
            for (var i = 0; i < geos.length; i++) {
                var latlon = geos[i];
                var point = app.getGeographicToWorld(latlon[0], latlon[1]);
                if (init) {
                    init = false;
                    minx = maxx = point.x;
                    miny = maxy = point.y;
                } else {
                    minx = minx > point.x ? point.x : minx;
                    miny = miny > point.y ? point.y : miny;
                    maxx = maxx < point.x ? point.x : maxx;
                    maxy = maxy < point.y ? point.y : maxy;
                }
            }

            return {
                minx: minx,
                maxx: maxx,
                miny: miny,
                maxy: maxy,
                centerx: (minx + maxx) * 0.5,
                centery: (miny + maxy) * 0.5
            };
        }

        //+ overlay 생성, 클리핑시 필요한 옵션 설정
        function createOverlay(id, latlon,type) {
            let html;
            if(type === 'static')
                html = printOverlayHtml(id);
            else{
                html = printCustomOverlayHtml(id);
            }
            const overlay = new Union3D.overlay.U3dOverlay({
                name: 'inputOverlay',
                element: html, //html
                position: latlon, //위경도 좌표
                autoAnchor: true //클릭지점에따라 앵커 자동변경
            });

            initOverlayEvent(overlay);
            app.addOverlay(overlay); //지도에 오버레이 추가
            overlay.show(); //오버레이 display block

            return overlay;
        }

        function printOverlayHtml(id) {
            let str = '';
            str += '<div class="u3-popup">';
            str += '<div class="form-group form-inline form-group-sm overlay">';
            str += '<label>'
            str += '<input class="type" type="radio" name="'+id+'_mode" value="image" checked/>영상'
            str += '</label>';
            str += '<label>'
            str += '<input class="type" type="radio" name="'+id+'_mode" value="model"/>건물'
            str += '</label>';
            str += '<div id="content">';
            str += '<label> <input type="radio" name="axis" value="height" disabled/>높이</label>';
            str += '<label> <input type="radio" name="axis" value="x" disabled/>X축</label>';
            str += '<label> <input type="radio" name="axis" value="y" disabled/>Y축</label>';
            str += '<div>';
            str += '<label>크기(m)</label>';
            str += '<input class="form-control input-sm input-size" type="number" value = 100 disabled>';
            str += '<div> <label id="x-axis-minmax">X축 최대/최소</label> </div>';
            str += '<div> <label id="y-axis-minmax">Y축 최대/최소</label> </div>';
            str += '</div>';
            str += '</div>';
            str += '<input class="fid" type="hidden" value="' + id + '"/>';
            str += '</div>';
            str += '<div class="btn btn-default btn-xs btn-submit" style="margin-right: 5px">확인</div>';
            str += '<div class="btn btn-default btn-xs btn-cancel">취소</div>';
            str += '</div>';

            return str;
        }

        function printCustomOverlayHtml(id) {
            let str = '';
            str += '<div class="u3-popup">';
            str += '<div class="form-group form-inline form-group-sm overlay">';
            str += '<label>'
            str += '<input class="type" type="radio" name="'+id+'_mode" value="model" disabled checked/>건물'
            str += '</label>';
            str += '<div id="content">';
            str += '<label> <input type="radio" name="axis" value="custom" disabled checked/>사용자 축</label>';
            str += '<div>';
            str += '<label>크기(m)</label>';
            str += '<input class="form-control input-sm input-size" type="number" value = 100>';
            str += '</div>';
            str += '</div>';
            str += '<input class="fid" type="hidden" value="' + id + '"/>';
            str += '</div>';
            str += '<div class="btn btn-default btn-xs btn-submit" style="margin-right: 5px">확인</div>';
            str += '<div class="btn btn-default btn-xs btn-cancel">취소</div>';
            str += '</div>';

            return str;
        }

        //오버레이 이벤트 등록
        function initOverlayEvent(overlay) {
            overlay.element.addEventListener('click', (e) => {
                // 확인 버튼
                if (e.target.closest('.btn-submit')) {
                    submit(e, overlay.id);
                }
                // 취소 버튼
                if (e.target.closest('.btn-cancel')) {
                    cancel(overlay.id);
                }
            });
        }

        //+ 오버레이 [확인] 버튼 클릭시 동작하는 Function
        function submit(e, overlayId) {
            let $root = $(e.target).closest('.u3-popup');
            let fid =  $root.find('.overlay .fid').val();
            let type =  $root.find('.overlay .type:checked').val();
            let size = $root.find('.input-size').val();
            size = Number(size);
            let axis = $root.find('.overlay [name=axis]:checked').val();

            console.info('fid:' + fid + ' type:' + type);

            let filter = undefined;
            let feature = undefined;
            if(filterMap[overlayId]){
                filter = analy.getFiltersById(filterMap[overlayId].filterId);
                feature =  filterMap[overlayId].feature;
                analy.removeFilter(filter);
            }else{
                feature = draw.getFeatureById(fid);
            }

            //+ 기존에 생성된 filter가 없을 경우 새로 생성
            //+ analyList에 객체 추가
            filter = analy.addFilter({
                id: fid,
                geometry: feature.getGeometry(),
                type: type, //+ 'image', 'model
                axis: axis,
                size: size
            });

            filterMap[overlayId] = {filterId:filter.id, feature:feature};

            //+ 밑면에 그려진 빨강색 draw를 지운다
            if (type === 'image')
                draw.removeFeature(feature);
            else{
                if(!draw.getFeatureById(fid)){
                    draw.addFeature(feature);
                }
            }

            //디버그용
            window.filter = filter;
            console.log('result>>', filter.result);
        }

        //+ [취소] 버튼 클릭시 동작하는 Function
        //+ Overlay 지우기
        function cancel(overlayId) {
            let filter;
            const overlay = app.getOverlayById(overlayId);
            if (overlay !== undefined) {

                const fid = $(overlay.element)?.find('.fid').val();
                const feature = draw.getFeatureById(fid);
                if(feature){
                    draw.removeFeature(feature);
                }

                app.removeOverlay(overlay);
                if(filterMap[overlayId]){
                    filter = analy.getFiltersById(filterMap[overlayId].filterId);
                    delete filterMap[overlayId];
                }
            }
            //+ filter가 존재 한다면 삭제
            if (app.defined(filter)) {
                analy.removeFilter(filter);
            }
        }

        function createEmapSatLayer(name) {
            var maxprocess_image = 5;
            var opt = {
                name: name //+ layer name
                , maxprocess: maxprocess_image //+ 최대 process 값
                , useProxy: true //+ 프록시 사용 여부, defaultValue(opt.useproxy, false)
            }

            var layer = app.createEmapSatLayer(opt);
            return layer;
        }

        //디버그용
        window.app = app;
        window.draw = draw;
        window.analy = analy;
    });
</script>
