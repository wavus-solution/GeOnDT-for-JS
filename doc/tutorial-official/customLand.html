<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="layer-setting">
    const LAYER_OPT = {
        satellite: {
            name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        },
        hybrid: {
            name: 'hybrid', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldhybirdurl,  //+ 이미지 데이터 URL, *필수 입력
            reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
            transparent: true //+ layer 투명화 여부
        },
        korea_terrain: {
            name: 'korea_terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자, *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 17, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
        }
    };

    let LayerList = function (Union3D, app) {
        return {
            //이미지레이어
            satellite: new ImageLayer(Union3D, app, LAYER_OPT.satellite),
            hybrid: new ImageLayer(Union3D, app, LAYER_OPT.hybrid),
            //고도레이어
            korea_terrain: new HeightLayer(Union3D, app, LAYER_OPT.korea_terrain)
        }
    }
</script>

        function dxfEntityToCustomLand(id, entity, crs, height) {
            let coords = [];
            let vertices = entity.vertices;
            for (let i = 0; i < vertices.length; i++) {
                let coord = vertices[i];
                if(!coord.x ||!coord.y) continue;
                coord = __GEONDT__.ol.proj.transform([coord.x, coord.y], crs, 'EPSG:4326');
                coords.push({
                    x: coord[0],
                    y: coord[1]
                });
            }
            //+ EditLand 추가
            analy.addCustomLand({
                id: id,
                height: height,
                geoVertex: coords
            });
            //+ 부피정보 출력
            analy.getVolume(id).then(function (land) {
                console.log(id, '원본부피 :', land.beforeVolume);
                console.log(id, '편집부피 :', land.volume);
                let diff = land.getDifference();
                console.log(id, '토공량(' + (diff > 0 ? '절토' : '성토') + '):', diff);
            })
        }

        //+ 중앙 좌표값 얻기
        function getDxfCenter(dxfInfo, crs) {
            let extent = [
                dxfInfo.header.$EXTMIN.x,
                dxfInfo.header.$EXTMIN.y,
                dxfInfo.header.$EXTMAX.x,
                dxfInfo.header.$EXTMAX.y
