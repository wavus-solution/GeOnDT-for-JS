<script id="ui-event">
    const homePosition = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePosition.lat, y: homePosition.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    const MODEL_INFO = {
        name: 'uam_01',
        baseurl: 'https://dt-data.mappick.co.kr/ServiceData/component/DroneShow/UAM/', //+ 모델 데이터의 기본경로, *필수 입력
        fileName: 'UAM_A_Anim_WA_001',
        ext: 'fbx',
        rotation: {x: 90, y: 0, z: 0},
        scale: {x: 0.05, y: 0.05, z: 0.05},
        topCameraShift: {x: 0, y: 0, z: -1},
    };

    const movepointlist = [
        {x: 126.9354, y: 37.5196, z: 100},
        {x: 126.9354, y: 37.5222, z: 100},
        {x: 126.9428, y: 37.5222, z: 100},
        {x: 126.9428, y: 37.5196, z: 100},
        {x: 126.9354, y: 37.5196, z: 100}
    ];

    const FLIGHT_ALTITUDE = 170;
    const FLIGHT_PATH_OPTION = {
        color: '#00b7ff',
        opacity: 0.15,
        width: 18,
        minheight: FLIGHT_ALTITUDE,
        maxheight: FLIGHT_ALTITUDE + 12,
        tension: 0.35,
        transparent: true,
        segments: 300,
        edge: true
    };
    const FLIGHT_PATH_HEIGHT_OFFSETS = [0, 28, 44, 28, 0];
    const FLIGHT_SPEED = 600;
    const VECTOR_LAYER_WAIT_MS = 5;
    let flightPathGeometry;
    let flightComponent;
    let drawingFlightPath;
    let isDrawingFlightPath = false;


    //라이센스 인증
    GeOnDT.ready(function () {
        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        const app = new GeOnDT.U3dAPP({
            containername: 'map' //+ U3dApp(지도영역)의 div ID, *필수 입력
        });
        window.app = app;
        app.setHomePosition(homePosition.lat, homePosition.lon, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();
        app.createloadingBar('load');
        app.on('change', updatePosData);

        //이미지 레이어 생성
        const layer = new GeOnDT.image.U3dImageXYZLayer({
            name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.image.vworldsaturl,  //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        });
        app.addLayer(layer);
        app.setNameBaseLayer('satellite');
        app.showLayer('satellite', true);
        app.endloadingBar();

        //+ u3f 모델 //////////////////////////////////////////////
        // initModelLayers();

        const terrainLayer = new GeOnDT.terrain.U3dHeightXYZLayer({
            name: 'Korea Terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자,  *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false), *필수 입력
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 15, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            maxprocess: 2, //+ process 최대값
            interpolationheight: true,  //+ 고도보간 기능 사용 여부
            rectangle: GeOnDT.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        });
        app.addLayer(terrainLayer);
        app.showLayer('Korea Terrain', true);
        // app.on('click', (e)=>{
        //     const point = app.closestPointAtPixel(e);
        //     const geo = app.vector3ToGeoGraphic(point);
        //     console.log(geo)
        // });
        initComponentLayer();
        initVectorLayer();

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ////////////////////////////////////////// event 등록 //////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        //+ radio 버튼 클릭 eventListener 추가
        //+ 경관분석 / 경관분석 종료
        $(document).on('change', 'input[type="radio"]', function (e) {
            const target = e.target.value;
            toast(target + ' 카메라');
            app.setCameraType(target);
        });

        $(document).on('click', '#draw-flight-path', function () {
            startDrawFlightPath();
        });

        $(document).on('click', '#reset-flight-path', function () {
            resetFlightPath();
        });

        function initComponentLayer() {
            const componentLayer = app.createMultipleComponentLayer({
                name: 'ComponentLayer',
                type: "model",
                needxml: false,
                drawline:false,
            })
            app.showLayer('ComponentLayer', true);
            window.componentLayer = componentLayer;
            componentLayer.loadModel(MODEL_INFO).then(()=>{
                addComponent(componentLayer);
            })
        }

        function addComponent (componentLayer) {
            waitForVectorLayer(function () {
                if (!flightPathGeometry) {
                    flightPathGeometry = createFlightPathGeometry(movepointlist);
                }
                setFlightPath(flightPathGeometry);
            });
        }

        function waitForVectorLayer(callback) {
            if (window.vectorLayer) {
                callback();
                return;
            }
            setTimeout(function () {
                waitForVectorLayer(callback);
            }, VECTOR_LAYER_WAIT_MS);
        }

        function createFlightPathGeometry(geoPointList) {
            if (!window.vectorLayer || !geoPointList || geoPointList.length < 2) return;

            const worldPointList = geoPointList.map(function (point, index) {
                const heightOffset = FLIGHT_PATH_HEIGHT_OFFSETS[index % FLIGHT_PATH_HEIGHT_OFFSETS.length];
                return app.geographicToVector3({x: point.x, y: point.y, z: heightOffset});
            });
            const pathGeometry = new GeOnDT.geom.U3dPathGeometry().createPathMesh(
                worldPointList,
                Object.assign({app}, FLIGHT_PATH_OPTION)
            );
            if (pathGeometry) {
                window.vectorLayer.addGeometry(pathGeometry);
            }
            return pathGeometry;
        }

        function setFlightPath(pathGeometry) {
            if (!pathGeometry || !pathGeometry.geometry || !pathGeometry.geometry.curve) return;

            if (window.componentLayer) {
                window.componentLayer.removeAllComponent();
                flightComponent = undefined;
            }

            const startPoint = pathGeometry.geometry.curve.points[0].clone();
            startPoint.z += pathGeometry._pathOption?.minheight ?? 0;
            flightComponent = window.componentLayer.addPosition({
                geoPosition: app.vector3ToGeoGraphic(startPoint),
                rotation: MODEL_INFO.rotation,
                scale: MODEL_INFO.scale,
                speed: FLIGHT_SPEED,
                hovering: false,
                repeat: true,
                pathgeometry: pathGeometry
            });
            restartPathAnimationImmediately(flightComponent);
        }

        function restartPathAnimationImmediately(component) {
            const routeController = component?.animationControllers?.get('route');
            if (!routeController) return;

            routeController.onComplete(function () {
                routeController.stop();
                component._nowDistance = 0;
                component._animation = true;
                routeController.start();
                component._animationId = 'route';
            });
        }

        function startDrawFlightPath() {
            if (isDrawingFlightPath || !window.vectorLayer) return;

            isDrawingFlightPath = true;
            $('#flight-path-status').text('지도 클릭으로 경로점을 추가하고 더블클릭으로 종료하세요.');

            const drawingPath = new GeOnDT.geom.U3dPathGeometry({
                width: FLIGHT_PATH_OPTION.width,
                minHeight: FLIGHT_PATH_OPTION.minheight,
                maxHeight: FLIGHT_PATH_OPTION.maxheight,
                tension: FLIGHT_PATH_OPTION.tension,
                segments: FLIGHT_PATH_OPTION.segments,
                edge: FLIGHT_PATH_OPTION.edge
            });
            drawingFlightPath = drawingPath;
            window.vectorLayer.addGeometry(drawingPath);
            drawingPath.once('end', function (e) {
                isDrawingFlightPath = false;
                drawingFlightPath = undefined;
                const newPath = e.data;
                if (!newPath || !newPath.geometry || !newPath.geometry.curve || newPath._coordinates.length < 2) {
                    window.vectorLayer.removeGeometry(newPath);
                    $('#flight-path-status').text('경로점이 부족합니다. 다시 그려주세요.');
                    return;
                }
                if (flightPathGeometry && flightPathGeometry !== newPath) {
                    window.vectorLayer.removeGeometry(flightPathGeometry);
                }
                flightPathGeometry = newPath;
                setFlightPath(flightPathGeometry);
                $('#flight-path-status').text('그린 경로를 비행기 이동 경로로 적용했습니다.');
            });
            drawingPath.draw(true, Object.assign({app}, FLIGHT_PATH_OPTION));
        }

        function resetFlightPath() {
            if (!window.vectorLayer || !window.componentLayer) return;
            if (isDrawingFlightPath && drawingFlightPath) {
                drawingFlightPath.endPathPoint();
            }
            if (flightPathGeometry) {
                window.vectorLayer.removeGeometry(flightPathGeometry);
            }
            flightPathGeometry = createFlightPathGeometry(movepointlist);
            setFlightPath(flightPathGeometry);
            $('#flight-path-status').text('기본 경로를 다시 적용했습니다.');
        }

        function initVectorLayer() {
            const vectorLayer = new GeOnDT.vector.U3dVectorLayer({
                name: 'vector',
            });
            window.vectorLayer = vectorLayer;
            app.addLayer(vectorLayer);
            app.showLayer('vector', true);

            addVectors(vectorLayer) ;
        }

        function addVectors(vectorLayer) {
            const box = new GeOnDT.geom.U3dBox({width: 80, height: 80, depth: 120, useLine: true, color: "#fff000"});
            const sphere = new GeOnDT.geom.U3dSphere({color: "#3489e7", radius : 36, widthSegments:16, heightSegments:16});
            const cylinder = new GeOnDT.geom.U3dCylinder({height: 120, color: "#f61212", radiusBottom:36, radiusTop:36});
            const cone = new GeOnDT.geom.U3dCylinder({height: 120, radiusTop:0, radiusBottom:36,color: "#ff8000"});

            vectorLayer.addGeometry(box);
            vectorLayer.addGeometry(sphere);
            vectorLayer.addGeometry(cylinder);
            vectorLayer.addGeometry(cone);

            box.setPosition(126.9392, 37.52260, 10.6 + (box.depth/2) );
            sphere.setPosition(126.93488, 37.52085, 15 + (sphere.radius));
            cylinder.setPosition(126.94320, 37.52085,15 + (cylinder.height/2));
            cylinder.setRotation({x:0, y:1.57, z:1.57});
            cone.setPosition(126.94003450131564, 37.51962899566184, 15 + (cone.height/2))
            cone.setRotation({x:0, y:1.57, z: 1.57});
        }

        function initModelLayers() {
            try {
                let modelayers = app.createModelGroupLayer({
                    maxlevel: 19,
                    minlevel: 17,
                    name: 'u3f'
                });
                /* request U3f layers list */
                $.ajax({
                    url: modelU3f2_2URL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let infos = result.params.data;
                    for (let i = 0; i < infos.length; i++) {
                        let info = infos[i];
                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (info.state === "ACTIVE") {
                            let baseName = info.fileName;
                            if(!baseName || baseName ==='')
                                baseName = info.name;
                            let options = {
                                name: info.name,
                                basename: baseName,
                                baseurl: info.baseUrl,
                                useproxy: false,
                                minlevel: info.metaData.minLevel,
                                maxlevel: info.metaData.maxLevel,
                                compressmodel: true,
                                isShareMaterial: false,
                                makeU3FPackage: 1
                            };
                            let subLayer = app.create3DFModelLayer(options);
                            subLayer.then(function (layer) {
                                modelayers.addLayer(subLayer);
                                if (i === infos.length - 1) {
                                    console.log("u3f model layer load");
                                    app.showLayer(modelayers.getName(), true);
                                }
                            }).fail(function (layer) {

                            });
                        }
                    }
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }
    });
</script>
</body>
</html>
