<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="layer-setting">
    const LAYER_OPT = {
        satellite: {
            name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        },
        hybrid: {
            name: 'hybrid', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldhybirdurl,  //+ 이미지 데이터 URL, *필수 입력
            reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
            transparent: true //+ layer 투명화 여부
        },
        korea_terrain: {
            name: 'korea_terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자, *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 15, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            maxprocess: 2, //+ process 최대값
            interpolationheight: true,  //+ 고도보간 기능 사용 여부
        }
    };

    let LayerList = function (Union3D, app) {
        return {
            //이미지레이어
            satellite: new ImageLayer(Union3D, app, LAYER_OPT.satellite),
            hybrid: new ImageLayer(Union3D, app, LAYER_OPT.hybrid),
            //고도레이어
            korea_terrain: new HeightLayer(Union3D, app, LAYER_OPT.korea_terrain)
        }
    }
</script>
<script>
    //+ 라이센스 인증
    Union3D.ready(function () {

                //fieldheight: layerInfo.wfs_korea.fieldheight, //+ 높이 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)
                fieldfloor: layerInfo.wfs_korea.fieldfloor, //+ 층수 필드 (속성테이블 칼럼명), defaultValue(opt.fieldheight, undefined)

                fieldKind: layerInfo.wfs_korea.fieldKind,  //+ 종류 필드 (속성테이블 칼럼명), defaultValue(opt.fieldKind, undefined)

                textureurl: '/image/buld/buld_texture_1.jpg',  //+ 텍스처 url, defaultValue(opt.textureurl, undefined)
                useproxy: (window.location.hostname !== 'localhost'),
            },
            UDG_CNTS_LI: {
                name: 'UDG_CNTS_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                layername: 'UDG_CNTS_LI', //+ 레이어 이름, *필수 입력
                baseurl: layerInfo.wfs_korea.baseurl,  //+ baseurl, *필수 입력
                minlevel: 17, //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
                drawline: false, //+ WFS 모델에 테투리 추가 여부
                useterrain: false, //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
                version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
                useproxy: (window.location.hostname !== 'localhost'), //+ 프록시 사용 여부
                color: '#FFD817', //+ WFS model 색상
                piperadius: 0.5, // 파이프 직경
                featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
                heightFunction: function (feature){
                    return -20;
                }
            },
            UDG_DRASY_LI: {
                name: 'UDG_DRASY_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                layername: 'UDG_DRASY_LI', //+ 레이어 이름, *필수 입력
                baseurl: layerInfo.wfs_korea.baseurl,  //+ baseurl, *필수 입력
                minlevel: 17,  //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
                drawline: false,  //+ WFS 모델에 테투리 추가 여부
                useterrain: false,  //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
                version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
                useproxy: (window.location.hostname !== 'localhost'), //+ 프록시 사용 여부
                color: '#FF851C', //+ WFS model 색상
                piperadius: 0.5, // 파이프 직경
                featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
                heightFunction: function (feature){
                    return -30;
                }
            },
            UDG_SWDPI_LI: {
                name: 'UDG_SWDPI_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                layername: 'UDG_SWDPI_LI', //+ 레이어 이름, *필수 입력
                baseurl: layerInfo.wfs_korea.baseurl, //+ baseurl, *필수 입력
                minlevel: 17, //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
                drawline: false, //+ WFS 모델에 테투리 추가 여부
                useterrain: false, //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
                version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
                useproxy: (window.location.hostname !== 'localhost'), //+ 프록시 사용 여부
                color: '#2DE0AE', //+ WFS model 색상
                piperadius: 0.5, // 파이프 직경
                featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
                heightFunction: function (feature){
                    //피쳐 개별의 속성을 확인하여 고도값을 다르게 적용할 수 있습니다.
                    if(feature.properties.regu_cd === "26410100")
                        return -30;
                    else
                        return -20;
                },
                depthFunction: function (feature){
                    //피쳐 개별의 속성을 확인하여 직경을 다르게 적용할 수 있습니다. piperadius 가 입력 되더라도 함수의 리턴값 우선적용
                    if(feature.properties.regu_cd === "26410000")
                        return 1;
                    else
                        return 0.5;
                }
            },
            UDG_SWPI_LI: {
                name: 'UDG_SWPI_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                layername: 'UDG_SWPI_LI', //+ 레이어 이름, *필수 입력
                baseurl: layerInfo.wfs_korea.baseurl,  //+ baseurl, *필수 입력
                minlevel: 17,  //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
                drawline: false, //+ WFS 모델에 테투리 추가 여부
                useterrain: false,  //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
                version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
                useproxy: (window.location.hostname !== 'localhost'), //+ 프록시 사용 여부
                color: '#4DB8DB', //+ WFS model 색상
                piperadius: 0.5, // 파이프 직경
                featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
                heightFunction: function (feature){
                    // feature의 coordinates 높이값 개별로 입력하면 개별 정점 마다 높이가 적용 됩니다.
                    const coordinates = feature.geometry.coordinates;
                    for (let line of coordinates) {
                        for(let vertex of line){
                            if(vertex[2])
                                vertex[2] = -20;
                            else
                                vertex.push(-20);
                        }
                    }

                    return 0;
                }
            },
        }
        //지도 기본 세팅///////////////////////////////////////
        window.app = new Union3D.U3dAPP({
            containername: 'map', //+ U3dApp(지도영역)의 div ID, *필수 입력
            speedprocess: 1, //+ defaultValue(opt.speedprocess, 1);
            methodheight: '1_0', //+ 지형처리방법
            searchtype: 'sphere' //+ 타일검색 방법
        });

        app.on('change', updatePosData);
        app.createloadingBar('load');
        app.loadingBar();

        app.setHomePosition(129.123, 35.182, 200, -350, 70); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition().then(function () {
            app.setUnderGroundMode(true);
        });

        //이미지 레이어 생성
        let layers = new LayerList(Union3D, app);
        let initLayerList = ['satellite', 'korea_terrain']
        initLayar(initLayerList);

        createLayer('UDG_CNTS_LI');
        app.showLayer('UDG_CNTS_LI', true);
        createLayer('UDG_DRASY_LI');
        app.showLayer('UDG_DRASY_LI', true);
        createLayer('UDG_SWDPI_LI');
        app.showLayer('UDG_SWDPI_LI', true);
        createLayer('UDG_SWPI_LI');
        app.showLayer('UDG_SWPI_LI', true);

        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayar(list) {
            const basename = list[0];
            Union3D.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);

                            app.showLayer(name, true);
                            $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }

        /////////////////////////////////////////////////////
        $(document).on('click', 'input[type=checkbox]', checked);

        var analy = app.getAnalysis('ObjectInfo');
        initSlider('opacity');
        initSlider('m-opacity');

        app.setEnableOpacityImageLayers(true);
        app.setOpacityImageLayers(0.5);
        $('#opacity').slider("value", 0.5);
        $('#opacity-handle').text(0.5);


        function checked(e) {
            var $checkbox = $(e.target);
            var name = $checkbox.attr('target');
            if (name == 'useinfo') {
                if ($checkbox[0].checked) {
                    analy.active();
                } else {
                    analy.deactive();
                }

            } else if (name == 'opacity_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableOpacityImageLayers(true)
                } else {
                    app.setEnableOpacityImageLayers(false)
                }
                return;
            }
            //+ 모델 투명화 여부
            else if (name == 'm_opacity_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableOpacityModelLayers(true)
                } else {
                    app.setEnableOpacityModelLayers(false)
                }
                return;
                //+ 지하시설물, 건물 선택에서 체크된 항목에 대해 생성합니다.

            } else {
                if (name !== 'korea_terrain')
                    createLayer(name);

                if ($checkbox[0].checked) {
                    app.showLayer(name, true);
                } else {
                    app.showLayer(name, false);
                }
            }
        }

        function createLayer(name) {
            var layer = layers[name];
            if (layer === undefined) {
                //레이어 생성 및 APP에 레이어 추가
                var options = LAYER_OPT_[name];
                layer = new Union3D.model.U3dModelWFSLayer(options);
                app.addLayer(layer);

                layers[name] = layer;
            }
        }

        function initSlider(type) {
            var id = '';
            var idhandle = '';
            var step = 0.01;
            switch (type) {
                //+ 영상 Layer 투명도 슬라이드 bar
                case  'opacity': {
                    id = '#opacity';
                    idhandle = '#opacity-handle';
                }
                    break;
                //+ 모델 Layer 투명도 슬라이드 bar
                case  'm-opacity': {
                    id = '#m-opacity';
                    idhandle = '#m-opacity-handle';
                }
                    break;
            }

            var handle = $(idhandle);
            $(id).slider({
                orientation: "horizontal",
                range: "min",
                value: 1,
                min: 0, // min value
                max: 1,
                step: step,
                create: function () {
                    var val = $(this).slider("value");
                    handle.text(val.toFixed(2));
                },
                slide: function (event, ui) {
                    handle.text(ui.value.toFixed(2));
                    switch (id) {
                        case  '#opacity': {
                            app.setOpacityImageLayers(ui.value);
                        }
                            break;
                        case  '#m-opacity': {
                            app.setOpacityModelLayers(ui.value);
                        }
                            break;
                    }
                },
                change: function (event, ui) {
                }
            });
        }


        app.on('click', function (e) {
            if (analy.isActive()) {
                var obj = analy.intersectModel(e);
                if (obj === undefined || obj.length === 0) {
                    // analy.clear();
                    return;
                }

                // var world = app.closestPointAtPixel(e);
                var latlon = app.vector3ToGeoGraphic(obj[0].point);
                var overlay = createOverlay('overlay', obj[0], latlon);
                overlay.show();
            }
        });

        function createOverlay(name, obj, position) {
            var html = printOverlayHtml(obj);
            var overlay = new Union3D.overlay.U3dOverlay({
                name: name, //+ 오버레이 이름, * 필수 입력,  defaultValue(opt.name, undefined);
                id: obj.uuid, //+ 오버레이 ID, defaultValue(opt.id, Guid());
                element: html, //+ 오버레이 html의 문자열 또는 JQuery 객체, *필수 입력
                position: position, //+ 오버레이 위치(위경도), defaultValue(opt.position, undefined);, *필수 입력
                useanchor: false, //+ defaultValue(opt.useanchor, true);
                balloon: {x: -50, y: 10} //+ balloon 위치,  defaultValue(opt.balloon, {x: 0, y: 0});
            });
            app.removeAllOverlay();
            app.addOverlay(overlay);
            var element = overlay.getElement();
            $(element).on('click', '.close', popUpCloseClick.bind(overlay));
            return overlay;
        }

        function printOverlayHtml(obj) {
            var obj = obj.object;
            var str = '';
            str += '<div class="u3-popup" id=' + obj.uuid + '>';
            str += '<div class="u3-popup-content">';
            str += '<div class="modal-header">';
            str += '<label>선택 객체 정보</label>';
            str += '<button type="button" class="close"><span aria-hidden="true">&times;</span>';
            str += '</button>';
            str += '</div>';

            str += '<div class="item-sub-title"><span class="text-icon">레이어 이름: </span>' + obj._ulayername + '</div>';
            str += '<div class="item-sub-title"><span class="text-icon">번호: </span>' + obj.uuid + '</div>';

            str += '</div>';
            str += '</div>';
            return str;
        }

        //+ overlay 닫기 버튼 event 함수
        function popUpCloseClick() {
            $(this.element).off('click', '.close', popUpCloseClick);
            app.removeOverlay(this);
            analy.clear();
        }
    });
</script>
