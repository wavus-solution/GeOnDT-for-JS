        .u3-popup {
            position: absolute;
            color: #fff;
            background-color: rgba(20, 20, 20, 0.6);
            -webkit-filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.2));
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.2));
            padding: 5px;
            /*border-radius: 10px;*/
            height: fit-content;
            border: 1px solid #00000033;
            bottom: 12px;
            left: -50px;
            min-width: 400px;
            max-height: 280px;
            display: none;
            overflow-y: auto;
        }

        .u3-popup:after, .u3-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }

        .u3-popup:after {
            border-top-color: white;
            border-width: 10px;
            left: 48px;
            margin-left: -10px;
        }

        .u3-popup:before {
            border-top-color: #cccccc;
            border-width: 11px;
            left: 48px;
            margin-left: -11px;
        }

        .u3-popup .u3-popup-content .modal-header {
            border-bottom: none;
            height: 20px;
            padding: 0 5px 0 5px;
            line-height: 20px;
            background-color: rgb(43, 69, 140);

            line-height: 20px;
        }

        .panel-body {

        .move {

        }

        .slider-root-wrapper {

            padding-left: 10px;
        }

        .slider-wrapper {
            width: 300px;
            margin-left: 10px;
            margin-right: 60px;
            display: -webkit-inline-flex;
            margin-bottom: 0px;
        }

        .ui-slider .ui-slider-range {

            font-size: .7em;
            display: block;
            border: 0;
            background-position: 0 0;
            background-color: rgba(23, 36, 75, 0.65);

        #opacity-handle, #m-opacity-handle, #x-axis-handle, #y-axis-handle, #z-axis-handle {

            width: 35px;
            text-align: center;
            top: -5px;

<script id="ui-event">
    const homePosition = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

        event.preventDefault();

<script id="set-imagelayer">
    let ImageLayer = function (GeOnDT, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = GeOnDT;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }

    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }

    ImageLayer.prototype.show = function (isShow) {
        let promise = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promise.resolve();
        })
        this.isShow = isShow;
        return promise;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (GeOnDT, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = GeOnDT.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }

    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }

    HeightLayer.prototype.show = function (isShow) {
        let promise = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promise.resolve();
        })
        this.isShow = isShow;
        return promise;
    }
</script>

        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        //+ overlay 생성 function
        async function createOverlay(name, obj, position) {
            const html = await printOverlayHtml(obj);//+ overlay UI
            const overlay = new GeOnDT.overlay.U3dOverlay({
                name: name, //+ 오버레이 이름, * 필수 입력,  defaultValue(opt.name, undefined);
                id: obj.uuid, //+ 오버레이 ID, defaultValue(opt.id, Guid());
                element: html, //+ 오버레이 html의 문자열 또는 JQuery 객체, *필수 입력
                position: position, //+ 오버레이 위치(위경도), defaultValue(opt.position, undefined);, *필수 입력
                useanchor: false, //+ 클릭 지점에 따라 앵커 자동 변경,  defaultValue(opt.useanchor, true);
                balloon: {x: -50, y: 10} //+ balloon 위치,  defaultValue(opt.balloon, {x: 0, y: 0});
            });
            app.removeAllOverlay(); //+ 다른 overlay 전체 삭제
            app.addOverlay(overlay); //+ 새로 만든 overlay 추가
            const element = overlay.getElement();
            //+ overlay에 닫기 event 추가
            $(element).on('click', '.close', popUpCloseClick.bind(overlay));
            return overlay;
        }

        //+ overlay UI
        async function printOverlayHtml(obj) {
            const item = obj;
            let str = '';
            str += '<div class="u3-popup" id=' + obj.uuid + '>';
            str += '<div class="u3-popup-content">';
            str += '<div class="modal-header">';
            str += '<label>선택 객체 정보</label>';
            str += '<button type="button" class="close"><span aria-hidden="true">&times;</span>';
            str += '</button>';
            str += '</div>';

            str += '<div class="item-sub-title"><span class="text-icon">레이어 명: </span>' + item._ulayername + '</div>';  //+ model layer Name
            str += '<div class="item-sub-title"><span class="text-icon">번호: </span>' + item.uuid + '</div>'; //+ model UUID
            str += '<hr>'
            if (item.userData.metaurl)
                str += '<div class="item-sub-title"><span class="text-icon">META_URL: </span>' + item.userData.metaurl + '</div>'; //+ model UUID
            if (item.userData) {
                str += printProperties(item.userData);
            }
            str += '</div>';
            str += '</div>';
            return str;
        }

        function printProperties(properties) {
            let str = "";
            const keys = Object.keys(properties);
            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                str += '<div class="item-sub-title"><span class="text-icon">' + key + ' : </span>' + properties[keys[i]] + '</div>';
            }

            return str;
        }

        //+ overlay 닫기 event function
        function popUpCloseClick() {
            $(this.element).off('click', '.close', popUpCloseClick);
            app.removeOverlay(this); //+ overlay 제거
            selector.clear(); //+ 분석 내용 비우기
        }

        /////////////////////////////////////////////////////
        function createTilesLayer(name) {
            if(!LAYER_OPT_[name])
                return;

            if (layers[name] === name)
                return;

            //+ 지하철 역사, 지하철 선로, 공동구 색상 설정
            let fixColor = undefined;
            if (name === 'goyang_subway_track' ||
                name === 'goyang_subway_station' ||
                name === 'goyang_common_area') {
                fixColor = '#FFBD51';
            }
            let modelLayer = undefined;
            if(LAYER_OPT_[name].layers){
                modelLayer = app.createModelGroupLayer({
                    name: name,
                    maxlevel: 17,
                    minlevel: 17,
                });
                for(let info of LAYER_OPT_[name].layers){
                    const layer = new GeOnDT.model.U3dModelI3FLayer({
                        name: info.name,
                        fixcolor: fixColor,
                        useproxy: false,
                        baseurl: info.url,
                        limitdistance: 220, //출력 반경, 기본값 220
                        modeldetail: 'high', //출력 모델 화질 high 또는 low 입력 , 기본값 high
                        metaDataFunction: metaDataFunction
                    });
                    app.addLayer(layer);
                    modelLayer.addLayer(layer);
                }
            }else{
                modelLayer = new GeOnDT.model.U3dModelI3FLayer({
                    name: name,
                    fixcolor: fixColor,
                    useproxy: false,
                    baseurl: LAYER_OPT_[name].url,
                    limitdistance: 220, //출력 반경, 기본값 220
                    modeldetail: 'high', //출력 모델 화질 high 또는 low 입력 , 기본값 high
                    metaDataFunction: metaDataFunction
                });
                app.addLayer(modelLayer);
            }

            modelLayer.then(function () {
                app.showLayer(name, true);
            });

            window.layer = modelLayer;
            layers[name] = name;
        }

        function metaDataFunction(meta) {
            // console.log(meta)
        }

        function removeLayer(name) {
            if (layers[name] !== name)
                return;

            app.removeLayer(name);
            layers[name] = undefined;
        }

        $(document).on('click', 'input[type=checkbox]', checked);

        function checked(e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');

            if (name === undefined || app === undefined)
                return;

            //+ 영상 투명화 여부
            if (name === 'opacity_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableOpacityImageLayers(true)
                } else {
                    app.setEnableOpacityImageLayers(false)
                }
                return;
            }

            if (name === 'm_opacity_yn') {
                if ($checkbox[0].checked) {
                    window.u3fGroupLayer.setOpacity( $('#m-opacity').slider("value") );
                } else {
                    window.u3fGroupLayer.setOpacity(1);
                }
                return;
            }

            createTilesLayer(name);

            if ($checkbox[0].checked) {
                app.showLayer(name, true);
            } else {
                app.showLayer(name, false);
            }
        }

        $(document).on('click', '.move', move);

        function move(e) {
            e.preventDefault();
            const name = $($(this).siblings()[0]).attr('target');
            const pos = LAYER_OPT_[name].position;

            const delayTime = 4000;
            app.setCameraGeographicPosition(pos.x, pos.y, pos.z, pos.rotateX, pos.rotateY, delayTime)
                .then(function () {
                    app.once('app-loaded', function () {
                        console.log('app-loaded');
                    })
                });
        }

        $(document).on('click', '.delete', deleteFunc);

        function deleteFunc(e) {
            e.preventDefault();
            var name = $($(this).siblings()[0]).attr('target');

            removeLayer(name);

            $($(this).siblings()[0]).prop('checked', false);
        }

        $(document).on('click', '#selectObject', selectObject);

        // selector 생성
        window.selector = new GeOnDT.select.U3dSelect({
            mode: 'point',
            auto: false // 사용자가 직접 select할 객체를 지정 하는 모드
        });
        app.addSelect(selector);

        function selectObject(e) {
            if (e.target.checked) {
                selectArea.on();
            } else
                selectArea.off();
        }

        $(document).on('click', '#showUndergroudGrid', showUnderGroundGrid);

        function showUnderGroundGrid(e) {
            app.showUnderGroundGrid(e.target.checked);
        }

        //selector 이벤트 설정
        let selectArea = {
            check: function (checked, name) {
                if (checked) {
                    $('.selectCheck[target!="' + name + '"]').prop("checked", false);
                    this.on(name);
                } else {
                    this.off();
                }
            },
            on: function () {
                app.removeAllOverlay(); //+ 다른 overlay 전체 삭제
                if (!selector.isActive()) {
                    selector.active();
                    selector.on('change', this.change);
                    selector.on('end', this.end);
                }
            },
            off: function () {
                app.removeAllOverlay(); //+ 다른 overlay 전체 삭제
                selector.clear();
                selector.deactive();
                selector.off('change', this.change);
                selector.off('end', this.end);
            },
            change: function (e) {
                console.log('Change Event');
                app.removeAllOverlay(); //+ 다른 overlay 전체 삭제
            },
            end: async function (e) {
                console.log('End Event');
                let selects = e.data;

                selects.forEach((select) => {
                    let name = select.getLayerName();
                    // 고도 & wfs 모델 레이어 선택 제외
                    if (name !== undefined && name !== "gyeonggido_2hd_15") {
                        selector.addSelected(select);
                    }
                })

                let objects = selector.getSelected();
                let obj;
                for (let i = 0; i < objects.length; i++) {
                    let x = objects[i].position.x;
                    let y = objects[i].position.y;
                    let z = objects[i].position.z;
                    console.log(`[${i}] x: ${x} , y: ${y} , z: ${z}`);
                    if (!obj) {
                        obj = objects[i];
                    }
                }
                if (obj) {
                    let htmlStr = printOverlayHtml(obj);
                    let latlon = e.work.points[0];
                    let overlay = await createOverlay('overlay', obj, latlon, htmlStr); //+ 위경도 좌표에 overlay 생성
                    overlay.show(); //+ overlay 가시화

                    let lastWork = e.work; // == e.work;
                    if (lastWork) {
                        console.info(lastWork.type + " : ")
                        console.info(lastWork.points)
                    }
                }
            }

        }
        selectArea.on();

        // 투명도 slider 설정
        function initSlider(type) {
            let id = '';
            let idhandle = '';
            let step = 0.01;
            switch (type) {
                case  'opacity': {
                    id = '#opacity';
                    idhandle = '#opacity-handle';
                }
                    break;
                case  'm-opacity': {
                    id = '#m-opacity';
                    idhandle = '#m-opacity-handle';
                }
                    break;
                case 'x-axis': {
                    id = '#x-axis';
                    idhandle = '#x-axis-handle';
                    step = 0.000001;
                }
                    break;
                case 'y-axis': {
                    id = '#y-axis';
                    idhandle = '#y-axis-handle';
                    step = 0.000001;
                }
                    break;
                case 'z-axis': {
                    id = '#z-axis';
                    idhandle = '#z-axis-handle';
                    step = 0.000001;
                }
                    break;
            }

            const handle = $(idhandle);
            $(id).slider({
                orientation: "horizontal",
                range: "min",
                value: 1,
                min: 0, // min value
                max: 1,
                step: step,
                create: function () {
                    const val = $(this).slider("value");
                    handle.text(val.toFixed(2));
                },
                slide: function (event, ui) {
                    handle.text(ui.value.toFixed(2));
                    switch (id) {
                        case  '#opacity': {
                            app.setOpacityImageLayers(ui.value);
                        }
                            break;
                        case  '#m-opacity': {
                            window.u3fGroupLayer.setOpacity(ui.value);
                        }
                            break;
                        case '#x-axis': {
                            app.setClippingAxisXByRatio(ui.value);
                        }
                            break;
                        case '#y-axis': {
                            app.setClippingAxisYByRatio(ui.value);
                        }
                            break;
                        case '#z-axis': {
                            app.setClippingAxisHeightByRatio(ui.value);
                        }
                    }
                }
            });
        }
    });
</script>
