<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active')){
            $('#analy-popup').show();
        }
        else{
            $('#analy-popup').hide();
            $('#search-panel').hide();
        }
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "70px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('#search-panel').draggable();
        $('.popup-exit').on('click', function () {
            $('#analy-popup').hide();
            $('#analy-bnt').removeClass('active');
        });
        $('.search-popup-exit').on('click', function () {
            $('#search-panel').hide();
        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else if (self._name === 'pattern'){
            self.layer = new self._union3d.image.U3dPatternXYZLayer(this.options);
            self._app.addLayer(this.layer);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

        },
        pattern: {
            name: 'pattern'  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            //,baseurl: 'sample/img/tile_rock.jpg' //+ 패턴 텍스쳐 URL
            ,baseurl: 'default' //+ 'default' 입력 시, 내부 기본 패턴 텍스쳐 사용
            ,alphabaseurl: 'sample/img/alphaSample.jpg' //알파 텍스쳐 url
            ,isConvertGrayScale : true //사용할 알파 텍스쳐 이미지의 그레이 스케일을 알파값으로 변환해야되는지 여부, 흑백 jpg로 된 이미지는 필수적으로 사용해야함
            ,usebasetexture : true //  패턴 텍스쳐 출력 여부
            ,usealphatexture : false // 알파 텍스쳐 출력 여부
            ,color: 0xffffff //+ 레이어 색상 입력
            ,opacity : 0.3  //레이어 투명도 입력, 데칼의 투명도랑 별개로 작동함
            ,decalInfos:[ //데칼 설정
                {
                    decalArea:[
                        {x:126.936,y:37.517}
                        ,{x:126.935,y:37.517}
                        ,{x:126.941,y:37.520}
                        ,{x:126.939,y:37.514}
                    ],
                    textureUrl:'sample/img/tile.png',
                    alphaTextureUrl:'sample/img/alphaSample.jpg',
                    isConvertGrayScale : true,
                    patternStrength:2,
                    opacity:1.0,
                    color: 0xff0000,
                    minLevel:12,
                    maxLevel:19
                },
                {
                    decalArea:[
                        {x:126.931,y:37.513}
                        ,{x:126.929,y:37.510}
                        ,{x:126.936,y:37.509}
                        ,{x:126.941,y:37.512}
                    ],
                    opacity:1.0,
                    textureUrl:'sample/img/tile.png',
                    color: 0x00ff00,
                    minLevel:12,
                    maxLevel:19
                }
            ]
        },
        korea_terrain: {
            name: 'korea_terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자, *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 17, //+ 가시화 최대 레벨
            useproxy: false //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
        }
    };

    let LayerList = function (Union3D, app) {
        return {
            satellite: new ImageLayer(Union3D, app, LAYER_OPT.satellite),
            emapbase: new ImageLayer(Union3D, app, LAYER_OPT.emapbase),
            //이미지레이어
            pattern: new ImageLayer(Union3D, app, LAYER_OPT.pattern),
            //고도레이어
            korea_terrain: new HeightLayer(Union3D, app, LAYER_OPT.korea_terrain)
        }
    }
</script>

<script>
    let draw = null;
    let layers = null;
    let app = null;
    let poiList = [];

    //라이센스 인증
    GeOnDT.ready(function () {
        app = new GeOnDT.U3dAPP({
            containername: 'map',  //+ U3dApp(지도영역)의 div ID, *필수 입력
            uselimit: false, //+ 정적로딩시 거리제한 설정,  defaultValue(opt.uselimit, true);
            usePostProcess:false
        });
        window.app = app;

        app.on('change', updatePosData);

        app.setHomePosition(homePositon.lat, homePositon.lon, homePositon.height, homePositon.left, homePositon.down); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();

        app.createloadingBar('load');
        app.loadingBar();

        if(window.location.hostname === 'localhost'){
            app.createDebugCanvas();
        }

        layers = new LayerList(GeOnDT, app);

        let initLayerList = [
            'satellite'
            //'emapbase'
            ,'pattern'
            ,'korea_terrain'];
        initLayer(initLayerList);

        draw = new GeOnDT.UDraw({
            nodeLabel:'click'
        });
        draw.setApp(app);

        draw.on('end', function (e) {
            const geom = e.data.getGeometry();
            const coords = geom.getCoordinates()[0];

            const decalArea = [];
            for(const coord of coords){
                const geoPoint = {
                    x:coord[0],
                    y:coord[1]
                }
                decalArea.push(geoPoint);
            }

            const decalInfo = {
                decalArea:decalArea,
                textureUrl:'sample/img/tile.png',
                alphaTextureUrl:'sample/img/alphaSample.jpg',
                isConvertGrayScale : true,
                patternStrength:2,
                useTexture:true,
                useAlphaTexture:true,
                opacity:1.0,
                color: 0xffffff,
                minLevel:12,
                maxLevel:19
            };

            const patternLayer = app.getLayerByName('pattern');
            if(patternLayer){
                patternLayer.addDecal([decalInfo]).then((decalList)=>{
                    for(const decal of decalList){
                        console.log('addDecal 호출 성공: ' + decal.name );
                    }
                });
            }
            //+ draw 비활성화
            draw.deactive();
            draw.clear();
            //+ [그리기] 버튼 클릭 활성화
            $('.btn-draw').removeClass('active');
        })
    });

    function setDecalRow(decal){
        console.log('데칼 목록 추가됨: ' + decal.name );
        const patternLayer = app.getLayerByName('pattern');
        if(!patternLayer) return;

        const $div = $('.filter-state');
        const $row = $(
            `
            <div>
                <span>이름 : ${decal.name}</span>
                <input type="button" style="margin-left: 10px;font-size:11px;padding-left:5px;padding-top:0;padding-bottom:0;" class="btn btn-xs btn-info btn-dispose-decal" value="X">
                <input type="button" style="font-size:11px;padding-left:5px;padding-top:0;padding-bottom:0;" class="btn btn-xs btn-info btn-set-decal" value="설정">
            </div>
            `
        );
        $div.append($row);
        $row.find(`.btn-dispose-decal`).on('click',function(){
            if(decal.name === $('#search-panel-name').text())
                $('#search-panel').hide();

            patternLayer.removeDecal(decal);
            decal.dispose();
            $row.remove();
        });

        $row.find(`.btn-set-decal`).on('click',function(){

            const setPanel = $('#search-panel');
            setPanel.show();
            console.log('데칼 설정 팝업 열림');
            $('#search-panel-name').text(decal.name);
            $('#inputDecalColor').val('#' + decal.color.getHexString());
            $('#inputDecalOpacity').val(decal.getOpacity());
            $('#inputDecalUseTexture').prop('checked', decal.getUseTexture());
            $('#inputDecalUseAlpha').prop('checked', decal.getUseAlphaTexture());
            $('#inputDecalPatternStrength').val(decal.getPatternStrength());
            $('#inputDecalMinPatternPixel').val(decal.getMinPatternPixel());
        });
    }

    $('#search-panel-hide').on('click', function () {
        $('#search-panel').hide();
    });

    $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
        const $checkbox = $(e.target);
        const name = $checkbox.attr('target');
        checkLayer(name, $checkbox[0].checked);
    });

    function checkLayer(name, checked) {
        if(!layers) return;

        if (checked) {
            if (layers[name].layer === undefined) {
                layers[name].create();
            }
            layers[name].show(true);
        } else {
            layers[name].show(false);
        }
    }

    function initLayer(list) {
        if(!app|| !layers || !list ) return;

        const basename = list[0];
        GeOnDT.UDEF.createPromise((resolve) => {
            list.forEach((name) => {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                    layers[name].ready.then(() => {
                        if (name === basename)
                            app.setNameBaseLayer(name);

                        app.showLayer(name, true);
                        $('.input-showLayer:input[target=' + name + ']').prop("checked", true);

                        if(layers[name].layer && name === 'pattern'){
                            layers[name].layer.on('addDecal', (decal) => {
                                setDecalRow(decal);
                            })
                        }
                    });
                }
            });
            resolve(true);
        }).then((resolve) => {
            if (resolve)
                app.endloadingBar();
        });
    }

    $('.btn-layer-commit').on('click', function () {
        console.log('레이어 설정 적용 실행');
        const patternLayer = app.getLayerByName('pattern');
        if(!patternLayer) return;

        const layerColor = $('#inputLayerColor').val();
        const layerOpacity = $('#inputLayerOpacity').val();
        const layerUseTexture = $('#inputLayerUseTexture').is(':checked');
        const layerUseAlpha = $('#inputLayerUseAlpha').is(':checked');

        patternLayer
            .setColor(layerColor)
            .setOpacity(layerOpacity)
            .setUseBaseTexture(layerUseTexture)
            .setUseAlphaTexture(layerUseAlpha)
            .commit();
    });

    $('.btn-decal-commit').on('click', function () {
        console.log('데칼 설정 적용 실행');
        const patternLayer = app.getLayerByName('pattern');
        if(!patternLayer) return;

        const decalName =  $('#search-panel-name').text();
        const decal = patternLayer.getDecal(decalName);

        if(!decal) return;

        const decalColor = $('#inputDecalColor').val();
        const decalOpacity = $('#inputDecalOpacity').val();
        const decalUseTexture = $('#inputDecalUseTexture').is(':checked');
        const decalUseAlpha = $('#inputDecalUseAlpha').is(':checked');
        const decalPatternStrength = $('#inputDecalPatternStrength').val();
        const decalMinPatternPixel = $('#inputDecalMinPatternPixel').val();

        decal
            .setColor(decalColor)
            .setOpacity(decalOpacity)
            .setUseTexture(decalUseTexture)
            .setUseAlphaTexture(decalUseAlpha)
            .setPatternStrength(decalPatternStrength)
            .setMinPatternPixel(decalMinPatternPixel)
            .commit();
    });

    $('.btn-clear').on('click', function () {
        console.log('데칼 모두 지우기 설정 적용 실행');
        const patternLayer = app.getLayerByName('pattern');
        if(!patternLayer) return;

        patternLayer.removeAllDecal(true);

        $('.filter-state').empty();
    })

    //+ [그리기] 버튼 클릭시 동작하는 function
    $('.btn-draw').on('click', function () {
        console.log('데칼 그래기 실행');
        if(!draw) return;

        toast('화면을 클릭하여 영역을 그리세요.\n더블 클릭으로 그리기를 종료합니다.')
        draw.clear();
        //+ draw Type - Polygon으로 지정
        draw.setGeometryType('Polygon');
        //+ draw 활성화
        draw.active();
        //+ [그리기] 버튼 클릭 비활성화
        $(this).addClass('active');
    });
</script>
</body>
</html>
