<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="layer-setting">
    const LAYER_OPT = {
        satellite: {
            name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        },
        hybrid: {
            name: 'hybrid', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldhybirdurl,  //+ 이미지 데이터 URL, *필수 입력
            reverseY: true, //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
            transparent: true //+ layer 투명화 여부
        },
        korea_terrain: {
            name: 'korea_terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf', //+ 파일 확장자, *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 15, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            maxprocess: 2, //+ process 최대값
            interpolationheight: true,  //+ 고도보간 기능 사용 여부
        }
    };

    let LayerList = function (Union3D, app) {
        return {
            //이미지레이어
            satellite: new ImageLayer(Union3D, app, LAYER_OPT.satellite),
            hybrid: new ImageLayer(Union3D, app, LAYER_OPT.hybrid),
            //고도레이어
            korea_terrain: new HeightLayer(Union3D, app, LAYER_OPT.korea_terrain)
        }
    }
</script>
<script>
    //라이센스 인증
    GeOnDT.ready(function () {
        //지도 초기화
        window.app = new GeOnDT.U3dAPP({
            containername: 'map'
        });
        app.setHomePosition(126.9395, 37.52, 450, 0, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();

        app.on('change', updatePosData);
        app.createloadingBar('load');
        app.loadingBar();

        //이미지 레이어 생성
        let layers = new LayerList(GeOnDT, app);
        let initLayerList = ['satellite', 'korea_terrain']
        initLayer(initLayerList);

        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayer(list) {
            const basename = list[0];
            GeOnDT.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);

                            app.showLayer(name, true);
                            $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }

        function initU3fModelLayers(name) {
            try {
                let groupLayer = app.createModelGroupLayer({
                    minlevel: 17,
                    maxlevel: 19,
                    name: name
                });
                /* request U3f layers list */
                $.ajax({
                    url: modelU3fURL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let infos = result.params.data;

                    for (let i = 0; i < infos.length; i++) {
                        let info = infos[i];
                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (info.state === "ACTIVE") {
                            let baseName = info.fileName;
                            if(!baseName || baseName ==='')
                                baseName = info.name;
                            let options = {
                                name: info.name,
                                basename: baseName,
                                baseurl: info.baseUrl,
                                useproxy: false,
                                minlevel: info.metaData.minLevel,
                                maxlevel: info.metaData.maxLevel,
                                compressmodel: true,
                                isShareMaterial: false,
                                makeU3FPackage: 1
                            };
                            let subLayer = app.create3DFModelLayer(options);
                            if(subLayer !== false){
                                subLayer.then(function (layer) {
                                    groupLayer.addLayer(subLayer);
                                    if(i === infos.length -1){
                                        console.log("u3f model layer load");
                                        app.showLayer(groupLayer.getName(),true);
                                    }
                                }).fail(function (layer) {

                                });
                            }
                        }
                    }
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }

        initU3fModelLayers();

        $(document).on("click", "#home", function () {
            app.goToHome(2000);
        });
        $(document).on("click", "#asia_mun", function () {
            //아시아문화전당       x: 126.9206, y: 35.1471, z: sampleHeight, rotateX: 2, rotateY: 60},

            var geox = 126.9200;
            var geoy = 35.1470;
            var height = 200
            var rotateLeft = 2;
            var rotateDown = 30;
            app.setCameraGeographicPosition(geox, geoy, height, rotateLeft, rotateDown, undefined, 2000);

            createIndoor('asia_mun')

        });

        $(document).on("click", "#kwangmeong", function () {
            //'광명역'    : {x: 126.8853, y: 37.4163, z: sampleHeight, rotateX: 2, rotateY: 60},
            var geox = 126.884789;
            var geoy = 37.416522;
            var height = 200;
            var rotateLeft = 2;
            var rotateDown = 30;

            app.setCameraGeographicPosition(geox, geoy, height, rotateLeft, rotateDown, undefined, 2000);
            createIndoor('kwangmeong')
        });

        $(document).on("click", "#SEMA", function () {
            // 서울시립미술관 x: 126.9738125, y: 37.5640625
            var geox = 126.9738125;
            var geoy = 37.5640625;
            var height = 200;
            var rotateLeft = 2;
            var rotateDown = 30;

            app.setCameraGeographicPosition(geox, geoy, height, rotateLeft, rotateDown, undefined, 2000);
            createIndoor('SEMA')
        });

        $(document).on("click", "#click", function () {
            var $this = $(this);
            if ($this.hasClass('active')) {
                $this.removeClass('active');
                app.off('click', click);
                app.setPanMode(); //종료시 PanMode 설정
            } else {
                $this.addClass('active');
                app.on('click', click);
            }
        });


        function createIndoor(name) {
            if (name == 'SEMA')
                window.open("indoorSema.html", 'indoor', "width = 1000, height = 1000, top = 100, left = 200");

            else if (name == 'kwangmeong') {
                window.open("indoorGwangmeong.html", 'indoor', "width = 1000, height = 1000, top = 100, left = 200");
            } else if (name == 'asia_mun') {
                window.open("indoorAsiamun.html", 'indoor', "width = 1000, height = 1000, top = 100, left = 200");
            }
        }


        // 클릭한 지점으로 이동
        function click(e) {
            // 마우스 이벤트, 거리오프셋
            app.flyToClick(e, 100);
            var analy = app.getAnalysis('ObjectInfo');
            analy.active();
        }
    });
</script>
</body>
</html>
