<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script id="set-imagelayer">
    let ImageLayer = function (Union3D, app, opt) {
        this._type = "ImageLayer";
        this.layer = undefined;
        this._union3d = Union3D;
        this._app = app;
        this._name = opt.name;
        this.options = opt;
        this.ready = $.Deferred();
    }
    ImageLayer.prototype.create = function () {
        let self = this;
        if (self._name === 'emapbase') {
            self.layer = self._app.createEmapBaseLayer(this.options);
        } else if (self._name === 'emapsat') {
            self.layer = self._app.createEmapSatLayer(this.options);
        } else {
            self.layer = new self._union3d.image.U3dImageXYZLayer(this.options);
            self._app.addLayer(this.layer);
        }
        this.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    ImageLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>
<script id="set-terrain">
    let HeightLayer = function (Union3D, app, opt) {
        this._type = "HeightLayer";
        this.layer = undefined;
        this._app = app;
        if (opt.rectangle === undefined)
            opt.rectangle = Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        this.options = opt;
        this._name = opt.name;
        this.ready = $.Deferred();
    }
    HeightLayer.prototype.create = function () {
        let self = this;
        self.layer = this._app.createHeightXYZLayer(self.options);
        self.layer.then(() => {
            self.ready.resolve();
        }).catch(function () {
            self.ready.reject();
        });
    }
    HeightLayer.prototype.show = function (isShow) {
        let promies = $.Deferred();
        console.log(this.options.name + " 레이어 가시화 " + (isShow ? "시작" : "종료"));
        this._app.showLayer(this.options.name, isShow).then(() => {
            promies.resolve();
        })
        this.isShow = isShow;
        return promies;
    }
</script>

<script>
    var eventList = {
        'all': 'all',
        'app-load': 'app-load',
        'app-searched': 'app-searched',
        'app-loaded': 'app-loaded',
        'app-image-loaded': 'app-image-loaded',
        'app-height-loaded': 'app-height-loaded',
        'app-model-loaded': 'app-model-loaded',
        'app-2km-loaded': 'app-2km-loaded',
        'app-4km-loaded': 'app-4km-loaded'
    };

    window.eventList = eventList;

    if (window.defined == undefined) {
        window.defined = function defined(value) {
            return value !== undefined && value !== null;
        }
    }
    //라이센스 인증
    Union3D.ready(function () {
        var logCount = 1;
        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본 세팅 ////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        var app = new Union3D.U3dAPP({
            containername: 'map'
        });

        window.app = app;
        app.setIntensityLight(0.8); //+ 광도
        app.setHomePosition(126.9395, 37.52, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();


        //+ 이벤트 추가
        var keys = Object.keys(eventList);
        for (var i = 0; i < keys.length; i++) {
            createEvent(keys[i]);
        }
        app.on('change', updatePosData);
        app.createloadingBar('load');
        app.loadingBar();

        //이미지 레이어 생성
        let layers = new LayerList(Union3D, app);
        let initLayerList = ['satellite', 'korea_terrain'];
        initLayar(initLayerList);

        $(document).on('click', '.input-showLayer:input[type=checkbox]', function (e) {
            const $checkbox = $(e.target);
            const name = $checkbox.attr('target');
            checkLayer(name, $checkbox[0].checked);
        });

        function checkLayer(name, checked) {
            if (checked) {
                if (layers[name].layer === undefined) {
                    layers[name].create();
                }
                layers[name].show(true);
            } else {
                layers[name].show(false);
            }
        }

        function initLayar(list) {
            const basename = list[0];
            Union3D.UDEF.createPromise((resolve) => {
                list.forEach((name) => {
                    if (layers[name].layer === undefined) {
                        layers[name].create();
                        layers[name].ready.then(() => {
                            if (name === basename)
                                app.setNameBaseLayer(name);

                            app.showLayer(name, true);
                            $('.input-showLayer:input[target=' + name + ']').prop("checked", true);
                        });
                    }
                });
                resolve(true);
            }).then((resolve) => {
                if (resolve)
                    app.endloadingBar();
            });
        }

        createU3fModelLayers();

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        //////////////////////////////////////////// event 등록 ////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////


        //+ [정보] 버튼 클릭시 동작하는 function
        $(document).on('click', '.info', function (e) {
            console.info('정보');
            var layerName = filterName($("#modellayerList").val());//+ modellayerlist에서 layerName 얻기
            console.info(layerName);
            var layer = app.getLayerByName(layerName);
            if (!defined(layer)) {
                //+ layer가 존재 하지 않을 경우
                alert("[" + layerName + "]" + "가 없습니다.!");
                return;
            }

            if (!defined(window.metalayers[layerName])) {
                alert("[" + layerName + "]" + " 제원정보가 없습니다.!");
                return;
            }

            //+ [레이어명] text 변경
            console.info(window.metalayers[layerName]);
            $("#layer-name").val(window.metalayers[layerName].name);
        });

        //+ [이동] 버튼 클릭시, 해당 layer로 이동
        $(document).on('click', '.move', function (e) {
            //    console.info('이동');
            var layerName = $("#modellayerList").val();
            moveLayer(filterName(layerName)); //+ 해당 layer로 이동
            $('.info').trigger('click'); //+[정보] 버튼 클릭 동작
        });

        //+ modellayerList 변경시 해당 layer로 이동
        $(document).on('change', '#modellayerList', function (e) {
            //   console.info('리스트 변화됨');
            var layerName = filterName($("#modellayerList").val());
            moveLayer(layerName); //+ 해당 Layer로 이동
            $('.info').trigger('click'); //+[정보] 버튼 클릭 동작
        });


        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// function 선언 ////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////


        function getSelectEventName() {
            return $('#eventList').val();
        }

        function isCheckEvent(name) {
            if (getSelectEventName() == 'all')
                return true;

            if (getSelectEventName() == name)
                return true;

            return false;
        }

        //+ event 생성 및 등록
        function createEvent(event) {
            app.on(event, function () {
                if (event == 'app-loaded') {
                    //+ log에 출력
                    writeLog('[' + event + '] ' + 'event call');
                    console.info(event);
                }

                if (event != 'app-loaded' && isCheckEvent(event))
                    console.info(event);
            })

            app.once(event, function () {
                if (event == 'app-loaded') {
                    //+ log에 출력
                    writeLog('[' + event + '] ' + 'once event call');
                    console.info(event);
                }

                // if (event != 'app-loaded' && isCheckEvent(event))
                //      console.info(event);
            })
        }

        //+ event Log에 Log 추가
        function writeLog(text) {
            var log = 'No.' + logCount.toString() + ': ' + text + '\r\n' + $('#event-log').text();
            $('#event-log').text(log);
            logCount++;

        }

        window.metalayers = [];

        //+ u3f model layer 생성
        function createU3fModelLayers() {
            try {
                /* request U3f layers list */
                $.ajax({

                    url: modelU3fURL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let layers = result.params.data;
                    for (let i = 0; i < layers.length; i++) {
                        let layer = layers[i];

                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (layer.state === "ACTIVE") {
                            createModelLayer(layer);
                        }

                        window.metalayers[layer.name] = layer;
                    }
                    //   UnionObj.showLayer(groupLayer.getName(), true);
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }

        var count = 0;
        var createModelLayer = function (info) {
            let baseName = info.fileName;
            if(!baseName || baseName ==='')
                baseName = info.name;
            let options = {
                name: info.name,
                basename: baseName,
                baseurl: info.baseUrl,
                useproxy: false,
                minlevel: info.metaData.minLevel,
                maxlevel: info.metaData.maxLevel,
                compressmodel: true,
                isShareMaterial: false,
                makeU3FPackage: 1
            };

            let subLayer = app.create3DFModelLayer(options);

            subLayer.then(function (layer) {
                app.showLayer(layer.getName(), true).then(function (param) {
                    // console.info(param);
                    // console.info('u3f showlayer then');
                    //+ event log에 layer 생성 event log 추가
                    writeLog('[' + layer.getName() + '] ' + 'layer show event call');
                });
                //+ select bar list 추가
                addSelectOption(count + ':' + subLayer.getName());
                count++;
            }).fail(function (layer) {

            });
            return subLayer;
        }

        //+ model layer name 받아오기
        function filterName(layername) {
            if (defined($("#modellayerList").val())) {
                var name = layername.split(':');
                return name[1];
            }
        }

        //+ 선택한 layer로 이동
        function moveLayer(layerName) {
            console.info(layerName);
            var layer = app.getLayerByName(layerName);
            if (!defined(layer)) {
                alert("[" + layerName + "]" + "가 없습니다.!");
                return;
            }
            var bbox = layer.getBoundingBox();
            if (bbox.max.x === Infinity || bbox.max.y === -Infinity || bbox.min.x === Infinity || bbox.min.y === -Infinity) {
                alert("[" + layerName + "]" + "에 영역정보가 잘못되었습니다!");
                return;
            }
            //+ 중앙 죄표 얻기
            const center = {
                x: (bbox.max.x + bbox.min.x) /2 ,
                y: (bbox.max.y + bbox.min.y) /2
            };

            // app.getWorldToGeographic(center.x, center.y);
            //+ center 좌표로 카메라 이동
            app.setCameraWorldPosition({x: center.x, y: center.y, z: bbox.max.z + 500, rotateX: 2, rotateY: 30});
        }

        //+ select bar 항목 추가
        function addSelectOption(componentName) {
            var $select = $('.layer-list').find("select[name=name]");
            $select.append("<option value=" + componentName + ">" + componentName + "</option>");
        }

        //+ select bar 항목 제거
        function removeSelectOption(componentName) {
            var $select = $('.layer-list').find("select[name=name]");
            $select.find("option[value=" + componentName + "]").remove();
        }

    });
</script>
</body>
</html>
