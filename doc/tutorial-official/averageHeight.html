<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    Union3D.ready(function () {
        //지도 기본 세팅///////////////////////////////////////
        window.app = new Union3D.U3dAPP({
            containername: 'map',
            maxprocess: 20
        });
        window.app = app;
        app.setHomePosition(126.9395, 37.52, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();
        app.createloadingBar('load');
        app.on('change', updatePosData);

        //이미지 레이어 생성 //////////////////////////////////////////////////////
        let layer = new Union3D.image.U3dImageXYZLayer({
            name: 'satellite',
            baseurl: layerInfo.image.vworldsaturl,
            reverseY: true
        });
        app.addLayer(layer);
        //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.
        app.setNameBaseLayer('satellite');
        app.showLayer('satellite', true);
        app.endloadingBar();

        //+ U3f 모델 건물 ///////////////////////////////////////////////////////
        createU3fModelLayers();

        //고도 레이어 생성 /////////////////////////////////////////////////////
        var terrainLayer = new Union3D.terrain.U3dHeightXYZLayer({
            name: 'Korea Terrain',  //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
            ext: '.umf',  //+ 파일 확장자, *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
            minlevel: 9, //+ 가시화 최소 레벨
            maxlevel: 15, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            maxprocess: 2, //+ process 최대값
            interpolationheight: true,  //+ 고도보간 기능 사용 여부
            rectangle: Union3D.UMathEngine.getGoogleRectangleDefine(3, 2, 2) //+ 구글맵 타일 인덱스 번호(x, y, 레벨)로 해당 타일의 영역정보를 반환하는 함수
        });
        app.addLayer(terrainLayer);
        app.showLayer('Korea Terrain', true);

        //평균높이 분석모드 설정 //////////////////////////////////////////////////////
        let analy = app.getAnalysis("AverageHeight");
        analy.active();
        window.analy = analy;
        ////////////////////////////////////////////////////////////////////
        // 화면 클릭/더블클릭 이벤트
        app.on('click', addSelectedList);

        function addSelectedList() {
            // 분석모드 활성시
            if (analy.isActive()) {
                let $list = $('.selected-list');
                $list.empty();

                let selector = analy.getSelector();
                let keys = selector.getSelectedKey();

                if (keys.length !== 0)
                    $('.list-info').css('display', 'none');

                const uidList = [];
                for (let i = 0; i < keys.length; i++) {
                    let key = keys[i];
                    const infos = analy.getSelectedModelHeight(key);
                    if(!infos || infos.length ===0) continue;
                    infos.forEach( info => {
                        if(!uidList.includes(info.id)){
                            $list.append(`<li><span> ${key} : ${info.height.toFixed(3)}m </span> </li>`);
                            uidList.push(info.id);
                        }
                    })
                }
            }
        }

        //선택모드 설정 (클릭으로 선택 / 영역으로 선택)
        $(document).on('change', 'select[name="mode"]', function () {
            analy.setSelectType(this.value); //선택 방식을 설정하는 함수
        });

        // 선택 초기화 버튼
        $(document).on('click', '.btn-select-clear', function () {
            analy.clear();
            let $list = $('.selected-list');
            $list.empty();
            $('.list-info').css('display', 'block');
        });

        // 평균 높이 분석 / 분석 종료 선택
        $(document).on('change', 'input[name="analy"]', function () {
            if (this.value !== 'close') {
                $('#calc').attr('disabled', false);
                analy.active();
            } else {
                $('#calc').attr('disabled', true);
                analy.deactive();
            }
        });

        //평균높이 계산
        $(document).on('click', '#calc', function () {
            const result = analy.getAverageHeight();
            console.log(analy.getCalcResult());
            $('#average').val(result + 'm');
        });

    });

    function createU3fModelLayers() {
        try {
            /* request U3f layers list */
            $.ajax({
                url: modelU3fURL,
                crossDomain: true,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                },
                error: function (e) {
                    console.info(e);
                }
            }).then(function (result) {
                let layers = result.params.data;

                for (let i = 0; i < layers.length; i++) {
                    let layer = layers[i];

                    /* 레이어 목록 중 발행중인 레이어만 요청 */
                    if (layer.state === "ACTIVE") {
                        if (layer.name.indexOf('kopss') !== -1) {
                            createModelLayer(layer, null, 1000)
                        } else {
                            createModelLayer(layer, null)
                        }
                    }
                    window.metalayers[layer.name] = layer;
                }
                //   UnionObj.showLayer(groupLayer.getName(), true);
            })
        } catch (localBuldError) {
            console.log('Initialize Error Message : ' + localBuldError);
        }
    }

    var modelayers = undefined;
    let maxprocess_model_ = 10;
    let sizeblock_model_ = 10;
    let updateimagedistance_ = 50;
    var count = 0;
    window.metalayers = {};
    window.modelayers = modelayers;
    var createModelLayer = function (info, groupLayer, wrapping) {
        var deferInitialized = $.Deferred();
        let metaData = info.metaData;
        let subLayerName = info.name;
        let buldLayerConstruct = {};
        Object.assign(buldLayerConstruct, {name: subLayerName}); //+ U3F 3D 모델 레이어 이름, *필수 입력
        Object.assign(buldLayerConstruct, {basename: subLayerName}); //+ U3F 데이터dml 정보가 있는 U3G 파일 이름, *필수 입력
        Object.assign(buldLayerConstruct, {baseurl: info.baseUrl}); //+ U3F 데이터 경로의 기본 URL, *필수 입력
        Object.assign(buldLayerConstruct, {minlevel: metaData.minLevel}); //+ 가시화 최소레벨
        Object.assign(buldLayerConstruct, {maxlevel: metaData.maxLevel}); //+ 가시화 최대레벨
        Object.assign(buldLayerConstruct, {srs: metaData.srs});
        Object.assign(buldLayerConstruct, {ext: '.' + metaData.ext}); //+ 건물 이미지 포맷, defaultValue(opt.ext, '.u3f');
        Object.assign(buldLayerConstruct, {maxprocess: maxprocess_model_}); //+ 최대 process 값
        Object.assign(buldLayerConstruct, {sizeblock: sizeblock_model_}); //+ one per block model size, defaultValue(opt.sizeblockmodel, 1);
        Object.assign(buldLayerConstruct, {updateimagedistance: updateimagedistance_}); //+ 건물 이미지 갱신 거리
        Object.assign(buldLayerConstruct, {grouplayer: groupLayer}); //+ 그룹레이어
        Object.assign(buldLayerConstruct, {wrapping: wrapping}); //+ 텍스처가 래핑되는 방식 defaultValue(opt.wrapping, THREE.ClampToEdgeWrapping);
        Object.assign(buldLayerConstruct, {renderorder: 0}); //+ 렌더링 순서, 숫자가 클수록 앞에 나온다
        Object.assign(buldLayerConstruct, {useproxy: false}); //+ 프록시 사용 여부, defaultValue(opt.useproxy, false);
        let subLayer = app.create3DFModelLayer(buldLayerConstruct);
        subLayer.then(function (layer) {
            app.showLayer(layer.getName(), true);
            count++;
        }).fail(function (layer) {

        });
        modelayers = modelayers || [];
        modelayers.push(subLayer);
        return subLayer;
    }
</script>
