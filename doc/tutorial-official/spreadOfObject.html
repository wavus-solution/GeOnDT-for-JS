<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    //라이센스 인증
    Union3D.ready(function () {
        let PARAM = {
            'colorStart': $('input[name="colorStart"]').val(),
            'colorEnd': $('input[name="colorEnd"]').val(),

        let dataUrl = dataServerUrl + '/poi_image/';

                colorTween: [[0.1, 3], [PARAM.colorStart, PARAM.colorEnd]], // timeArray, colorArray

                particlesPerSecond: 1000,

                emitterDeathAge: 10

            "rain": {

                posSpreadX: 500,
                posSpreadY: 500,
                posSpreadZ: 10,

                velocityX: 0,
                velocityY: 0,
                velocityZ: -400,

                velSpreadX: 10,
                velSpreadY: 10,
                velSpreadZ: 50,


                accelerationX: 0,
                accelerationY: 0,
                accelerationZ: -10,

                particleImage: dataUrl + 'raindrop2flip.png',

                angleBase: 0,
                angleSpread: 0,
                angleVelocityBase: 0,
                angleVelocitySpread: 0,

                sizeBase: 8.0,
                sizeSpread: 4.0,
                colorBase: {x: 0.66, y: 1.0, z: 0.7}, // H,S,L
                colorSpread: {x: 0.00, y: 0.0, z: 0.2},
                opacityBase: 0.6,

                particlesPerSecond: 500,
                particleDeathAge: 1.0,
                emitterDeathAge: 60
            },
            "snow": {

                posSpreadX: 1000,
                posSpreadY: 1000,
                posSpreadZ: 50,

                velocityX: 0,
                velocityY: 0,
                velocityZ: -40,

                velSpreadX: 50,
                velSpreadY: 50,
                velSpreadZ: 20,


                accelerationX: 0,
                accelerationY: 0,
                accelerationZ: -10,

                particleImage: dataUrl + 'snowflake.png',

                angleBase: 0,
                angleSpread: 720,
                angleVelocityBase: 0,
                angleVelocitySpread: 60,

                sizeTween: [[0, 0.25], [5, 15]], // timeArray, sizeArray
                opacityTween: [[2, 3], [0.8, 0]], // timeArray, opacityArray
                colorBase: {x: 0.66, y: 1.0, z: 0.9}, // H,S,L

                particlesPerSecond: 200,
                particleDeathAge: 4.0,
                emitterDeathAge: 60
            }

        }

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        var app = new Union3D.U3dAPP({
            searchtype: 'sphere',//+ 타일검색 방법
            containername: 'map' //+ U3dApp(지도영역)의 div ID, *필수 입력
        });
        window.app = app;
        app.setHomePosition(126.92757486832318, 37.51936537240114, 450, 2, 60); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition();
        app.createloadingBar('load');
        app.on('change', updatePosData);

        //이미지 레이어 생성
        var layer = new Union3D.image.U3dImageXYZLayer({
            name: 'satellite',  //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            baseurl: layerInfo.image.vworldsaturl,  //+ 이미지 데이터 URL, *필수 입력
            reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        });
        app.addLayer(layer);
        //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.
        app.setNameBaseLayer('satellite');
        app.showLayer('satellite', true);
        app.endloadingBar();

        //+ u3f 모델 //////////////////////////////////////////////
        initModelLayers();

        var terrainLayer = new Union3D.terrain.U3dHeightXYZLayer({

            ext: '.umf', //+ 파일 확장자,  *필수 입력
            reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false), *필수 입력
            minlevel: 9,  //+ 가시화 최소 레벨
            maxlevel: 15, //+ 가시화 최대 레벨
            useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)

                app.on('click', clickFunc);
            } else if (target === 'idle') {

                //+ 마우스 클릭 event 제거
                isActive = false;
                app.off('click', clickFunc)
            } else if(target === 'diffusion'|| (target === 'rain') || (target === 'snow')){

            let velocityBase = {
                x: PARAM.velocityX,
                y: PARAM.velocityY,

            }
            let velocitySpread = {
                x: PARAM.velSpreadX,
                y: PARAM.velSpreadY,

            }

                x: PARAM.accelerationX,

            }


            if (type == 'diffusion')
                position.z += 10;
            else if (type == 'rain' || type == 'snow')

            let opt = {
                position: position, // 위치 초기값
                positionSpread: positionSpread, // 초기값 + 범위값 - 초기 위치에서 범위안의 값으로 무작위 생성
                velocityBase: velocityBase, // 초기 속도 및 방향 설정

                angleBase: options[type].angleBase, // 초기 회전값 - 생성 될 때의 회전값

                angleVelocityBase: options[type].angleVelocityBase, // 초기 회전 속도 설정
                angleVelocitySpread: options[type].angleVelocitySpread,// 초기 회전 속도 + 범위 - 초기 회전 속도에서 범위안에 무작위 값으로 생성

                opacityTween: [[0, options[type].particleDeathAge], [0.88, 0.01]],
                sizeTween: [[0, options[type].particleDeathAge], [50, 200]],
                colorTween: [[0, options[type].particleDeathAge], [PARAM.colorStart, PARAM.colorEnd]],

                /**
                 * sizeTween과 opacityTween의 timeArray와 sizeArray는 시간이 흐름에 따라 크기와 불투명도가 어떻게 변화하는지를 제어하는 역할을 합니다.
                 * colorTween도 동일하게 시간의 흐름의따라 해당 색상으로 점차 변화하는 값을 지정해주는 속성값입니다.
                 * sizeTween의 예를 살펴보면:
                 *
                 * timeArray는 특정 시간 지점을 나타내고, sizeArray는 해당 시간에 도달했을 때 객체의 크기를 나타냅니다.
                 * 예를 들어, timeArray[0] = 0초이고 sizeArray[0] = 100이라면, 0초부터 크기가 100이 됩니다.
                 * 현재 사용 중인 grid type에서는 0(sizeTween[0][0]의 값)초에서 3(sizeTween[0][1]의 값)초 사이에 크기가 100(sizeTween[1][0])값에서 200(sizeTween[1][1])으로 등비에 따라 증가합니다. ( 100 ~ 200의 크기로 0 ~ 3초까지의 크기변화를 나타냅니다. )

                 * 이 경우 3초 동안 100의 크기 차이가 나며, 이는 초당 33.33...(100/3)씩 증가하게 됩니다.
                 *         즉, timeArray와 sizeArray는 시간별로 크기가 어떻게 변하는지를 정의하고, 각 구간의 크기 변화 속도는 두 지점 사이의 크기 차이를 두 시간 간격으로 나누어 계산됩니다.
                 *         particleDeathAge의 값이 timeArray의 최대값이고 해당 값까지 크기가 등비로 조정됩니다.
                 *       ex) particleDeathAge 3일경우 해당 수치들은 3초 일때의 해당하는 값까지만 적용이 됩니다. ( timeArray의 값이 3보다 큰 경우 무시됨 )
                 */


                particlesPerSecond: options[type].particlesPerSecond, // 초당 생성 갯수
                particleDeathAge: options[type].particleDeathAge, // 확산객체의 생명주기 최대값 해당 수치가 되면 재생성
                emitterDeathAge: options[type].emitterDeathAge, // 확산객체 모델의 재생 시간
                speed: 0.1, // 재생 속도
                // speed:param.speed
            }
            if (type == 'rain') {
                opt.sizeBase = options[type].sizeBase;
                opt.sizeSpread = options[type].sizeSpread;
                opt.colorBase = options[type].colorBase;
                opt.colorSpread = options[type].colorSpread;
                opt.opacityBase = options[type].opacityBase;

                opt.sizeTween = undefined;
                opt.colorTween = undefined;
                opt.opacityTween = undefined;

            }
            if (type == 'snow') {

                opt.colorBase = options[type].colorBase;
                opt.sizeTween = options[type].sizeTween;
                opt.opacityTween = options[type].opacityTween;
                opt.colorTween = undefined;

            }

            //opt = Object.assign(opt, options[type]);
            console.log(opt);
            analy.initialize(opt);
            analy.active();

        }

        function createSampleSpread(point, param) {

        function setParam(option) {
            var param = {};
            $('.param').each(function (i, v) {
                if (v.value === undefined || v.value === '') return;
                var value = option[v.name];
                if (option.type === 'number') {
                    value = Number(value);
                }
                param[v.name] = value;
                v.value = value;
            });
            param['colorStart'] = $('input[name="colorStart"]').val();
            param['colorEnd'] = $('input[name="colorEnd"]').val();
            PARAM = param;

        }

        function getParam() {
            var param = {};
            $('.param').each(function (i, v) {
                if (v.value === undefined || v.value === '') return;
                var value;
                if (v.type === 'number') {
                    value = Number(v.value);
                } else {
                    value = v.value;
                }
                param[v.name] = value;

            });
            param['colorStart'] = $('input[name="colorStart"]').val();
            param['colorEnd'] = $('input[name="colorEnd"]').val();
            PARAM = param;

        }

        window.metalayers = {};

        function initModelLayers() {
            try {
                let modelayers = app.createModelGroupLayer({
                    maxlevel: 19,
                    minlevel: 17,
                    name: 'u3f'
                });
                /* request U3f layers list */
                $.ajax({
                    url: modelU3fURL,
                    crossDomain: true,
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader('User-Authorization', trdDimAPIKey);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
                    },
                    error: function (e) {
                        console.info(e);
                    }
                }).then(function (result) {
                    let maxprocess_model_ = 10;
                    let sizeblock_model_ = 10;
                    let updateimagedistance_ = 50;
                    let wrapping = undefined;
                    let infos = result.params.data;

                    for (let i = 0; i < infos.length; i++) {
                        let info = infos[i];
                        /* 레이어 목록 중 발행중인 레이어만 요청 */
                        if (info.state === "ACTIVE") {
                            let metaData = info.metaData;
                            let subLayerName = info.name;
                            let buldLayerConstruct = {};
                            Object.assign(buldLayerConstruct, {name: subLayerName});
                            Object.assign(buldLayerConstruct, {basename: subLayerName});
                            Object.assign(buldLayerConstruct, {baseurl: info.baseUrl});
                            Object.assign(buldLayerConstruct, {minlevel: metaData.minLevel});
                            Object.assign(buldLayerConstruct, {maxlevel: metaData.maxLevel});
                            Object.assign(buldLayerConstruct, {srs: metaData.srs});
                            Object.assign(buldLayerConstruct, {ext: '.' + metaData.ext});
                            Object.assign(buldLayerConstruct, {maxprocess: maxprocess_model_});
                            Object.assign(buldLayerConstruct, {sizeblock: sizeblock_model_});
                            Object.assign(buldLayerConstruct, {updateimagedistance: updateimagedistance_});
                            Object.assign(buldLayerConstruct, {grouplayer: modelayers});
                            Object.assign(buldLayerConstruct, {wrapping: wrapping});
                            Object.assign(buldLayerConstruct, {renderorder: 0});
                            Object.assign(buldLayerConstruct, {useproxy: false});
                            let subLayer = app.create3DFModelLayer(buldLayerConstruct);
                            if (subLayer !== false) {
                                subLayer.then(function (layer) {
                                    modelayers.addLayer(subLayer);
                                    if (i === infos.length - 1) {
                                        console.log("u3f model layer load");
                                        app.showLayer(modelayers.getName(), true);
                                    }
                                }).fail(function (layer) {

                                });
                            }
                        }
                        window.metalayers[info.name] = info;
                    }
                })
            } catch (localBuldError) {
                console.log('Initialize Error Message : ' + localBuldError);
            }
        }


        const ROTATION_VALUE = 1; //회전 offset
        $(document).on('click', '.control', function (e) {
            let particles = app._particles; //선택된 광원

            if (particles.length === 0) {
                return;
            }

            const id = $(e.target).attr('id');
            switch (id) {
                case 'left-velocity':
                    changeParticleVelocity('x', -ROTATION_VALUE)
                    break;
                case 'right-velocity':
                    changeParticleVelocity('x', ROTATION_VALUE)
                    break;
                case 'up-velocity':
                    changeParticleVelocity('y', ROTATION_VALUE)
                    break;
                case 'down-velocity':
                    changeParticleVelocity('y', -ROTATION_VALUE)
                    break;

                case 'z-up-velocity':
                    changeParticleVelocity('z', ROTATION_VALUE)
                    break;
                case 'z-down-velocity':
                    changeParticleVelocity('z', -ROTATION_VALUE)
                    break;


            }
        });

        function changeParticleVelocity(dir, velocity) {
            if (dir == undefined || velocity == undefined) return;
            let particles = app._particles;

            if (particles.length === 0) {
                return;
            }
            particles.forEach(function (particle) {
                particle.velocityBase[dir] = velocity * Math.abs(particle.velocityBase[dir]);
                particle.particleArray.forEach(function (part) {
                    part.velocity[dir] = velocity * Math.abs(part.velocity[dir]);
                })
            })
        }
