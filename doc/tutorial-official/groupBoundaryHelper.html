    <p class="lead">
        여러 이동 객체의 분포와 대형 변화를 하나의 3차원 경계 영역으로 가시화하는 예제입니다.<br>
        객체들이 회전하거나 퍼졌다 모이고, 상승하거나 서로 멀어졌다 다시 가까워질 때
        경계 영역이 움직임을 따라 변형되며 자연스럽게 분리되고 합쳐지는 모습을 확인할 수 있습니다.<br>
        V자, 십자, 화살표와 나선처럼 오목하거나 높이 차가 있는 대형에서도 배치의 특징이
        경계 형상에 어떻게 표현되는지 함께 보여줍니다.
