            height: 100%;
            width: 100%;

            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 2;

        #map2 {
            height: 100%;
            width: 100%;
            position: absolute;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;
        }

        #map3 {
            height: 100%;
            width: 100%;
            position: absolute;
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 2;
            grid-row-end: 3;
        }

        #map4 {
            height: 100%;
            width: 100%;
            position: absolute;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
        }

        .label {
            position: absolute;
            top: 5px;
            left: 5px;
        }

<script id="execute-event">
    var strings = document.location.href.split('/');
    $('.execute-popup').click(function () {
        window.open('./runner.html?url=' + strings[strings.length - 1] + '&title=' + document.title);
    })
</script>
<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    Union3D.ready(function () {

        var app1 = createApp('map1');  //+ 좌측상단 맵
        var app2 = createApp('map2'); //+ 우측상단 맵
        var app3 = createApp('map3'); //+ 좌측하단 맵
        var app4 = createApp('map4'); //+ 우측하단 맵

        //app1의 조작이 app2와 연동된다.
        var listener12Id = app1.syncCamera(app2);
        //app1의 조작이 app3와 연동된다. 5배 떨어진 카메라 동기화
        var listener13Id = app1.syncCamera(app3, 5);
        //app1의 조작이 app4와 연동된다.
        var listener14Id = app1.syncCamera(app4);

        //app1 <-> app4 연동 해제
        app1.unkey('change', listener14Id);

        //+ App 생성
        function createApp(containerName) {
            var app = new Union3D.U3dAPP({
                containername: containerName
            });

            app.setHomePosition(126.9395, 37.525, 5000, 2, 10); //경도, 위도, 높이, 방위각, 고도각
            app.updateHomePosition();
            app.createloadingBar('load');
            app.on('change', updatePosData);
            window.app = app;
            //이미지 레이어 생성
            var layer = new Union3D.image.U3dImageXYZLayer({
                name: 'satellite', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
                baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
                reverseY: true //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
            });
            app.addLayer(layer);
            //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.
            app.setNameBaseLayer('satellite'); //+ 배경이미지 레이어 설정
            app.showLayer('satellite', true);
            app.endloadingBar();

            return app;
        }

        //+ Emap 위성 Layer 생성
        function createEmapSatLayer(name, app) {
            var maxprocess_image = 5;
            var key = 'emapsat';
            var geoextent = [124.281252, 33.276145, 129.563837, 38.593601];
            var opt = {
                name: name //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
                , maxprocess: maxprocess_image  //+ 최대 process 값
                , useProxy: true //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
                , geoextent: geoextent //+ 영역, defaultValue(opt.geoextent, getEmapGeoExtent_());
            }

            opt = Object.assign(opt, {
                reverseY: true  //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
                , useproxy: true //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
                , xyorder: "xy"  //+ Col Row 순서, defaultValue(opt.xyorder, 'xy');
            });

            return app.createEmapSatLayer(opt);
        }
    });
</script>
