<script id="ui-event">
    const homePositon = {lat: 126.9395, lon: 37.52, height: 450, left: 2, down: 60}

    $(document).on('mouseover', '.info-box', function (e) {
        $('.ex-explanation').show();
    });

    $(document).on('mouseout', '.info-box', function (e) {
        $('.ex-explanation').hide();
    });

    $(document).on('click', '#left-menu-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            openLeftMenu(true);
        else
            openLeftMenu(false);
    });

    function openLeftMenu(isOpen) {
        if (isOpen) {
            $('#div-left-menu').css('width', '350px');
            $('.left-menu-bnt-img').css('rotate', '180deg');
            $('#analy-popup').show();
        } else {
            $('#div-left-menu').css('width', '0');
            $('.left-menu-bnt-img').css('rotate', '0deg');
            $('#analy-popup').hide();
        }
    }

    $(document).on('click', '#analy-bnt', function (e) {
        $(this).toggleClass('active');
        if ($(this).hasClass('active'))
            $('#analy-popup').show();
        else
            $('#analy-popup').hide();
    });

    $(document).on('click', '#compass-image-id', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.alignNorth();
    });

    $(document).on('click', '.sub-category-tile', function (event) {
        if ($(this).hasClass('anlay')) return;

        event.preventDefault();
        if (app === undefined) return;
        let content = $(this).next();
        let btn = $(this).children()[1].children;
        $(this).toggleClass("active")
        if ($(this).hasClass("active")) {
            content.css("height", "100px");
            content.css("overflow", "auto");
            $(btn).children().css('rotate', '180deg');
        } else {
            content.css("height", "0");
            content.css("overflow", "hidden");
            $(btn).children().css('rotate', '0deg');
        }
    });

    $(document).on('click', '#right-tbar-btn-zoomin', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomIn();
    });

    $(document).on('click', '#right-tbar-btn-zoomout', function (event) {
        event.preventDefault();
        if (app === undefined) return;
        app.zoomOut();
    });
    $(document).on('click', "#right-tbar-btn-flyto", function () {
        app.flyTo({x: homePositon.lat, y: homePositon.lon}, 2000);
    });

    function updatePosData() {
        if (app === undefined) return;

        const info = app.getCameraState();
        const rad = info.azimuth;
        app.setRotationOverviewMap(rad);
        app.setGeoCenterToOverviewMap(info.center.x, info.center.y);

        //나침반 설정
        const value = 'rotate(' + -rad + 'rad)';
        $('#compass-image-id').css({transform: value});

        let deg = -rad * 180 / Math.PI;
        if (deg < 0) {
            deg += 360;
        }
        const angle = '각도: ' + deg.toFixed(0) + '°';
        $('#bottom-tbar-btn-angle').val(angle);

        const pos = '위경도: ' + parseFloat(info.center.y).toFixed(3) + '°, ' + parseFloat(info.center.x).toFixed(3) + '°';
        $('#bottom-tbar-btn-pos').val(pos);

        const height = '높이: ' + parseFloat(info.camera.z).toFixed(1) + 'm';
        $('#bottom-tbar-btn-height').val(height);
    }

    $(function () {
        $('#analy-popup').draggable();
        $('.popup-exit').on('click', function () {
            if ($('#analy-bnt').hasClass('active')) {
                $('#analy-popup').hide();
                $('#analy-bnt').removeClass('active');
            } else {
                $('#analy-popup').show();
                $('#analy-bnt').addClass('active');
            }

        });
    });

    $(document).on('mouseover', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().show();
    });

    $(document).on('mouseout', ".menu-btn", function (e) {
        e.preventDefault()
        $(this).next().hide();
    });

</script>
<script>
    var defined = defined || {};
    defined = function (value) {
        return value !== undefined && value !== null;
    }

    //+ 라이센스 인증
    Union3D.ready(function () {
        var layers = {};
        //레이어 생성자 옵션
        var LAYER_OPT = {
            //+ 고도////////////////////////////////////////////////////////
            korea_terrain: {
                name: 'korea_terrain', //+ 레이어 이름, defaultValue(opt.name, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
                baseurl: layerInfo.height.url, //+ 고도 데이터 기본 URL, *필수 입력
                ext: '.umf', //+ 파일 확장자, *필수 입력
                reverseY: true, //+ X축 반전 여부, defaultValue(opt.reverseY, false)
                minlevel: 9,  //+ 가시화 최소 레벨
                maxlevel: 17, //+ 가시화 최대 레벨
                useproxy: false //+ 프록시 사용 여부, defaultValue(opt.useproxy, faLse)
            },

            //+ 건물 ///////////////////////////////////////////////////////
            u3f: {
                name: 'u3f', //+ U3F 3D 모델 레이어 이름, *필수 입력
                useproxy: false, //+ 프록시 사용 여부, defaultValue(opt.useproxy, false);
                baseurl: layerInfo.model.busanu3furl, //+ U3F 데이터 경로의 기본 URL, *필수 입력
                basename: layerInfo.model.busanu3fname, //+ U3F 데이터dml 정보가 있는 U3G 파일 이름, *필수 입력
                minlevel: 17,  //+ 가시화 최소레벨
                maxlevel: 17,  //+ 가시화 최대레벨
                opacity: 1  //+ 투명화 여부 true 일 경우, 투명도 설정값으로 적용
            }
        };

        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        ///////////////////////////////////////// 지도 기본세팅 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        let app = new Union3D.U3dAPP({
            methodheight: '1_0', //+ 지형처리방법
            containername: 'map',  //+ U3dApp(지도영역)의 div ID, *필수 입력
        });

        window.app = app;
        window.THREE = app._THREE;
        let targetList = [];
        let targetType;
        //+ 처음카메라 위치 조정 (부산)
        app.setHomePosition(129.146, 35.162, 435, 0, 45); //경도, 위도, 높이, 방위각, 고도각
        app.updateHomePosition().then(function () {
            //+ 카메라 지하 이동 가능
            app.setUnderGroundMode();
        });
        app.createloadingBar('load');
        app.on('change', updatePosData);

        //+ analysis Depth 활성화
        var analy = app.getAnalysis('Depth');
        analy.active();
        //+ 격자 이미지 설정 setGridSpriteImage( image_Url, size, opacity )
        //+ 거리측정 목록 새로고침 이벤트 분석모드에 이벤트 등록
        //analy.passToClickEvent(printDistanceList);
        analy.on('end', function (e) {
            printDistanceList()
        })

        //+ 이미지
        var layer = new Union3D.image.U3dImageXYZLayer({
            name: 'satellite', //+ 레이어 이름, defaultValue(opt.naem, Guid()) : 임의의 문자열을 생성하는 함수. @return {string}
            baseurl: layerInfo.image.vworldsaturl, //+ 이미지 데이터 URL, *필수 입력
            reverseY: true  //+ Y축 반전 여부, defaultValue(opt.reverseY, false)
        });
        app.addLayer(layer);

        //APP에 배경이미지 레이어를 필수로 설정해 주어야한다.
        app.setNameBaseLayer('satellite');
        app.showLayer('satellite', true);
        app.endloadingBar();

        //+ 고도
        createLayer('korea_terrain');
        app.showLayer('korea_terrain', true);

        //+ 건물
        createLayer('u3f');
        app.showLayer('u3f', true);

        layer = new Union3D.model.U3dModelWFSLayer({
            name: 'UDG_CNTS_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            layername: 'UDG_CNTS_LI', //+ 레이어 이름, *필수 입력
            baseurl: layerInfo.wfs_korea.baseurl,  //+ baseurl, *필수 입력
            minlevel: 17, //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
            drawline: false, //+ WFS 모델에 테투리 추가 여부
            useterrain: false, //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
            version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
            useproxy: true, //+ 프록시 사용 여부
            color: '#FFD817', //+ WFS model 색상
            piperadius: 0.5, // 파이프 직경
            featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
            heightFunction: function (feature){
                return -20;
            }
        });
        app.addLayer(layer);
        layer.then((layer)=>{
            app.showLayer(layer.getName(),true);
        });

        layer = new Union3D.model.U3dModelWFSLayer({
            name: 'UDG_DRASY_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            layername: 'UDG_DRASY_LI', //+ 레이어 이름, *필수 입력
            baseurl: layerInfo.wfs_korea.baseurl,  //+ baseurl, *필수 입력
            minlevel: 17,  //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
            drawline: false,  //+ WFS 모델에 테투리 추가 여부
            useterrain: false,  //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
            version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
            useproxy: true, //+ 프록시 사용 여부
            color: '#FF851C', //+ WFS model 색상
            piperadius: 0.5, // 파이프 직경
            featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
            heightFunction: function (feature){
                return -30;
            }
        });
        app.addLayer(layer);
        layer.then((layer)=>{
            app.showLayer(layer.getName(),true);
        });

        layer = new Union3D.model.U3dModelWFSLayer({
            name: 'UDG_SWDPI_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            layername: 'UDG_SWDPI_LI', //+ 레이어 이름, *필수 입력
            baseurl: layerInfo.wfs_korea.baseurl, //+ baseurl, *필수 입력
            minlevel: 17, //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
            drawline: false, //+ WFS 모델에 테투리 추가 여부
            useterrain: false, //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
            version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
            useproxy: true, //+ 프록시 사용 여부
            color: '#2DE0AE', //+ WFS model 색상
            piperadius: 0.5, // 파이프 직경
            featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
            heightFunction: function (feature) {
                //피쳐 개별의 속성을 확인하여 고도값을 다르게 적용할 수 있습니다.
                if (feature.properties.regu_cd === "26410100")
                    return -30
                else
                    return -20;
            }
        })
        app.addLayer(layer);
        layer.then((layer)=>{
            app.showLayer(layer.getName(),true);
        });

        layer = new Union3D.model.U3dModelWFSLayer({
            name: 'UDG_SWPI_LI', //+ WFS 3D 모델 레이어 이름, defaultValue(opt.name, Guid())  : 임의의 문자열을 생성하는 함수. @return {string}, *필수 입력
            layername: 'UDG_SWPI_LI', //+ 레이어 이름, *필수 입력
            baseurl: layerInfo.wfs_korea.baseurl,  //+ baseurl, *필수 입력
            minlevel: 17,  //+ 가시화 최소레벨, defaultValue(opt.minlevel, 17)
            drawline: false, //+ WFS 모델에 테투리 추가 여부
            useterrain: false,  //+ WFS 고도정보 사용 여부, defaultValue(opt.useterrain, true);
            version: '1.0.0', //+ WFS 서비스 버전, defaultValue(opt.version, '1.1.0')
            useproxy: true, //+ 프록시 사용 여부
            color: '#4DB8DB', //+ WFS model 색상
            piperadius: 0.5, // 파이프 직경
            featureType: '3d', // 출력 형태 (3d => 파이프 , 2d => 라인)
            heightFunction: function (feature){
                // feature의 coordinates 높이값 개별로 입력하면 개별 정점 마다 높이가 적용 됩니다.
                const coordinates = feature.geometry.coordinates;
                for (let line of coordinates) {
                    for(let vertex of line){
                        if(vertex[2])
                            vertex[2] = -20;
                        else
                            vertex.push(-20);
                    }
                }
                return 0;
            }
        })
        app.addLayer(layer);
        layer.then((layer)=>{
            app.showLayer(layer.getName(),true);
        });

        initSlider('opacity');
        app.setEnableOpacityImageLayers(true);
        app.setOpacityImageLayers(0.5);
        $('#opacity').slider("value", 0.5);
        $('#opacity-handle').text(0.5);

        initSlider('m-opacity');
        addSelctOtion();
        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////// 이벤트 등록 /////////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////

        //+ 가이드라인 선택
        //+ 확장형 (extension) : 해당 지점의 높이, 밑점의 높이, 두 점사이의 거리 표시
        //+ 기본형 (base) : 두 점 사이의 거리만 표시
        $(document).on('click', '.basic', function (e) {
            var target = e.target.value;
            analy.setType(target);
        });

        const labelVisibility = { // 라벨 가시화 설정
            bottom: true, // 지표면 고도값 라벨
            vertical: true, // 사용자가 지정한 위치에서 지표면과의 수직 거리
            base: true, // 사용자가 지정한 위치의 고도 값
            distance: true // 사용자가 지정한 위치들 사이의 거리
        }

        //+ [라벨 가시화] 거리의 수치를 나타내는 라벨의 가시화를 설정 (기본값 [true, true, true, true])
        //+ setLabelVisibility (valueList) - valueList는 Array 타입 ( length = 4 )
        //+ valueList = [ 지표면의 고도값 라벨, 사용자가 지정한 위치에서 지표면과의 수직 거리, 사용자가 지정한 위치의 고도 값, 사용자가 지정한 위치들 사이의 거리 ]
        $(document).on('change', '.showLabel', function (e) {
            const key = e.target.value;
            labelVisibility[key] = e.target.checked;
            const valueList = Object.values(labelVisibility);
            analy.setLabelVisibility(valueList);
        });

        //+ [삭제] 버튼 클릭시 해당 POI GROUP 삭제
        $(document).on("click", ".btn-poi-remove", function (e) {
            var target = e.target.id;
            analy.removePOI(target);
        });
        //+ [전체지우기] 버튼 클릭시 목록, 맵상에 그려진 POI 전체 지우기
        $(document).on("click", ".btn-remove-all", function (e) {
            analy.clear();
        });

        //+ | 위경도 좌표로 추가하기 |
        //+ [추가] 버튼 / 첫점과 끝점의 위경도 및 높이를 입력 받아 지도상에 결과값 출력
        $(document).on("click", ".btn-coordi-add", function (e) {

            //+ 첫 점의 경도
            var x1 = Number($('input[name="x-coordi-first"]').val());
            //+ 첫 점의 위도
            var y1 = Number($('input[name="y-coordi-first"]').val());
            //+ 첫 점의 높이
            var z1 = Number($('input[name="z-coordi-first"]').val());

            //+ 끝 점의 경도
            var x2 = Number($('input[name="x-coordi-second"]').val());
            //+ 끝 점의 위도
            var y2 = Number($('input[name="y-coordi-second"]').val());
            //+ 끝 점의 높이
            var z2 = Number($('input[name="z-coordi-second"]').val());

            var point1 = {
                x: x1,
                y: y1,
                z: z1
            };

            var point2 = {
                x: x2,
                y: y2,
                z: z2
            };
            //+ 두점의 좌표를 전달해 getGeographicToWorld로 World 좌표로 변환 후
            //+ 가이드라인 타입에 따라 확장형, 기본형을 구분하여
            //+ 변환 된 World 좌표로 POI와 LINE을 화면 상에 출력하고 거리측정 목록에 추가합니다.
            analy.getResultFromCoordinate(point1, point2);
        });

        //+ 지하 시설물, 건물 선택시 체크박스 이벤트
        $(document).on('click', 'input[type=checkbox]', checked);

        $(document).on("change",'.select-target-layer', function(){
            let val = this.value;
            targetType = val;
            if(!analy) return;
            if(val === 'basic'){
                //self.analy.setIntersectFunction();
                analy.setIntersectTarget();  //기본 모드시 해당 함수들 초기화 필요
                return;
            }

            let layers = app.getInstanceByClassTypeLayers(val)
            let scenes =[];
            for (let i = 0; i < layers.length; i++) {
                let layer = layers[i];
                if (!layer.getVisible()) {
                    continue;
                }
                scenes.push(layer.getScene())
            }
            // if(!self.analy.getIntersectFunction())
            //     self.analy.setIntersectFunction(intersectFunction.bind(self)); // 세부적인 목록 선정시에 설정하여 사용
            analy.setIntersectTarget(scenes);
        })
        ////////////////////////////////////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////// function 생성 //////////////////////////////////////////////
        ///////////////////////////////////////////////////////////////////////////////////////////////////////


        function checked(e) {
            var $checkbox = $(e.target);
            var name = $checkbox.attr('target');
            //+ 영상 투명화 여부
            if (name == 'opacity_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableOpacityImageLayers(true)
                    app.setEnableOpacityModelLayers(true)
                    app.setEnableOpacityModelLayers(false)
                } else {
                    app.setEnableOpacityImageLayers(false)
                }
                return;
            }

            //+ 모델 투명화 여부
            if (name == 'm_opacity_yn') {
                if ($checkbox[0].checked) {
                    app.setEnableOpacityModelLayers(true)
                } else {
                    app.setEnableOpacityModelLayers(false)
                }
                return;
            } else if (LAYER_OPT[name] != undefined) {
                //+ name 해당하는 Layer show or hide
                createLayer(name);
                if ($checkbox[0].checked) {
                    app.showLayer(name, true)
                } else {
                    app.showLayer(name, false)
                }
                app.setUpdateDate();
            }
        }

        //+ Layer 생성
        function createLayer(name) {
            var layer = layers[name];
            if (layer === undefined) {
                //레이어 생성 및 APP에 레이어 추가
                let options = LAYER_OPT[name];
                switch (name) {
                    //+ 건물 //////////////////////////////////////////
                    case 'xdo':
                        //+ vworld Model layer
                        layer = new Union3D.model.U3dModelVWorldLayer(options);
                        app.addLayer(layer);
                        break;
                    case 'u3f':
                        //+ u3f model layer
                        layer = new Union3D.model.U3dModelU3FLayer(options);
                        app.addLayer(layer);
                        break;
                    case '_25d':
                        //+ wfs Model Layer
                        layer = new Union3D.model.U3dModelWFSLayer(options);
                        app.addLayer(layer);
                        break;

                    //+ 고도 /////////////////////////////////////////////
                    case 'korea_terrain':

                        layer = new Union3D.terrain.U3dHeightXYZLayer(options);
                        app.addLayer(layer);
                        break;

                    //+ 이미지 //////////////////////////////////////////
                    case 'emapbase':
                        //+ EmapBase
                        layer = app.createEmapBaseLayer(options);
                        break;
                    case 'emapsat':
                        //+ Emap 위성
                        layer = app.createEmapSatLayer(options);
                        break;

                    case 'base':
                        layer = new Union3D.image.U3dImageXYZLayer(options);
                        break;

                    default :
                        //레이어 생성 및 APP에 레이어 추가
                        //+ 지하시설물 wfs model layer 추가
                        options = LAYER_OPT[name];
                        layer = new Union3D.model.U3dModelWFSLayer(options);
                        app.addLayer(layer);
                }
                layers[name] = layer;
            }
        }

        //+ 영상, 모델 투명도 설정 slider
        function initSlider(type) {
            var id = '';
            var idhandle = '';
            var step = 0.01;
            switch (type) {
                case  'opacity': {
                    id = '#opacity';
                    idhandle = '#opacity-handle';
                }
                    break;
                case  'm-opacity': {
                    id = '#m-opacity';
                    idhandle = '#m-opacity-handle';
                }
                    break;
            }

            var handle = $(idhandle);
            $(id).slider({
                orientation: "horizontal",
                range: "min",
                value: 1,
                min: 0, // min value
                max: 1,
                step: step,
                create: function () {
                    var val = $(this).slider("value");
                    handle.text(val.toFixed(2));
                },
                slide: function (event, ui) {
                    handle.text(ui.value.toFixed(2));
                    switch (id) {
                        case  '#opacity': {
                            app.setOpacityImageLayers(ui.value);
                        }
                            break;
                        case  '#m-opacity': {
                            app.setOpacityModelLayers(ui.value);
                        }
                            break;
                    }
                },
                change: function (event, ui) {
                }
            });
        }

        //+ 대상 레이어 select option 추가
        function addSelctOtion (){
            let self = this;
            let dom = $('.select-target-layer');
            let layers = app.getLayers();
            layers.forEach(function(layer){
                let classtype = layer._classtype;
                let type = layer._type;
                if(type ==='model' && !targetList.includes(classtype))
                    targetList.push(classtype);
            })
            dom.empty();
            let basic = $("<option value='basic'>기본</option>");
            dom.append(basic)
            targetList.forEach(function (type){
                let option =  $(`<option value=${type}>${type}</option>`);
                dom.append(option);
            })

        }
        //+ 클릭 대상 선정 방법 설정 함수
        //+ AnalyDepth.setIntersectTarget 으로 설정 후에 자세한 항목으로 선정이 필요한 경우 설정하여 사용
        function intersectFunction(intersects){
            if(!intersects || intersects.length ===0) return;
            let result;
            for (let i = 0; i < intersects.length; i++) {
                let intersect = intersects[i];
                let object = intersect.object;
                let layerName = object.getLayerName();
                let layer = app.getLayerByName(layerName);
                if(!layer || layer._classtype !== targetType) continue;
                if (isNaN(intersect.point.z)) {
                    continue;
                }
                result = intersect;
                break;
            }
            return result
        }

        //+ 거리측정 목록 갱신
        function printDistanceList() {
            let self = this;
            let str = '';
            //+ getDistanceList 현재 거리측정 목록에 저장 되어있는 POI Group의 ID를 반환합니다.
            let dist = analy.getDistanceList();
            if (dist.length > 0) {
                dist.forEach(function (id) {
                    //+ getDistanceObject 해당 거리측정 목록에 정보를 저장하고 있는 객체
                    //+ length - 두점 사이의 거리
                    //+ point x, y, z - 점의 좌표
                    //+ fromTerrain 지표면에서 부터의 거리
                    //+ fromPrePoint 이전 지점과의 거리

                    let obj = analy.getDistanceObject();
                    if (!!(obj[id])) {
                        let distance = obj[id].length
                        let points =obj[id].points;
                        str += '<div class="d-flex edit-item" target="' + id + '">';
                        str += '<div class="flex-1"><label> id : ' + id + '</label>';
                        points.forEach(function(info, idx){
                            //+ POI 의 알람 목록
                            if (!!(info)) {
                                str += '<div class="flex-1">' +
                                    '  경도 ' +(idx+1)+' : ' + info.x + '<br>' +
                                    '  위도 ' +(idx+1)+' : ' + info.y + '<br>' +
                                    '  높이 ' +(idx+1)+' : ' + info.z + '<br>' +
                                    '  지표면에서 부터의 거리 ' +(idx+1)+' : ' + info.fromTerrain + '<br>' +
                                    '  이전 지점과의 거리 ' +(idx+1)+' : ' + info.fromPrePoint + '<br><br>';
                            }
                        })

                        str += '<div class="flex-1"><label> 측정 거리 : ' + distance + ' m </label>';
                        str += '<div class="text-right">';
                        str += '<div class="btn-group">';
                        str += '<div class="btn btn-xs btn-danger btn-poi-remove" id="' + id + '">삭제</div>';
                        str += '</div>';
                        str += '<hr style="border-width:1px 0 0 0; border-color:rgba(152,152,152,0.57);">';
                        str += '</div>';
                        str += '</div>';
                    }
                });
            }
            str = str === '' ? '<pre>추가된 내용이 없습니다</pre>' : str;
            $('.distance-list').html(str);
            $('.btn-poi-remove').off().on('click', function (e) {
                if(!analy) analy = app.getAnalysis('Depth');
                analy.removePOI(this.id);
                printDistanceList.call(self);
            });
        }
    });

</script>
